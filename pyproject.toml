[build-system]
requires = ["setuptools>=82.0.1", "defusedxml>=0.7.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is not a Python package - exclude all directories from package discovery
packages = []

[tool.setuptools.package-data]
"*" = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "benchmarks"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
timeout_method = "thread"

# Default lane: fast, deterministic, offline.
addopts = """
  -ra
  -q
  --strict-markers
  --strict-config
  --durations=20
  --tb=short
  -p no:xvfb
  -m "not slow and not live_simulation and not e2e and not requires_network and not content_lint"
"""

markers = [
  # ---- tier markers ----
  "unit: pure logic, fully mocked, < 100 ms wall-clock",
  "integration: cross-module / file-system / process boundaries, < 5 s",
  "e2e: full-stack smoke tests; nightly + release gate only",
  "slow: > 1 s wall-clock; deselect with -m 'not slow'",
  "live_simulation: requires a real physics / math engine; deselect by default",

  # ---- environment markers ----
  "requires_network: needs real outbound network; deselect by default",
  "requires_gpu: needs CUDA / Metal / ROCm",
  "requires_gl: needs OpenGL or a display",
  "headless_safe: verified under QT_QPA_PLATFORM=offscreen",

  # ---- per-engine markers ----
  "requires_mujoco: skip when import mujoco fails",
  "requires_drake: skip when import pydrake fails",
  "requires_pinocchio: skip when pinocchio is the stub PyPI wheel",
  "requires_opensim: skip when import opensim fails",
  "requires_matlab: skip when MATLAB Engine for Python is unavailable",

  # ---- workflow markers ----
  "serial: must run with -n 0 (xdist parallel breaks this test)",
  "benchmark: deterministic perf smoke; not a primary correctness gate",
  "smoke: release-blocking smoke; subset of e2e",

  # ---- repo-specific markers ----
  "content_lint: marks repository-content assertions that are skipped by default",
]

[tool.coverage.run]
source = ["src", "scripts"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/archive/*",
    "*/experimental/*",
]

[tool.coverage.report]
# Phase 4 step 2 bump: 65 -> 70. Continuing toward the
# Applications tier target of 75% (EPIC #1140).
fail_under = 75
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_any_explicit = false
disallow_any_generics = true
disallow_subclassing_any = true
follow_imports = "normal"
explicit_package_bases = true
exclude = "^(matlab/|matlab_optimized/|javascript/|docs/|content/|venv/|env/|\\.env/|node_modules/|tests/|scripts/)|(?:^|/)archive/|(?:^|/)Archive/"

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "pandas.*", "torch.*", "pytest.*", "moderngl.*", "numba.*", "psutil.*", "PyQt5.*", "PyQt6.*", "PySide6.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["archive.*", "legacy.*", "experimental.*"]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "tests/test_critical_physics_fixes.py",
    "venv",
    "env",
    ".env",
    "node_modules",
    "*.ipynb",
    "content",
    "docs",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C90"]
ignore = ["D", "RUF001"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "E501", "S108", "S603", "S102"]
"benchmarks/*" = ["S101"]
"tests/test_critical_physics_fixes.py" = ["F821", "E402", "E731", "F401"]
"src/tools/**/*.py" = ["E501", "S603", "S607"]
"scripts/**/*.py" = ["E501", "S603", "S607", "S108", "C901", "S310", "S314"]
"src/affine_control/swing_optimizer.py" = ["S101"]
"articles/**/*.py" = ["S603", "S607"]
"docs/**/*.py" = ["E501"]
"build-html.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "games", "tools"]

[tool.bandit]
exclude_dirs = ["tests", "benchmarks"]
skips = ["B101"]  # assert used in tests

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
  # Website content
  content
  | articles
  | docs
  | archive
  | legacy-pages
  | _templates
  | logo
  | pics
  | static
  | qmd
  | \.quarto
  # Website-related tools
  # Standard exclusions
  | \.git
  | __pycache__
  | \.venv
  | venv
  | env
  | node_modules
  | \.pytest_cache
  | \.pytest-tmp
  | \.tmp_validation_tmp
  | \.hypothesis
  | \.mypy_cache
  | \.ruff_cache
  | \.uv-cache
  | \.uv-tools
)/
'''
