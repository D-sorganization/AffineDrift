[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is not a Python package - exclude all directories from package discovery
packages = []

[tool.setuptools.package-data]
"*" = []

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
  # Website content
  content
  | articles
  | docs
  | archive
  | legacy-pages
  | _templates
  | logo
  | pics
  | static
  | qmd
  | \.quarto
  # Website-related tools
  # Standard exclusions
  | \.git
  | __pycache__
  | \.venv
  | venv
  | env
  | node_modules
  | \.pytest_cache
  | tests/test_assess_repo\.py
  | tests/test_validate_accessibility\.py
)/
'''

