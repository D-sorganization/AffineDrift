[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This is not a Python package - exclude all directories from package discovery
packages = []

[tool.setuptools.package-data]
"*" = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring cross-module or I/O integration",
]
addopts = "--tb=short"

[tool.coverage.run]
source = ["src", "scripts"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/archive/*",
    "*/experimental/*",
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ['py312']
exclude = '''
/(
  # Website content
  content
  | articles
  | docs
  | archive
  | legacy-pages
  | _templates
  | logo
  | pics
  | static
  | qmd
  | \.quarto
  # Website-related tools
  # Standard exclusions
  | \.git
  | __pycache__
  | \.venv
  | venv
  | env
  | node_modules
  | \.pytest_cache
)/
'''
