# AffineDrift dataset catalogue (WEB-07.7, issue #4549).
#
# Source of truth for the "Datasets" resource page. Regenerate the page with:
#   python3 -m scripts.generate_datasets_catalog
# CI verifies the page is current with:
#   python3 -m scripts.generate_datasets_catalog --check
#
# Licence and access fields reflect what each source publishes as of the date
# this entry was added; verify against the source before reuse. AffineDrift's
# own `data/` and `schemas/` artefacts have no declared data licence yet
# (tracked as WEB-07.8); their `licence` field says so rather than guessing.

third_party:
  - id: golfdb
    name: "GolfDB: A Video Database for Golf Swing Sequencing"
    description: >-
      GolfDB is a benchmark database for golf swing sequencing, consisting of 1400
      high-quality golf swing videos. Each video is labeled with event frames,
      bounding boxes, player information (name and sex), club type, and view type.
      The database was introduced alongside SwingNet, a lightweight deep neural
      network for detecting key events in golf swings. GolfDB enables consistent
      evaluation of golf swing sequencing performance and facilitates golf swing
      analysis through automated event detection. The database supports research in
      computer vision, biomechanics, and sports analytics for golf.
    paper_url: "https://arxiv.org/abs/1903.06528"
    repo_url: "https://github.com/wmcnally/golfdb"
    licence: "CC BY-NC 4.0, per the source repository"
    size: "1,400 golf swing video clips"
    modality: "Video, event-frame and bounding-box annotations"
    access: "Public download of video clips and labels via the source GitHub repository"
    citation: >-
      McNally, W., Vats, K., Pinto, T., Dulhanty, C., McPhee, J., & Wong, A. (2019).
      GolfDB: A Video Database for Golf Swing Sequencing. arXiv:1903.06528.

  - id: caddieset
    name: "CaddieSet: A Golf Swing Dataset with Human Joint Features and Ball Information"
    description: >-
      CaddieSet is a comprehensive golf swing dataset that includes joint
      information and ball trajectory data from single shots. The dataset extracts
      joint information from swing videos by segmenting them into eight swing
      phases using computer vision-based approaches. Based on expert golf domain
      knowledge, CaddieSet defines 15 key metrics that influence golf swing
      performance, enabling quantitative analysis of the relationship between swing
      posture and ball trajectory. The dataset supports interpretable models for
      predicting ball trajectories and provides swing feedback that is
      quantitatively consistent with established domain knowledge. CaddieSet offers
      new insights for golf swing analysis in both academic research and sports
      industry applications.
    paper_url: "https://arxiv.org/abs/2508.20491"
    repo_url: "https://github.com/damilab/CaddieSet"
    licence: "MIT, per the source repository"
    size: "1,757 shots (924 face-on, 833 down-the-line) from 8 golfers"
    modality: "Swing video (two camera angles), extracted joint features, ball-flight metrics"
    access: "Public download via the source GitHub repository"
    citation: >-
      CaddieSet: A Golf Swing Dataset with Human Joint Features and Ball
      Information. arXiv:2508.20491.

  - id: sportspose
    name: "SportsPose: A Dynamic 3D Sports Pose Dataset"
    description: >-
      SportsPose is a large-scale 3D human pose dataset consisting of highly
      dynamic sports movements. With more than 176,000 3D poses from 24 different
      subjects performing 5 different sports activities, SportsPose provides a
      diverse and comprehensive set of 3D poses that reflect the complex and
      dynamic nature of sports movements. The dataset has been quantitatively
      evaluated by comparing poses with a commercial marker-based system, achieving
      a mean error of 34.5 mm across all evaluation sequences. SportsPose contains
      more movement in extremum joints (wrists and ankles) than Human3.6M and 3DPW
      datasets, indicating more dynamic movements. The dataset is valuable for
      developing and evaluating models for sports performance analysis and injury
      prevention.
    paper_url: "https://arxiv.org/abs/2304.01865"
    repo_url: "https://github.com/ChristianIngwersen/SportsPose"
    licence: "Not stated by the publisher in the paper or source repository; confirm terms before reuse"
    size: "176,000+ 3D poses from 24 subjects across 5 sports"
    modality: "Multi-view video, 3D pose annotations"
    access: "Download via the project website linked from the source repository"
    citation: >-
      Ingwersen, C. K., Mikkelstrup, C., Jensen, J. N., Hannemose, M. R., &
      Dahl, A. B. (2023). SportsPose: A Dynamic 3D Sports Pose Dataset.
      arXiv:2304.01865.

  - id: movi
    name: "MoVi: A Large Multipurpose Motion and Video Dataset"
    description: >-
      MoVi is a comprehensive human Motion and Video dataset containing 60 female
      and 30 male actors performing a collection of 20 predefined everyday actions
      and sports movements, plus one self-chosen movement. The dataset was recorded
      in five capture rounds using different hardware systems, including optical
      motion capture, video cameras, and inertial measurement units (IMU). In
      total, MoVi contains 9 hours of motion capture data, 17 hours of video data
      from 4 different viewpoints (including one hand-held camera), and 6.6 hours
      of IMU data. The dataset includes state-of-the-art estimates of skeletal
      motions and full-body shape deformations, making it valuable for sports
      biomechanics research, character animation, and movement analysis
      applications.
    paper_url: "https://arxiv.org/abs/2003.01888"
    licence: "Non-commercial research licence, held by the dataset's authors at York University"
    size: "9h motion capture, 17h video (4 viewpoints), 6.6h IMU; 90 actors"
    modality: "Optical motion capture, video, IMU"
    access: >-
      Free download via the York University Scholars Portal Dataverse; requires
      acknowledging the non-commercial research licence before download
    citation: >-
      Ghorbani, S., Mahdaviani, K., Thaler, A., Kording, K., Cook, D. J.,
      Blohm, G., & Troje, N. F. (2021). MoVi: A large multi-purpose human motion
      and video dataset. arXiv:2003.01888.

affinedrift:
  - id: ztcf-fixtures
    name: "Forward ZTCF Intervention Fixtures"
    description: >-
      Forward zero-torque-counterfactual (ZTCF) intervention fixtures for the
      planar golf swing model, validated against the accompanying JSON Schema.
      Used to exercise the ZTCF construction and parity checks in the affine
      control simulation pipeline.
    directory: "data/ztcf"
    licence: "Not yet declared (tracked as WEB-07.8); repository code is MIT, see COPYRIGHT.md"
    modality: "JSON fixtures and JSON Schema (draft 2020-12)"
    access: "Included in the repository; no registration required"
    citation: "AffineDrift. Forward ZTCF Intervention Fixtures. See COPYRIGHT.md for reuse terms."
    schema: "ztcf_intervention_v1.schema.json"

  - id: research-protocols
    name: "Research Protocol Readiness Records"
    description: >-
      Manufactured (synthetic), non-participant protocol-readiness fixtures used
      to exercise the research-protocol pipeline ahead of any real data
      collection. These records authorize neither claim promotion nor data
      collection; see `public_summary.json` for the recorded authority
      boundaries.
    directory: "data/research_protocols"
    licence: "Not yet declared (tracked as WEB-07.8); repository code is MIT, see COPYRIGHT.md"
    modality: "JSON records"
    access: "Included in the repository; no registration required"
    citation: "AffineDrift. Research Protocol Readiness Records. See COPYRIGHT.md for reuse terms."

  - id: schemas
    name: "Companion and Research JSON Schemas"
    description: >-
      JSON Schemas governing AffineDrift's Programming Companion manifests,
      falsification atlases, evidence registries, and research-readiness
      records.
    directory: "schemas"
    licence: "Not yet declared (tracked as WEB-07.8); repository code is MIT, see COPYRIGHT.md"
    modality: "JSON Schema (draft 2020-12)"
    access: "Included in the repository; no registration required"
    citation: "AffineDrift. JSON Schemas. See COPYRIGHT.md for reuse terms."
