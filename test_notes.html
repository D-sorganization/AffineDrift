
    <!DOCTYPE html>
    <html>
    <head>
        <title>Test Notes Workspace</title>
    </head>
    <body>
        <script src="js/utils.js" type="module"></script>
        <script src="js/notes-workspace.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                // Open the notes panel
                const toggleBtn = document.getElementById('ad-notes-workspace-toggle');
                if(toggleBtn) toggleBtn.click();

                // Write some content
                const textArea = document.getElementById('ad-notes-workspace-area');
                if(textArea) textArea.value = 'Malicious Payload <script>alert(1)</script>';

                // Click the popout button
                const popoutBtn = document.querySelector('button[data-action="popout"]');
                if(popoutBtn) popoutBtn.click();
            });
        </script>
    </body>
    </html>
