<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-labelledby="title desc">
<title id="title">Fully Connected Neural Network</title>
<desc id="desc">Three input nodes connect to three hidden nodes by nine weights; the hidden nodes connect to two output nodes by six weights. Biases are omitted.</desc>
<rect width="600" height="320" rx="12" fill="#f7f8fa"/>
<line x1="90" y1="70" x2="300" y2="70" stroke="#66788a" stroke-width="2"/>
<line x1="90" y1="70" x2="300" y2="145" stroke="#66788a" stroke-width="2"/>
<line x1="90" y1="70" x2="300" y2="220" stroke="#66788a" stroke-width="2"/>
<line x1="90" y1="145" x2="300" y2="70" stroke="#66788a" stroke-width="2"/>
<line x1="90" y1="145" x2="300" y2="145" stroke="#66788a" stroke-width="2"/>
<line x1="90" y1="145" x2="300" y2="220" stroke="#66788a" stroke-width="2"/>
<line x1="90" y1="220" x2="300" y2="70" stroke="#66788a" stroke-width="2"/>
<line x1="90" y1="220" x2="300" y2="145" stroke="#66788a" stroke-width="2"/>
<line x1="90" y1="220" x2="300" y2="220" stroke="#66788a" stroke-width="2"/>
<line x1="300" y1="70" x2="510" y2="108" stroke="#66788a" stroke-width="2"/>
<line x1="300" y1="70" x2="510" y2="182" stroke="#66788a" stroke-width="2"/>
<line x1="300" y1="145" x2="510" y2="108" stroke="#66788a" stroke-width="2"/>
<line x1="300" y1="145" x2="510" y2="182" stroke="#66788a" stroke-width="2"/>
<line x1="300" y1="220" x2="510" y2="108" stroke="#66788a" stroke-width="2"/>
<line x1="300" y1="220" x2="510" y2="182" stroke="#66788a" stroke-width="2"/>
<circle cx="90" cy="70" r="23" fill="white" stroke="#183d59" stroke-width="2"/>
<text x="90" y="77" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">x1</text>
<circle cx="90" cy="145" r="23" fill="white" stroke="#183d59" stroke-width="2"/>
<text x="90" y="152" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">x2</text>
<circle cx="90" cy="220" r="23" fill="white" stroke="#183d59" stroke-width="2"/>
<text x="90" y="227" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">x3</text>
<text x="90" y="285" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">Input</text>
<circle cx="300" cy="70" r="23" fill="white" stroke="#183d59" stroke-width="2"/>
<text x="300" y="77" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">h1</text>
<circle cx="300" cy="145" r="23" fill="white" stroke="#183d59" stroke-width="2"/>
<text x="300" y="152" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">h2</text>
<circle cx="300" cy="220" r="23" fill="white" stroke="#183d59" stroke-width="2"/>
<text x="300" y="227" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">h3</text>
<text x="300" y="285" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">Hidden</text>
<circle cx="510" cy="108" r="23" fill="white" stroke="#183d59" stroke-width="2"/>
<text x="510" y="115" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">y1</text>
<circle cx="510" cy="182" r="23" fill="white" stroke="#183d59" stroke-width="2"/>
<text x="510" y="189" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">y2</text>
<text x="510" y="285" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#183d59">Output</text>
</svg>