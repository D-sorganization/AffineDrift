project:
  type: book

book:
  title: "Tangent-Space Methods for Nonlinear Control and Biomechanics"
  date: "2026-02-22"
  chapters:
    - index.qmd
    - volume0.qmd
    - volume1.qmd
    - volume2.qmd

bibliography:
  - ../geometry_of_motion.bib
  - ../../../references/affine-drift.bib

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          tex: {
            macros: {
              // Vector/matrix notation
              bm: ["\\boldsymbol{#1}", 1],
              mat: ["\\mathbf{#1}", 1],
              norm: ["\\left\\lVert #1 \\right\\rVert", 1],
              // Number sets
              Reals: "\\mathbb{R}",
              R: "\\mathbb{R}",
              // State-space shorthand
              state: "\\mathbf{x}",
              dx: "\\delta\\mathbf{x}",
              x: "\\mathbf{x}",
              control: "\\mathbf{u}",
              uvec: "\\mathbf{u}",
              statespace: "\\mathcal{X}",
              configspace: "\\mathcal{Q}",
              traj: "\\xi",
              // Lie groups / screw theory
              SO: ["\\mathrm{SO}(#1)", 1],
              SE: ["\\mathrm{SE}(#1)", 1],
              so: ["\\mathfrak{so}(#1)", 1],
              se: ["\\mathfrak{se}(#1)", 1],
              screw: "\\mathcal{S}",
              twist: "\\mathcal{V}",
              wrench: "\\mathcal{F}"
            }
          }
        };
        </script>
  pdf:
    documentclass: book
    fontsize: 10pt
    geometry:
      - margin=1.5in
    include-in-header:
      text: |
        \usepackage{amsmath,amssymb}
        \usepackage[most]{tcolorbox}
        \newtcolorbox{intuitionbox}{breakable,colback=blue!3,colframe=blue!45!black,title=Intuition}
        \newtcolorbox{warningbox}{breakable,colback=yellow!8,colframe=yellow!45!black,title=Warning}
        \providecommand{\bm}[1]{\boldsymbol{#1}}
        \providecommand{\mat}[1]{\mathbf{#1}}
        \providecommand{\norm}[1]{\left\lVert #1 \right\rVert}
        \providecommand{\Reals}{\mathbb{R}}
        \providecommand{\R}{\mathbb{R}}
        \providecommand{\x}{\mathbf{x}}
        \providecommand{\state}{\mathbf{x}}
        \providecommand{\dx}{\delta\mathbf{x}}
        \providecommand{\control}{\mathbf{u}}
        \providecommand{\uvec}{\mathbf{u}}
        \providecommand{\statespace}{\mathcal{X}}
        \providecommand{\configspace}{\mathcal{Q}}
        \providecommand{\traj}{\xi}
        \providecommand{\SO}{\mathrm{SO}}
        \providecommand{\SE}{\mathrm{SE}}
        \providecommand{\so}{\mathfrak{so}}
        \providecommand{\se}{\mathfrak{se}}
        \providecommand{\screw}{\mathcal{S}}
        \providecommand{\twist}{\mathcal{V}}
        \providecommand{\wrench}{\mathcal{F}}
    keep-tex: true
    number-sections: true
