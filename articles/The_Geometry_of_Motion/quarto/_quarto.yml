project:
  type: book

book:
  title: "Tangent-Space Methods for Nonlinear Control and Biomechanics"
  date: "2026-02-22"
  chapters:
    - index.qmd
    - volume0.qmd
    - volume1.qmd
    - volume2.qmd

bibliography:
  - ../geometry_of_motion.bib
  - ../../../references/affine-drift.bib

format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    include-in-header:
      text: |
        <script>
        window.MathJax = {
          tex: {
            macros: {
              // Vector/matrix notation
              bm: ["\\boldsymbol{#1}", 1],
              mat: ["\\mathbf{#1}", 1],
              norm: ["\\left\\lVert #1 \\right\\rVert", 1],
              // Number sets
              Reals: "\\mathbb{R}",
              R: "\\mathbb{R}",
              // State-space shorthand
              state: "\\mathbf{x}",
              dx: "\\delta\\mathbf{x}",
              x: "\\mathbf{x}",
              control: "\\mathbf{u}",
              uvec: "\\mathbf{u}",
              statespace: "\\mathcal{X}",
              configspace: "\\mathcal{Q}",
              traj: "\\xi",
              // Lie groups / screw theory
              SO: "\\mathrm{SO}(3)",
              SE: "\\mathrm{SE}(3)",
              so: "\\mathfrak{so}(3)",
              se: "\\mathfrak{se}(3)",
              screw: "\\mathcal{S}",
              twist: "\\mathcal{V}",
              wrench: "\\mathcal{F}"
            }
          }
        };
        </script>
  pdf:
    documentclass: book
    fontsize: 10pt
    geometry:
      - margin=1.5in
    include-in-header:
      text: |
        \usepackage{../geometry_of_motion}
        \usepackage{amsthm}
        \usepackage{tikz}
        \usepackage{pgfplots}
        \pgfplotsset{compat=1.18}
        \usetikzlibrary{arrows.meta,decorations.markings,calc,patterns,positioning,3d}
        \makeatletter
        \providecommand{\gomdeclareextraquartoenvs}{%
          \@ifundefined{assumption}{\newtheorem{assumption}[theorem]{Assumption}}{}%
          \@ifundefined{corollary}{\newtheorem{corollary}[theorem]{Corollary}}{}%
          \@ifundefined{warning}{\newtheorem{warning}[theorem]{Warning}}{}%
        }%
        \gomdeclareextraquartoenvs
        \makeatother
        \newtcolorbox{intuitionbox}[1][]{colback=chapblue!5,colframe=chapblue!70!black,title={Intuition},breakable,#1}
        \newtcolorbox{designbox}[1][]{colback=trajgreen!5,colframe=trajgreen!60!black,title={Design Note},breakable,#1}
        \newtcolorbox{warningbox}[1][]{colback=accentred!5,colframe=accentred!70!black,title={Warning},breakable,#1}
        \newtcolorbox{axiombox}[1][]{colback=darkgold!5,colframe=darkgold!80!black,title={Principle},breakable,#1}
        \renewcommand{\boldsymbol}[1]{\symbf{#1}}
        \renewcommand{\bm}[1]{\symbf{#1}}
        \renewcommand{\vec}[1]{\bm{#1}}
        \providecommand{\N}{\mathbb{N}}
        \providecommand{\abs}[1]{\left\lvert #1 \right\rvert}
        \providecommand{\trace}{\operatorname{tr}}
        \providecommand{\diag}{\operatorname{diag}}
        \providecommand{\rank}{\operatorname{rank}}
        \providecommand{\ad}{\mathrm{ad}}
        \providecommand{\E}{\mathbb{E}}
        \providecommand{\x}{\vec{x}}
        \providecommand{\q}{\vec{q}}
        \providecommand{\uvec}{\vec{u}}
        \providecommand{\y}{\vec{y}}
        \providecommand{\dx}{\delta\vec{x}}
        \providecommand{\du}{\delta\vec{u}}
        \providecommand{\dq}{\delta\vec{q}}
        \providecommand{\xx}{\mathbf{x}\mathbf{x}}
        \providecommand{\uu}{\mathbf{u}\mathbf{u}}
        \providecommand{\xu}{\mathbf{x}\mathbf{u}}
        \providecommand{\Span}{\operatorname{span}}
        \providecommand{\sym}{\operatorname{sym}}
        \providecommand{\skewpart}{\operatorname{skew}}
        \providecommand{\argmin}{\operatorname*{arg\,min}}
        \providecommand{\argmax}{\operatorname*{arg\,max}}
        \providecommand{\manifold}{\mathcal{M}}
        \providecommand{\configspace}{\mathcal{Q}}
        \providecommand{\statespace}{\mathcal{X}}
        \providecommand{\controlspace}{\mathcal{U}}
        \providecommand{\tube}{\mathcal{T}}
        \providecommand{\screw}{\mathcal{S}}
        \providecommand{\twist}{\mathcal{V}}
        \providecommand{\wrench}{\mathcal{F}}
        \providecommand{\tangent}{\bm{T}}
        \providecommand{\normal}{\bm{N}}
        \providecommand{\binormal}{\bm{B}}
        \providecommand{\frenet}{\bm{e}}
        \providecommand{\ds}{\dd s}
        \providecommand{\Sone}{S^1}
        \providecommand{\Stwo}{S^2}
        \providecommand{\Sthree}{S^3}
        \providecommand{\SOthree}{\mathrm{SO}(3)}
        \providecommand{\SEthree}{\mathrm{SE}(3)}
        \providecommand{\SOtwo}{\mathrm{SO}(2)}
        \providecommand{\SEtwo}{\mathrm{SE}(2)}
        \providecommand{\Amat}{\bm{A}}
        \providecommand{\Bmat}{\bm{B}}
        \providecommand{\Cmat}{\bm{C}}
        \providecommand{\Mmat}{\bm{M}}
        \providecommand{\PhiMat}{\bm{\Phi}}
        \providecommand{\gvec}{\bm{g}}
        \providecommand{\Torus}{\mathbb{T}}
        \providecommand{\monodromy}{\mathcal{M}}
        \providecommand{\orbit}{\mathcal{O}}
        \providecommand{\poincare}{\mathcal{P}}
        \providecommand{\skewmat}[1]{\widehat{#1}}
        \providecommand{\sothree}{\mathfrak{so}(3)}
        \providecommand{\tangentbundle}{T\mathcal{M}}
        \providecommand{\tangentspace}[1]{T_{#1}\mathcal{M}}
        \providecommand{\transverse}{\perp}
    keep-tex: true
    number-sections: true
