# Shared metadata for all articles
format:
  html:
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    # Articles are the one part of the site that shows Python reference
    # implementations, so readers need the source-download menu Quarto's
    # code-tools provides. The site default (_quarto.yml) is false (#4538).
    code-tools: true
    css: ../styles.css
