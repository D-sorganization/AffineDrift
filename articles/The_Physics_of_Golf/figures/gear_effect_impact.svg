<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="title desc">
  <title id="title">Off-centre impact and gear effect</title>
  <desc id="desc">Club head center of mass, contact offset r, normal impulse J, and yaw rate delta omega from heel offset impact.</desc>
  <rect width="480" height="280" fill="#ffffff"/>
  <rect x="120" y="70" width="240" height="140" rx="12" fill="#e8f0fa" stroke="#2c5282" stroke-width="2"/>
  <circle cx="200" cy="140" r="6" fill="#2c5282"/>
  <text x="208" y="132" font-family="sans-serif" font-size="12" fill="#1a365d">COM</text>
  <circle cx="300" cy="125" r="8" fill="#c53030" stroke="#742a2a"/>
  <text x="308" y="120" font-family="sans-serif" font-size="12" fill="#742a2a">contact</text>
  <line x1="200" y1="140" x2="300" y2="125" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="148" font-family="sans-serif" font-size="13" fill="#2d3748">r</text>
  <line x1="300" y1="125" x2="360" y2="125" stroke="#276749" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="325" y="116" font-family="sans-serif" font-size="13" fill="#276749">J n-hat</text>
  <path d="M 200 140 A 45 45 0 0 1 230 105" fill="none" stroke="#805ad5" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="225" y="95" font-family="sans-serif" font-size="13" fill="#553c9a">delta omega</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="currentColor"/>
    </marker>
  </defs>
</svg>
