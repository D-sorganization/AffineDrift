<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280" role="img" aria-labelledby="ptitle pdesc">
  <title id="ptitle">Breaking putt and hole capture boundary</title>
  <desc id="pdesc">Curved putt path on a sloped green approaching a hole with a shaded capture speed region at the rim.</desc>
  <rect width="480" height="280" fill="#f0fff4"/>
  <ellipse cx="380" cy="140" rx="34" ry="34" fill="#ffffff" stroke="#2f855a" stroke-width="3"/>
  <ellipse cx="380" cy="140" rx="20" ry="20" fill="#c6f6d5" stroke="#22543d" stroke-width="1"/>
  <path d="M 40 210 C 120 200, 200 150, 360 140" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <circle cx="360" cy="140" r="6" fill="#2b6cb0"/>
  <text x="40" y="230" font-family="sans-serif" font-size="12" fill="#2d3748">start (cross-slope velocity)</text>
  <text x="320" y="95" font-family="sans-serif" font-size="12" fill="#22543d">v_c less than 1.63 m/s capture</text>
  <rect x="280" y="168" width="180" height="42" fill="#fefcbf" stroke="#d69e2e" rx="4"/>
  <text x="290" y="186" font-family="sans-serif" font-size="11" fill="#744210">Holmes / Penner capture boundary</text>
  <text x="290" y="202" font-family="sans-serif" font-size="11" fill="#744210">at hole rim (speed vs offset)</text>
</svg>
