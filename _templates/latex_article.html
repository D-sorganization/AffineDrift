<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{description}}">
    <title>{{title}} - AffineDrift</title>
    <!-- Google Fonts - Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Preconnect to CDN for faster loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="icon" type="image/x-icon" href="../../../favicon.ico">
    <link rel="icon" type="image/x-icon" sizes="16x16" href="../../../favicon.ico">
    <link rel="icon" type="image/x-icon" sizes="32x32" href="../../../favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../../../logo/Logo Transparent/1.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../../logo/Logo Transparent/1.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../../logo/Logo Transparent/1.png">
    <meta name="theme-color" content="#0f4c75">
    <!-- MathJax for mathematical notation -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true,
                processEnvironments: true
            },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        .equation {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            border-left: 4px solid #3282b8;
            overflow-x: auto;
        }

        .article-content h2 {
            color: #0f4c75;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e7f3ff;
        }

        .article-content h3 {
            color: #3282b8;
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        .article-content h4 {
            color: #3282b8;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .article-content p {
            margin-bottom: 1.25rem;
            line-height: 1.8;
        }

        .article-content ul,
        .article-content ol {
            margin-bottom: 1.5rem;
            line-height: 1.8;
        }

        .article-content li {
            margin-bottom: 0.5rem;
        }

        .article-content code {
            background: #f8f9fa;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .abstract-section {
            background: #e7f3ff;
            padding: 2rem;
            border-radius: 8px;
            margin: 2rem 0;
            border-left: 4px solid #3282b8;
        }

        .abstract-section h2 {
            margin-top: 0;
            color: #0f4c75;
        }

        .keypoint-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border-radius: 8px;
        }

        .limitation-box {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 1.5rem;
            margin: 1.5rem 0;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <header>
        <nav class="top-nav">
            <div class="container">
                <a href="../../../index.html" class="logo-link">
                    <img src="../../../logo/Logo Transparent/1.png" alt="AffineDrift Logo" class="logo-img">
                </a>
                <ul class="nav-links">
                    <li><a href="../../../index.html">Affine Drift</a></li>
                    <li><a href="../../../articles.html">Articles</a></li>
                    <li><a href="../../../research-reviews.html">Reviews</a></li>
                    <li><a href="../../../resources.html">Resources</a></li>
                    <li><a href="../../../contact.html">Contact</a></li>
                    <li><a href="../../../about.html">About</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <div class="layout-wrapper">
        <aside class="sidebar" id="history-sidebar">
            <nav class="sidebar-nav">
                <div class="sidebar-section">
                    <h3 class="sidebar-heading">Recent Pages</h3>
                    <ul class="sidebar-links" id="history-list">
                        <li class="history-empty">No recent pages yet</li>
                    </ul>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <section class="page-header">
                <div class="container">
                    <h1>{{title}}</h1>
                </div>
            </section>

            <section class="article-section">
                <div class="container">
                    <article class="article-content">
                        {{content}}
                    </article>
                </div>
            </section>
        </main>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 AffineDrift. Exploring the mathematics of motion.</p>
            <p class="footer-tagline">The past shapes the present</p>
        </div>
    </footer>

</body>

</html>
