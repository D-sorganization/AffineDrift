project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "articles/*.qmd"
    - "articles/Tangent Hyperplane Articles/Tangent_Hyperplanes_Unified_Thesis.qmd"
    - "articles/Tangent Hyperplane Articles/Advanced/Residual-Aware_Control.qmd"
    - "articles/Tangent Hyperplane Articles/Advanced/Contraction_Tangent_Unification.qmd"
    - "articles/Tangent Hyperplane Articles/Advanced/Hybrid_Tangent_Spaces.qmd"
  resources:
    - data/
    - manifest.json
    - service-worker.js
    - offline.html

website:
  title: "AffineDrift"
  site-url: "https://affinedrift.com"
  favicon: favicon.ico

  navbar:
    logo: logo/logo_transparent_1.png
    logo-alt: "AffineDrift Logo"
    left:
      - text: "Home"
        href: index.html
      - text: "Overview"
        href: overview.html
      - text: "Articles"
        menu:
          - text: "Drifter Manifesto"
            href: drifter-manifesto.html
          - text: "Tangent Hyperplanes"
            href: tangent-hyperplanes.html
          - text: "Articles"
            href: articles.html
          - text: "Research Reviews"
            href: research-reviews.html
          - text: "Book Reviews"
            href: book-reviews.html
      - text: "Models"
        href: models.html
      - text: "Resources"
        menu:
          - text: "Videos"
            href: resources-videos.html
          - text: "Software"
            href: resources-software.html
          - text: "Websites"
            href: resources-websites.html
          - text: "Datasets"
            href: resources-datasets.html
          - text: "Books"
            href: resources-books.html
          - text: "Papers"
            href: resources-papers.html
          - text: "Researchers"
            href: resources-researchers.html
          - text: "NotebookLM"
            href: resources-notebooklm.html
          - text: "Bibliography"
            href: bibliography.html
      - text: "Repositories"
        menu:
          - text: "D-sorganization: Golf Modeling Suite"
            href: https://github.com/D-sorganization/Golf_Modeling_Suite
      - text: "Contact"
        menu:
          - text: "Contact"
            href: contact.html
          - text: "About"
            href: about.html
          - text: "Collaborate"
            href: collaborate.html

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    css:
      - styles.css
      - css/search-metrics.css
    toc: false
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: false
    html-math-method: mathjax
    include-in-header:
      - text: |
          <!-- SEO: Open Graph / Twitter Cards -->
          <meta property="og:site_name" content="AffineDrift">
          <meta property="og:type" content="website">
          <meta property="og:locale" content="en_US">
          <meta property="og:image" content="https://affinedrift.com/logo/logo_transparent_1.png">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:image" content="https://affinedrift.com/logo/logo_transparent_1.png">

          <!-- SEO: JSON-LD Structured Data -->
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "AffineDrift",
            "url": "https://affinedrift.com",
            "description": "Applying affine control theory to understand golf swing biomechanics",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://affinedrift.com/bibliography.html?q={search_term_string}",
              "query-input": "required name=search_term_string"
            },
            "author": {
              "@type": "Person",
              "name": "Dieter Olson"
            },
            "publisher": {
              "@type": "Organization",
              "name": "AffineDrift",
              "logo": {
                "@type": "ImageObject",
                "url": "https://affinedrift.com/logo/logo_transparent_1.png"
              }
            }
          }
          </script>

          <!-- SEO: Additional meta tags -->
          <meta name="robots" content="index, follow">
          <meta name="googlebot" content="index, follow">
          <meta name="author" content="Dieter Olson">
          <meta name="keywords" content="golf biomechanics, control theory, affine systems, drift dynamics, robotics, swing mechanics, double pendulum, motor control">
          <link rel="canonical" href="https://affinedrift.com">

          <!-- Performance: Preload critical resources -->
          <link rel="preload" href="/styles.css" as="style">
          <link rel="preload" href="/script.js" as="script">
          <link rel="modulepreload" href="/js/metrics.js">

          <!-- PWA and Mobile Optimization -->
          <link rel="manifest" href="/manifest.json">
          <meta name="theme-color" content="#1a1a2e">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="AffineDrift">
          <link rel="apple-touch-icon" href="/logo/logo_transparent_1.png">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="format-detection" content="telephone=no">

          <!-- Preconnect and Fonts -->
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
          <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
          <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
          <link rel="alternate" type="application/rss+xml" title="AffineDrift RSS Feed" href="/feed.xml">
          <style>
            .rss-feed-link {
              display: inline-flex;
              align-items: center;
              justify-content: center;
              width: 2rem;
              height: 2rem;
              color: rgba(255, 255, 255, 0.8);
              text-decoration: none;
              border-radius: 4px;
              transition: all 0.2s ease;
              margin-left: 0.5rem;
            }
            .rss-feed-link:hover {
              color: #ffa500;
              background-color: rgba(255, 165, 0, 0.1);
            }
            .rss-feed-link svg {
              width: 1.25rem;
              height: 1.25rem;
              fill: currentColor;
            }
            .quarto-navbar-tools {
              display: flex;
              align-items: center;
            }
          </style>
          <script>
            document.addEventListener('DOMContentLoaded', function() {
              const navbarTools = document.querySelector('.quarto-navbar-tools');
              if (navbarTools) {
                // Add search button
                if (!navbarTools.querySelector('.search-trigger')) {
                  const searchBtn = document.createElement('button');
                  searchBtn.className = 'search-trigger';
                  searchBtn.title = 'Search (Ctrl+K)';
                  searchBtn.setAttribute('aria-label', 'Open search');
                  searchBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/></svg> <span>Search</span> <kbd>⌘K</kbd>';
                  searchBtn.onclick = function() {
                    if (window.AffineDriftSearch) {
                      window.AffineDriftSearch.openModal();
                    }
                  };
                  navbarTools.insertBefore(searchBtn, navbarTools.firstChild);
                }
                // Add RSS link
                if (!navbarTools.querySelector('.rss-feed-link')) {
                  const rssLink = document.createElement('a');
                  rssLink.href = '/feed.xml';
                  rssLink.className = 'rss-feed-link';
                  rssLink.title = 'RSS Feed';
                  rssLink.setAttribute('aria-label', 'RSS Feed');
                  rssLink.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M6.503 20.752c0 1.794-1.456 3.248-3.251 3.248-1.796 0-3.252-1.454-3.252-3.248 0-1.794 1.456-3.248 3.252-3.248 1.795.001 3.251 1.454 3.251 3.248zm-6.503-12.572v4.811c6.05.062 10.96 4.966 11.022 11.009h4.817c-.062-8.71-7.118-15.758-15.839-15.82zm0-3.368c10.58.046 19.152 8.594 19.183 19.188h4.817c-.03-13.231-10.755-23.954-24-24v4.812z"/></svg>';
                  navbarTools.appendChild(rssLink);
                }
              }
            });
          </script>
    include-after-body:
      - text: |
          <script>
            (function() {
              const offsetMeta = document.querySelector('meta[name="quarto:offset"]');
              const base = offsetMeta ? offsetMeta.getAttribute('content') : '/';
              const normalizedBase = base.endsWith('/') ? base : `${base}/`;
              const script = document.createElement('script');
              script.src = `${normalizedBase}script.js`;
              document.body.appendChild(script);
            })();
          </script>
          <script>
            // Register Service Worker for PWA support
            if ('serviceWorker' in navigator) {
              window.addEventListener('load', function() {
                navigator.serviceWorker.register('/service-worker.js')
                  .catch(function(error) {
                    console.warn('ServiceWorker registration failed:', error);
                  });
              });
            }
          </script>

# Metadata for all pages
metadata:
  lang: "en"
