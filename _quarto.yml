format:
  html:
    theme:
      light: [cosmo, custom.scss]
    css:
      - css/startup-launcher.css
      - styles.css
      - css/search-metrics.css
    toc: false
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: false
    html-math-method: mathjax
    include-in-header:
      - text: |
          <!-- SEO: Open Graph / Twitter Cards -->
          <meta property="og:site_name" content="AffineDrift">
          <meta property="og:type" content="website">
          <meta property="og:locale" content="en_US">
          <meta property="og:image" content="https://affinedrift.com/logo/logo_transparent_1.png">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:image" content="https://affinedrift.com/logo/logo_transparent_1.png">

          <!-- SEO: JSON-LD Structured Data -->
          <script type="application/ld+json">
          {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "AffineDrift",
            "url": "https://affinedrift.com",
            "description": "Applying affine control theory to understand golf swing biomechanics",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://affinedrift.com/bibliography.html?q={search_term_string}",
              "query-input": "required name=search_term_string"
            },
            "author": {
              "@type": "Person",
              "name": "Dieter Olson"
            },
            "publisher": {
              "@type": "Organization",
              "name": "AffineDrift",
              "logo": {
                "@type": "ImageObject",
                "url": "https://affinedrift.com/logo/logo_transparent_1.png"
              }
            }
          }
          </script>

          <!-- SEO: Additional meta tags -->
          <meta name="robots" content="index, follow">
          <meta name="googlebot" content="index, follow">
          <meta name="author" content="Dieter Olson">
          <meta name="keywords" content="golf biomechanics, control theory, affine systems, drift dynamics, robotics, swing mechanics, double pendulum, motor control">
          <link rel="canonical" href="https://affinedrift.com">

          <!-- Performance: Preload critical resources -->
          <link rel="preload" href="/css/startup-launcher.css" as="style">
          <link rel="preload" href="/styles.css" as="style">
          <link rel="preload" href="/script.js" as="script">
          <link rel="modulepreload" href="/js/main.js">
          <link rel="preload" href="/js/startup-launcher.js" as="script">
          <link rel="modulepreload" href="/js/utils.js">
          <link rel="modulepreload" href="/js/metrics.js">

          <!-- Startup Launcher: Load immediately for splash screen -->
          <script src="/js/startup-launcher.js"></script>

          <!-- PWA and Mobile Optimization -->
          <link rel="manifest" href="/manifest.json">
          <meta name="theme-color" content="#1a1a2e">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="AffineDrift">
          <link rel="apple-touch-icon" href="/logo/logo_transparent_1.png">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="format-detection" content="telephone=no">

          <!-- Preconnect and Fonts -->
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
          <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
          <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
          <link rel="alternate" type="application/rss+xml" title="AffineDrift RSS Feed" href="/feed.xml">
          <style>
            .rss-feed-link {
              display: inline-flex;
              align-items: center;
              justify-content: center;
              width: 2rem;
              height: 2rem;
              color: rgba(255, 255, 255, 0.8);
              text-decoration: none;
              border-radius: 4px;
              transition: all 0.2s ease;
              margin-left: 0.5rem;
            }
            .rss-feed-link:hover {
              color: #ffa500;
              background-color: rgba(255, 165, 0, 0.1);
            }
            .rss-feed-link svg {
              width: 1.25rem;
              height: 1.25rem;
              fill: currentColor;
            }
            .quarto-navbar-tools {
              display: flex;
              align-items: center;
            }
          </style>

      - _includes/mathjax-loader.html
    include-after-body:
      - text: |
          <script>
            (function() {
              const offsetMeta = document.querySelector('meta[name="quarto:offset"]');
              const base = offsetMeta ? offsetMeta.getAttribute('content') : '/';
              const normalizedBase = base.endsWith('/') ? base : `${base}/`;
              
              // Try to load modular ES6 version first, fallback to legacy bundle
              const moduleScript = document.createElement('script');
              moduleScript.type = 'module';
              moduleScript.src = `${normalizedBase}js/main.js`;
              
              // Fallback for browsers without ES module support
              const noModuleScript = document.createElement('script');
              noModuleScript.setAttribute('nomodule', '');
              noModuleScript.src = `${normalizedBase}script.js`;
              
              document.body.appendChild(moduleScript);
              document.body.appendChild(noModuleScript);
            })();
          </script>
          <script>
            // Register Service Worker for PWA support
            if ('serviceWorker' in navigator) {
              window.addEventListener('load', function() {
                navigator.serviceWorker.register('/service-worker.js')
                  .catch(function(error) {
                    console.warn('ServiceWorker registration failed:', error);
                  });
              });
            }
          </script>

# Metadata for all pages
metadata:
  lang: "en"
