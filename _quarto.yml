format:
  html:
    theme:
      light: [cosmo, custom.scss]
    css: styles.css
    toc: false
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: false
    html-math-method: mathjax
    mathjax:
      url: "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"
    include-in-header:
      - text: |

          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
          <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous">
          <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
          <link rel="alternate" type="application/rss+xml" title="AffineDrift RSS Feed" href="/feed.xml">
          <style>
            .rss-feed-link {
              display: inline-flex;
              align-items: center;
              justify-content: center;
              width: 2rem;
              height: 2rem;
              color: rgba(255, 255, 255, 0.8);
              text-decoration: none;
              border-radius: 4px;
              transition: all 0.2s ease;
              margin-left: 0.5rem;
            }
            .rss-feed-link:hover {
              color: #ffa500;
              background-color: rgba(255, 165, 0, 0.1);
            }
            .rss-feed-link svg {
              width: 1.25rem;
              height: 1.25rem;
              fill: currentColor;
            }
            .quarto-navbar-tools {
              display: flex;
              align-items: center;
            }
          </style>
          <script type="text/javascript">
          window.MathJax = {
            loader: {
              load: ['[tex]/ams', '[tex]/newcommand', '[tex]/mathtools']
            },
            tex: {
              packages: {'[+]': ['ams', 'newcommand', 'mathtools']},
              inlineMath: [['$', '$'], ['\\(', '\\)']],
              displayMath: [['$$', '$$'], ['\\[', '\\]']],
              processEscapes: true,
              processEnvironments: true,
              processRefs: true,
              digits: /^(?:[0-9]+(?:,[0-9]{3})*(?:\.[0-9]*)?|\.[0-9]+)/,
              tags: 'ams',
              tagSide: 'right',
              tagIndent: '0.8em',
              multlineWidth: '85%',
              maxMacros: 10000,
              maxBuffer: 5120
            },
            chtml: {
              scale: 1.0,
              minScale: 0.5,
              mtextInheritFont: false,
              merrorInheritFont: true,
              mathmlSpacing: false,
              skipAttributes: {},
              exFactor: 0.5,
              displayAlign: 'center',
              displayIndent: '0'
            },
            svg: {
              scale: 1.0,
              minScale: 0.5,
              mtextInheritFont: false,
              merrorInheritFont: true,
              mathmlSpacing: false,
              skipAttributes: {},
              exFactor: 0.5,
              displayAlign: 'center',
              displayIndent: '0'
            },
            startup: {
              pageReady: function() {
                return MathJax.startup.defaultPageReady();
              }
            }
          };
          </script>
          <script>
            document.addEventListener('DOMContentLoaded', function() {
              const navbarTools = document.querySelector('.quarto-navbar-tools');
              if (navbarTools && !navbarTools.querySelector('.rss-feed-link')) {
                const rssLink = document.createElement('a');
                rssLink.href = '/feed.xml';
                rssLink.className = 'rss-feed-link';
                rssLink.title = 'RSS Feed';
                rssLink.setAttribute('aria-label', 'RSS Feed');
                rssLink.innerHTML = `
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M6.503 20.752c0 1.794-1.456 3.248-3.251 3.248-1.796 0-3.252-1.454-3.252-3.248 0-1.794 1.456-3.248 3.252-3.248 1.795.001 3.251 1.454 3.251 3.248zm-6.503-12.572v4.811c6.05.062 10.96 4.966 11.022 11.009h4.817c-.062-8.71-7.118-15.758-15.839-15.82zm0-3.368c10.58.046 19.152 8.594 19.183 19.188h4.817c-.03-13.231-10.755-23.954-24-24v4.812z"/>
                  </svg>
                `;
                navbarTools.appendChild(rssLink);
              }
            });
          </script>
    include-after-body:
      - text: |
          <footer>
            <div class="container">
              <p>&copy; 2025. Affine Drift Effin Matters.</p>
            </div>
          </footer>
          <script src="script.js"></script>
          <script>
          // MathJax automatically typesets content after startup, but we check for
          // equations in HTML blocks that might need reprocessing after DOM is fully loaded
          document.addEventListener('DOMContentLoaded', function() {
            if (window.MathJax && window.MathJax.typesetPromise) {
              // Only manually typeset if there are unprocessed math elements
              // MathJax automatically typesets on startup, so this is only for edge cases
              const hasUnprocessedMath = document.querySelector('mjx-container:not([processed]), [class*="math"]:not([processed])');
              if (hasUnprocessedMath) {
                MathJax.startup.promise.then(function() {
                  return MathJax.typesetPromise();
                }).catch(function(err) {
                  console.log('MathJax typeset error:', err);
                });
              }
            }
          });
          </script>


# Metadata for all pages
metadata:
  lang: "en"
