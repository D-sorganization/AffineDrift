project:
  type: website
  output-dir: _site
  post-render:
    - python3 scripts/post_render_citations.py
    # Moves the static skip link ahead of the navbar (#4566); Quarto places
    # include-before-body content inside <main>.
    - python3 scripts/move_skip_link.py
  render:
    - "*.qmd"
    - "pages/**/*.qmd"
    - "reports/scientific-claim-audit.md"
    - "resources/**/*.qmd"
    - "models/**/*.qmd"
    - "evidence/**/*.qmd"
    - "repositories/**/*.qmd"
    - "articles/**/*.qmd"
    - "!articles/tangent-hyperplane-contraction/**/*.qmd"
    - "!articles/tangent-hyperplane-articles/CRITICS_CORNER.qmd"
    - "!articles/tangent-hyperplane-articles/Drafts_Original_Articles/**/*.qmd"
    - "!articles/tangent-hyperplane-articles/Advanced/*_CRITIC.qmd"
    - "!articles/proximal_distal_companion/chapters/**/*.qmd"
    - "!articles/The_Geometry_of_Motion/quarto/volume2_content.qmd"
    - "books/**/*.qmd"
    - "critiques/index.qmd"
    - "critiques/*.md"
    - "!critiques/INLINE_SUGGESTIONS.md"
  resources:
    - articles/forward_dynamics_matching/matching-forward-dynamics-draft.pdf
    - articles/forward_dynamics_matching/source_manifest.json
    - articles/forward_dynamics_matching/link_validation.json
    - data/
    - schemas/research-protocol-readiness-v1.schema.json
    - schemas/proximal-distal-falsification-atlas-v1.schema.json
    - articles/proximal-distal-a-journey-through-the-swing.pdf
    - articles/proximal_distal_energy_transfer/proximal_distal_energy_transfer.pdf
    - articles/proximal_distal_energy_transfer/source_manifest.json
    - manifest.json
    - service-worker.js
    - offline.html
    - listings.json
    - js/
    - static/explainers/
    - fonts/
    - content/wrist-as-universal-joint/Universal_Joint_Model_Enhanced.py
    - src/tools/wrist_universal_joint/grip_angle_polynomial_evaluator.js
    - robots.txt
    # Referenced only via <source srcset> in pages/daydreams-doodles.qmd, which
    # Quarto does not detect, so publish them explicitly (#4558).
    - static/images/A-Dead-Fish-Swims.webp
    - static/images/A-Dead-Fish-Swims-poster.webp

# Emits Schema.org JSON-LD for pages that opt in with a `schema-type`
# frontmatter field (see scripts/filters/schema-jsonld.lua). A no-op for
# every other page, so it is safe to register project-wide.
filters:
  - scripts/filters/schema-jsonld.lua

website:
  title: "AffineDrift"
  site-url: "https://affinedrift.com"
  favicon: favicon.ico
  bread-crumbs: true
  page-footer:
    border: true
    left: "AffineDrift — independent open research and governed technical publication"
    right:
      - text: "How to Read This Site"
        href: pages/how-to-read.html
      - text: "About"
        href: pages/about.html
      - text: "Privacy Policy"
        href: pages/privacy-policy.html
      - text: "Accessibility"
        href: pages/accessibility.html
      - text: "AffineDrift Source"
        href: https://github.com/D-sorganization/AffineDrift
      - text: "UpstreamDrift Programs"
        href: https://github.com/D-sorganization/UpstreamDrift

  # SEO: per-page Open Graph and Twitter cards (title/description/url are
  # generated per page by Quarto; image is the site default).
  open-graph:
    image: "https://affinedrift.com/logo/og-card.png"
  twitter-card:
    card-style: summary_large_image
    image: "https://affinedrift.com/logo/og-card.png"

  # Explicit search config (issue #4504): was previously running on
  # unconfigured Quarto defaults.
  search:
    type: overlay
    limit: 20
    keyboard-shortcut: ["/", "s"]

