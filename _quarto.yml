project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "pages/**/*.qmd"
    - "resources/**/*.qmd"
    - "models/**/*.qmd"
    - "repositories/**/*.qmd"
    - "articles/**/*.qmd"
    - "books/**/*.qmd"
    - "critiques/index.qmd"
    - "critiques/*.md"
    - "!critiques/INLINE_SUGGESTIONS.md"
    - "!critiques/*-bibliography.md"
  resources:
    - data/
    - manifest.json
    - service-worker.js
    - offline.html
    - js/
    - content/

