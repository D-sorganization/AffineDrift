project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "articles/*.qmd"
    - CONTRIBUTING.md
    - DEVELOPMENT_GUIDE.md
    - DNS_SETUP.md
    - MIGRATION_GUIDE.md
    - WEBSITE_MANAGEMENT.md
    - tools/wrist-universal-joint/EMBEDDING_GUIDE.md
    - tools/wrist-universal-joint/EMBED_INSTRUCTIONS.md
  resources:
    - styles.css
    - script.js
    - logo/
    - favicon.ico
    - CNAME
    - legacy-pages/qmd/
    - static/

website:
  title: "AffineDrift"
  site-url: "https://affinedrift.com"
  favicon: favicon.ico

  navbar:
    logo: logo/Logo Transparent/1.png
    logo-alt: "AffineDrift logo"
    left:
      - text: "Home"
        href: index.qmd
      - text: "Articles"
        href: articles.qmd
      - text: "Resources"
        href: resources.qmd
      - text: "About"
        href: about.qmd
      - text: "Contact"
        href: contact.qmd

  sidebar:
    - id: history
      title: "Recent Pages"
      style: "floating"
      collapse-level: 1

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    css: styles.css
    code-copy: false
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    code-fold: true
    code-tools: false
    html-math-method: mathjax
    mathjax:
      config:
        tex:
          inlineMath: [['$', '$'], ['\\(', '\\)']]
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
          processEscapes: true
          processEnvironments: true
        startup:
          ready: |
            function() {
              MathJax.startup.defaultReady();
            }
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com">
          <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
          <link rel="preconnect" href="https://cdn.jsdelivr.net">
          <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    include-after-body:
      - text: |
          <script src="script.js"></script>

# Metadata for all pages
metadata:
  author: "AffineDrift"
  lang: "en"
