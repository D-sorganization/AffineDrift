format:
  html:
    theme:
      light: [cosmo, custom.scss]
    css:
      - css/startup-launcher.css
      - styles.css
      - css/search-metrics.css
    toc: true
    toc-depth: 3
    title-block-style: none
    number-sections: false
    code-fold: true
    code-tools: false
    html-math-method: mathjax
    include-in-header:
      - _includes/site-head.html
      - _includes/mathjax-loader.html
    include-after-body:
      - _includes/site-after-body.html

# Metadata for all pages
metadata:
  lang: "en"
