project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "articles/**/*.qmd"
    - "books/**/*.qmd"
    - "critiques/index.qmd"
  resources:
    - data/
    - manifest.json
    - service-worker.js
    - offline.html
    - js/

