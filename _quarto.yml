project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "pages/**/*.qmd"
    - "resources/**/*.qmd"
    - "models/**/*.qmd"
    - "repositories/**/*.qmd"
    - "articles/**/*.qmd"
    - "!articles/tangent-hyperplane-contraction/**/*.qmd"
    - "!articles/tangent-hyperplane-articles/Drafts_Original_Articles/**/*.qmd"
    # Internal revision-plan, not a finished article (#3325) — excluded from the site.
    - "!articles/tangent-hyperplane-articles/CRITICS_CORNER.qmd"
    - "books/**/*.qmd"
    - "critiques/index.qmd"
    - "critiques/*.md"
  resources:
    - data/
    - manifest.json
    - service-worker.js
    - offline.html
    - js/
    - content/wrist-as-universal-joint/Universal_Joint_Model_Enhanced.py

website:
  title: "AffineDrift"
  site-url: "https://affinedrift.com"
  favicon: favicon.ico
  bread-crumbs: true

  # SEO: per-page Open Graph and Twitter cards (title/description/url are
  # generated per page by Quarto; image is the site default).
  open-graph:
    image: "https://affinedrift.com/logo/og-card.png"
  twitter-card:
    card-style: summary_large_image
    image: "https://affinedrift.com/logo/og-card.png"

  sidebar:
    - id: books-nav
      title: "Books"
      style: "docked"
      collapse-level: 2
      contents:
        - text: "Book Series"
          href: books/index.html
        - section: "Core Textbooks"
          contents:
            - text: "The Physics of Golf"
              href: articles/The_Physics_of_Golf/quarto/index.html
            - text: "The Geometry of Motion"
              href: articles/The_Geometry_of_Motion/quarto/index.html
        - section: "Book Series Volumes"
          contents:
            - text: "Volume I: Tangent-Space Methods"
              href: books/tangent-space-methods.html
            - text: "Volume II: Control Is Motion"
              href: books/control-is-motion.html
            - text: "Volume III: Biomechanics"
              href: books/biomechanics-biology-to-systems.html
            - text: "Volume IV: Human Motor Control"
              href: books/human-motor-control.html

  navbar:
    logo: logo/logo-navbar.png
    logo-alt: "AffineDrift Logo"
    left:
      - text: "Home"
        href: index.html
      - text: "Read"
        menu:
          - text: "The Physics of Golf"
            href: articles/The_Physics_of_Golf/quarto/index.html
          - text: "The Geometry of Motion"
            href: articles/The_Geometry_of_Motion/quarto/index.html
          - text: "Book series"
            href: books/index.html
          - text: "Tangent-Space Series"
            href: pages/tangent-hyperplanes.html
          - text: "Article index"
            href: resources/articles.html
          - text: "Learning paths"
            href: resources/learning-paths.html
          - text: "Critiques & responses"
            href: critiques/index.html
          - text: "Book reviews"
            href: pages/book-reviews.html
          - text: "Research reviews"
            href: resources/research-reviews.html
          - text: "Bibliography"
            href: resources/bibliography.html
      - text: "Build"
        menu:
          - text: "Golf Modeling Suite"
            href: models/models.html
          - text: "Repositories"
            href: repositories/repositories.html
          - text: "---"
          - text: "MuJoCo"
            href: models/models-mujoco.html
          - text: "Drake"
            href: models/models-drake.html
          - text: "Pinocchio"
            href: models/models-pinocchio.html
          - text: "OpenSim"
            href: models/models-opensim.html
