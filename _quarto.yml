project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "pages/**/*.qmd"
    - "resources/**/*.qmd"
    - "models/**/*.qmd"
    - "repositories/**/*.qmd"
    - "articles/**/*.qmd"
    - "books/**/*.qmd"
    - "critiques/index.qmd"
    - "critiques/*.md"
    - "!articles/The_Physics_of_Golf/quarto/ch09b_passive_stabilization.qmd"  # TODO: chapter stub, not yet published
  resources:
    - data/
    - manifest.json
    - service-worker.js
    - offline.html
    - js/

