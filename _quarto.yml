# The site renders the textbook chapters (see `articles/**/*.qmd` above), but the
# `_quarto.yml` files under `articles/*/quarto/` are separate Quarto *projects*,
# not config layers for this one -- so their bibliographies were never in scope
# here. The result was 209 citations across 38 pages resolving to nothing and
# printing as `Isidori1995?` on the live site. Each book's .bib is listed here so
# the pages this project renders can resolve what they cite.
bibliography:
  - references/affine-drift.bib
  - references/impact-acoustics.bib
  - references/proximal-distal-energy.bib
  - articles/The_Physics_of_Golf/golf_physics.bib
  - articles/The_Geometry_of_Motion/geometry_of_motion.bib
  - articles/tangent-hyperplane-articles/references.bib
  - articles/proximal_distal_energy_transfer/references.bib
csl: references/chicago-author-date.csl
link-citations: true

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    css:
      - styles.css
      - css/search-metrics.css
    toc: true
    toc-depth: 3
    # Use Quarto's title-block renderer so Pandoc does not emit a second
    # verbatim <header id="title-block-header">. Custom full-layout pages hide
    # the generated block in CSS and keep their authored hero/page H1.
    title-block-style: default
    number-sections: false
    code-fold: true
    code-tools: false
    canonical-url: true
    # Pandoc must preserve TeX delimiters, while the tested local gate decides
    # whether the pinned MathJax runtime is needed. The inert local URL prevents
    # Pandoc from adding its legacy polyfill and second MathJax runtime.
    html-math-method:
      method: mathjax
      url: "/js/equation-runtime-gate.js"
    include-in-header:
      - _includes/site-head.html
      - _includes/mathjax-loader.html
    include-after-body:
      - _includes/site-after-body.html

# Metadata for all pages
metadata:
  lang: "en"
