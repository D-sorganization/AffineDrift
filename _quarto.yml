project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "articles/**/*.qmd"
  resources:
    - data/
    - manifest.json
    - service-worker.js
    - offline.html
    - js/

website:
  title: "AffineDrift"
  site-url: "https://affinedrift.com"
  favicon: favicon.ico

  navbar:
    logo: logo/logo_transparent_1.png
    logo-alt: "AffineDrift Logo"
    left:
      - text: "Home"
        href: index.html
      - text: "Overview"
        href: overview.html
      - text: "Articles"
        menu:
          - text: "Drifter Manifesto"
            href: drifter-manifesto.html
          - text: "Tangent Hyperplanes"
            href: tangent-hyperplanes.html
          - text: "Articles"
            href: articles.html
          - text: "Research Reviews"
            href: research-reviews.html
          - text: "Book Reviews"
            href: book-reviews.html
      - text: "Models"
        href: models.html
      - text: "Resources"
        menu:
          - text: "Videos"
            href: resources-videos.html
          - text: "Software"
            href: resources-software.html
          - text: "Websites"
            href: resources-websites.html
          - text: "Datasets"
            href: resources-datasets.html
          - text: "Books"
            href: resources-books.html
          - text: "Papers"
            href: resources-papers.html
          - text: "Researchers"
            href: resources-researchers.html
          - text: "NotebookLM"
            href: resources-notebooklm.html
          - text: "Bibliography"
            href: bibliography.html
      - text: "Repositories"
        menu:
          - text: "D-sorganization: Golf Modeling Suite"
            href: https://github.com/D-sorganization/Golf_Modeling_Suite
      - text: "Notes"
        href: daydreams-doodles.html
      - text: "Contact"
        menu:
          - text: "Contact"
            href: contact.html
          - text: "About"
            href: about.html
          - text: "Collaborate"
            href: collaborate.html

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    css:
      - css/startup-launcher.css
      - styles.css
      - css/search-metrics.css
    toc: false
    toc-depth: 3
    title-block-style: none
    number-sections: false
    code-fold: true
    code-tools: false
    html-math-method: mathjax
    include-in-header:
      - _includes/site-head.html
      - _includes/mathjax-loader.html
    include-after-body:
      - _includes/site-after-body.html

# Metadata for all pages
metadata:
  lang: "en"
