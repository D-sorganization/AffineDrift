project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "articles/*.qmd"

website:
  title: "AffineDrift"
  site-url: "https://affinedrift.com"
  favicon: favicon.ico

  navbar:
    logo: logo/Logo Transparent/1.png
    left:
      - text: "Home"
        href: index.html
      - text: "Articles"
        menu:
          - text: "Articles Home"
            href: articles.html
          - text: "Drifter Manifesto"
            href: drifter-manifesto.html
          - text: "Articles"
            href: articles.html
          - text: "Research Reviews"
            href: research-reviews.html
          - text: "Book Reviews"
            href: book-reviews.html
      - text: "Resources"
        href: resources.html
      - text: "Models"
        menu:
          - text: "Models Home"
            href: models.html
          - text: "Matlab Simulink"
            href: models-simulink.html
          - text: "MuJoCo"
            href: models-mujoco.html
          - text: "Drake"
            href: models-drake.html
          - text: "Pinnochio"
            href: models-pinnochio.html
          - text: "Pendulum"
            href: models-pendulum.html
          - text: "OpenSim"
            href: models-opensim.html
          - text: "MyoSim"
            href: models-myosim.html
      - text: "Support"
        menu:
          - text: "About"
            href: about.html
          - text: "Collaborate"
            href: collaborate.html
          - text: "Contact"
            href: contact.html

  sidebar:
    - id: history
      title: "Recent Pages"
      style: "floating"
      collapse-level: 1

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    code-fold: true
    code-tools: false
    html-math-method: mathjax
    mathjax:
      config:
        tex:
          inlineMath: [['$', '$'], ['\\(', '\\)']]
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
          processEscapes: true
          processEnvironments: true
        startup:
          ready: |
            function() {
              MathJax.startup.defaultReady();
            }
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
          <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous">
          <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    include-after-body:
      - text: |
          <footer>
            <div class="container">
              <p>&copy; 2025. Affine Drift Effin Matters.</p>
              <p class="footer-tagline">2025 AffineDrift matters</p>
            </div>
          </footer>
          <script src="script.js"></script>

# Metadata for all pages
metadata:
  lang: "en"
