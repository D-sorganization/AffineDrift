          - text: "Datasets"
            href: resources/resources-datasets.html
          - text: "Software & tools"
            href: pages/tools.html
      - text: "Connect"
        menu:
          - text: "About"
            href: pages/about.html
          - text: "Contact"
            href: pages/contact.html
          - text: "Collaborate"
            href: pages/collaborate.html
