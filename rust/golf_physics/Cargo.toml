[package]
name = "golf_physics"
version = "0.1.0"
edition = "2021"
description = "Physics engine for golf simulation"

[lib]
name = "golf_physics"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
