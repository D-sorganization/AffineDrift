<script>
  // MathJax Configuration - MUST be defined before loading MathJax
  window.MathJax = {
    loader: {
      // ⚡ Bolt Optimization: Lazy typesetting defers MathJax rendering until
      // equations enter the viewport, significantly improving initial page load time.
      // 🎯 Accessibility: enableAssistiveMml below lets MathJax register the
      // assistive MathML layer once without explicitly loading it twice.
      load: ['ui/lazy']
    },
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true,
      tags: 'ams'
    },
    svg: {
      fontCache: 'global'
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      ignoreHtmlClass: 'tex2jax_ignore',
      enableAssistiveMml: true  // Enable hidden MathML for screen readers
    },
    startup: {
      ready: function() {
        MathJax.startup.defaultReady();
        // MathJax.startup.defaultReady() already typesets the page once.
        // No additional typeset() call needed here.
      }
    }
  };

  window.Quarto = window.Quarto || {};
  window.Quarto.typesetMath = function(el) {
    if (window.MathJax && window.MathJax.typeset) {
      window.MathJax.typeset([el]);
      return;
    }

    if (!window.katex) {
      return;
    }

    const mathElements = el.getElementsByClassName("math");
    const macros = [];
    for (let i = 0; i < mathElements.length; i++) {
      const texText = mathElements[i].firstChild;
      if (mathElements[i].tagName === "SPAN" && texText && texText.data) {
        window.katex.render(texText.data, mathElements[i], {
          displayMode: mathElements[i].classList.contains("display"),
          throwOnError: false,
          macros: macros,
          fleqn: false
        });
      }
    }
  };

  // ⚡ Performance (#3332-A): MathJax is ~1MB+ (the largest build). Most pages
  // (contact, about, repositories, resource lists) contain zero math, yet the
  // previous loader force-injected MathJax on every page. Gate the injection on
  // the *actual presence of math* in the rendered document so math-free pages
  // never pay for it. Quarto renders TeX into `.math` spans (and display math
  // into `mjx-container` once typeset); the raw delimiters survive in the
  // initial HTML, so a cheap source scan is a reliable pre-typeset signal.
  function adPageHasMath() {
    if (document.querySelector('.math, mjx-container, [data-qmd-math]')) {
      return true;
    }
    // Fall back to a raw-delimiter scan for inline/display TeX that has not yet
    // been wrapped in a `.math` span.
    const content =
      document.querySelector('main, #quarto-document-content, .content, body');
    const text = content ? content.textContent : '';
    return (
      text.indexOf('\\(') !== -1 ||
      text.indexOf('\\[') !== -1 ||
      text.indexOf('$$') !== -1
    );
  }

  function adLoadMathJax() {
    // Idempotent: never inject twice.
    if (document.getElementById('MathJax-script') ||
        document.querySelector('script[src*="mathjax"]')) {
      return;
    }
    if (!adPageHasMath()) {
      return;
    }

    // SECURITY: pin MathJax to an exact, immutable version and verify it with a
    // Subresource Integrity hash so a compromise of the jsDelivr edge or the
    // `mathjax` npm package cannot inject arbitrary script into the page. The
    // version and hash must be updated together (regenerate with:
    //   curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A ).
    const mathjax = document.createElement("script");
    mathjax.src = "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js";
    mathjax.integrity = "sha384-Wuix6BuhrWbjDBs24bXrjf4ZQ5aFeFWBuKkFekO2t8xFU0iNaLQfp2K6/1Nxveei";
    mathjax.crossOrigin = "anonymous";
    mathjax.async = true;
    mathjax.id = "MathJax-script";
    mathjax.dataset.adMathjax = "mathjax";
    document.head.appendChild(mathjax);
  }

  function adQueueMathJaxLoad() {
    // Quarto emits its own MathJax script after include-in-header content on
    // math-enabled pages. Queue one task so that script is in the DOM before
    // the idempotency check above decides whether a fallback injection is needed.
    window.setTimeout(adLoadMathJax, 0);
  }

  // The DOM must exist before we can detect math, so defer the gated load to
  // DOMContentLoaded (or run immediately if the document is already parsed).
  // MathJax.startup.defaultReady() in the startup.ready callback above handles
  // the initial typeset once the script loads.
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', adQueueMathJaxLoad, { once: true });
  } else {
    adQueueMathJaxLoad();
  }
  window.AffineDriftMathJax = { hasMath: adPageHasMath, load: adLoadMathJax };
</script>
