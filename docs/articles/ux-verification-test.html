<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UX Verification Test</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        :root { --scroll-offset: 140px; }
    </style>
</head>
<body class="standard-page-layout">
    <div id="quarto-document-content" class="main-content-area">
        <h1>UX Verification Page</h1>
        <p>This is a test page for verifying script.js enhancements.</p>

        <section id="code-section">
            <h2>Code Snippet</h2>
            <pre>
def hello_world():
    print("Hello World")
            </pre>
        </section>

        <section id="toc-test">
            <h2>TOC Test Section</h2>
            <p>Content to scroll...</p>
            <div style="height: 2000px; background: linear-gradient(to bottom, #f0f0f0, #e0e0e0);">
                Spacer
            </div>
        </section>
    </div>

    <div class="left-sidebar">
        <div class="sidebar-sticky-content">
            <div class="sidebar-toc">
                <h3>On This Page</h3>
                <ul id="toc-list">
                    <li><a href="#code-section">Code Snippet</a></li>
                    <li><a href="#toc-test">TOC Test Section</a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Mock Bootstrap/Third Party -->
    <script>
        window.bootstrap = { Collapse: { getInstance: () => null } };
    </script>
    <script src="../script.js"></script>
</body>
</html>
