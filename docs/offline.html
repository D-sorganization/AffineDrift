<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - AffineDrift</title>
  <style>
    :root {
      --bg-body: #0a0a0f;
      --text-main: #e0e0e0;
      --accent-blue: #4a9eff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .offline-icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      opacity: 0.7;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
      color: var(--accent-blue);
    }

    p {
      font-size: 1.1rem;
      max-width: 400px;
      line-height: 1.6;
      margin-bottom: 2rem;
      opacity: 0.8;
    }

    .retry-btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--accent-blue);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: opacity 0.2s;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    .retry-btn:hover {
      opacity: 0.9;
    }

    .home-link {
      margin-top: 1rem;
      color: var(--accent-blue);
      text-decoration: none;
    }

    .home-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="offline-icon">&#128268;</div>
  <h1>You're Offline</h1>
  <p>It looks like you've lost your internet connection. Some pages may still be available from cache.</p>
  <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  <a href="/" class="home-link">Go to Home Page</a>
</body>
</html>
