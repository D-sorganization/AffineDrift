<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320"><rect width="600" height="320" fill="#f8fafc" rx="8"/><text x="24" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#17324d">F3: Turn Angle Phase Wrapping and Unwrapping</text><rect x="476" y="16" width="100" height="22" rx="4" fill="#e2e8f0"/><text x="526" y="31" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">synthetic</text><title>F3: Turn Angle Phase Wrapping and Unwrapping</title><desc>synthetic: Trajectory of turn angle wrapping showing a 2-pi jump across +/-180 degrees boundary, contrasted with continuous unwrapped trajectory. Labelled synthetic.</desc><rect x="40" y="60" width="520" height="220" fill="#fff" stroke="#cbd5e1" rx="6"/><text x="60" y="95" font-family="sans-serif" font-size="13" fill="#1e293b">Angle continuity across +/-180° boundary:</text><text x="60" y="140" font-family="sans-serif" font-size="12" fill="#dc2626">Wrapped series jump: 6.15 rad</text><text x="60" y="180" font-family="sans-serif" font-size="12" fill="#0284c7">Unwrapped continuous series: jump &lt; 0.13 rad</text><text x="60" y="245" font-family="sans-serif" font-size="11" fill="#64748b">Differentiating wrapped angles injects false impulse spikes into velocities.</text></svg>
