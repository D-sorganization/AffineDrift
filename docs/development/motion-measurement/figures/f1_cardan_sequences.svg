<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320"><rect width="600" height="320" fill="#f8fafc" rx="8"/><text x="24" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#17324d">F1: Cardan Sequence Dependence</text><rect x="476" y="16" width="100" height="22" rx="4" fill="#e2e8f0"/><text x="526" y="31" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">synthetic</text><title>F1: Cardan Sequence Dependence</title><desc>synthetic: Comparison of intrinsic Cardan sequences XYZ vs ZYX on an identical rotation matrix, demonstrating sequence-dependent angular divergence. Labelled synthetic.</desc><rect x="40" y="60" width="520" height="220" fill="#fff" stroke="#cbd5e1" rx="6"/><text x="60" y="95" font-family="sans-serif" font-size="13" fill="#1e293b">Decomposed into intrinsic sequences (rad):</text><text x="60" y="135" font-family="monospace" font-size="13" fill="#0369a1">XYZ: ['0.40', '0.70', '-0.50']</text><text x="60" y="165" font-family="monospace" font-size="13" fill="#0f766e">ZYX: ['-0.32', '0.79', '0.08']</text><text x="60" y="210" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">Max difference: 0.32 rad (sequence dependent)</text><text x="60" y="250" font-family="sans-serif" font-size="11" fill="#64748b">Convention card required: no sequence is universally correct.</text></svg>
