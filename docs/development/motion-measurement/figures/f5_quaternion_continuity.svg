<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320"><rect width="600" height="320" fill="#f8fafc" rx="8"/><text x="24" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#17324d">F5: Quaternion Component-Wise Smoothing and Hemisphere Continuity</text><rect x="476" y="16" width="100" height="22" rx="4" fill="#e2e8f0"/><text x="526" y="31" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">synthetic</text><title>F5: Quaternion Component-Wise Smoothing and Hemisphere Continuity</title><desc>synthetic: Moving-average quaternion smoothing showing collapse of norm without hemisphere tracking vs preserved unit norm with sign continuity. Labelled synthetic.</desc><rect x="40" y="60" width="520" height="220" fill="#fff" stroke="#cbd5e1" rx="6"/><text x="60" y="95" font-family="sans-serif" font-size="13" fill="#1e293b">Moving-average filtering (window=5):</text><text x="60" y="140" font-family="sans-serif" font-size="12" fill="#b91c1c">Without hemisphere tracking: min norm = 0.20 (collapses)</text><text x="60" y="180" font-family="sans-serif" font-size="12" fill="#15803d">With hemisphere continuity: min norm = 1.00 (preserved)</text><text x="60" y="245" font-family="sans-serif" font-size="11" fill="#64748b">Antipodal double-cover requires sign tracking before component smoothing.</text></svg>
