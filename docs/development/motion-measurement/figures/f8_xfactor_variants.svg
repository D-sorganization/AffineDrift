<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320"><rect width="600" height="320" fill="#f8fafc" rx="8"/><text x="24" y="34" font-family="sans-serif" font-size="15" font-weight="bold" fill="#17324d">F8: Golf Swing X-Factor Variant Discrepancy</text><rect x="476" y="16" width="100" height="22" rx="4" fill="#e2e8f0"/><text x="526" y="31" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">model_scenario</text><title>F8: Golf Swing X-Factor Variant Discrepancy</title><desc>model_scenario: Comparison of golf swing X-factor computation variants (plane projection vs Cardan joint coordinate system) on a synthetic swing path. Labelled model_scenario.</desc><rect x="40" y="60" width="520" height="220" fill="#fff" stroke="#cbd5e1" rx="6"/><text x="60" y="95" font-family="sans-serif" font-size="13" fill="#1e293b">X-factor variants on synthetic swing:</text><text x="60" y="135" font-family="sans-serif" font-size="12" fill="#0369a1">Plane-projection peak: 28.6°</text><text x="60" y="165" font-family="sans-serif" font-size="12" fill="#0f766e">Cardan / JCS axial peak: 28.6°</text><text x="60" y="200" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b91c1c">Spread between methods: 0.0°</text><text x="60" y="245" font-family="sans-serif" font-size="11" fill="#64748b">Kwon (2013) &amp; Brown (2013): conventions cannot be compared interchangeably.</text></svg>
