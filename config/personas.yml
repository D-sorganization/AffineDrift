# Persona start paths configuration (issue #4409, extended in #4488).
#
# Each persona defines a user archetype with their primary goals,
# mapped to content clusters (from categories.yml), exact-commit
# workflow pages (from models/programming/workflows.qmd), and structured
# route recommendations:
# - first_page: The initial page to start reading
# - route_30min: A focused 30-minute introduction
# - route_deep: A comprehensive deep-dive sequence
#
# This file is validated by tests/test_persona_start_paths.py and used to generate
# _includes/generated/persona-cards.qmd via scripts/generate_persona_cards.py.

personas:
  learner:
    name: "Learner"
    tagline: "New to control theory or biomechanics"
    description: "Build foundational knowledge from first principles. Start with the mathematics and physics before diving into applications."
    icon: "📚"
    content_clusters:
      - theory-core
      - reference
      - resources
    workflows:
      - installation-verification
    primary_path: "learning-path-foundations.html"
    first_page:
      title: "Foundations Learning Path"
      path: "resources/learning-path-foundations.html"
    route_30min:
      title: "Lagrangian Mechanics Reference"
      path: "articles/lagrangian-reference.html"
    route_deep:
      title: "Volume I: The Geometry of Motion"
      path: "articles/The_Geometry_of_Motion/quarto/index.html"
    goal: "Understand the mathematical and physical foundations"

  researcher:
    name: "Researcher"
    tagline: "Academic or scientific focus"
    description: "Deep-dive into theoretical foundations, research methods, and peer-reviewed analysis techniques."
    icon: "🔬"
    content_clusters:
      - theory-core
      - tangent-space
      - inverse-dynamics
      - motor-control
    workflows:
      - reference-double-pendulum-analysis
      - reference-simulation-report
    primary_path: "learning-path-control-theory.html"
    first_page:
      title: "Control Theory Learning Path"
      path: "resources/learning-path-control-theory.html"
    route_30min:
      title: "Theory Part 1 — Control-Affine Derivation"
      path: "articles/theory-part1.html"
    route_deep:
      title: "Tangent Space Series"
      path: "pages/tangent-hyperplanes.html"
    goal: "Deep-dive into theoretical foundations and research methods"

  integrator:
    name: "Integrator"
    tagline: "Software developer integrating tools"
    description: "Integrate AffineDrift computational tools and APIs into your own projects."
    icon: "🔧"
    content_clusters:
      - tools
      - models
    workflows:
      - companion-export
      - installation-verification
      - program-catalog-export
    primary_path: "../models/programming/index.html"
    first_page:
      title: "Programming Hub"
      path: "models/programming/index.html"
    route_30min:
      title: "Software Tools Catalog"
      path: "resources/resources-software.html"
    route_deep:
      title: "Governed Workflows"
      path: "models/programming/workflows.html"
    goal: "Integrate computational tools into your own projects"

  experimentalist:
    name: "Experimentalist"
    tagline: "Hands-on simulation and modeling"
    description: "Run simulations, analyze experimental data, and explore computational models."
    icon: "🧪"
    content_clusters:
      - models
      - inverse-dynamics
      - motor-control
      - impact-ball-flight
    workflows:
      - reference-double-pendulum-simulation
      - reference-simulation-plot
      - launch-monitor-import-export
    primary_path: "../models/programming/programs.html"
    first_page:
      title: "Programs & Models"
      path: "models/programming/programs.html"
    route_30min:
      title: "Model Ladder"
      path: "models/model-ladder.html"
    route_deep:
      title: "Governed Workflows"
      path: "models/programming/workflows.html"
    goal: "Run simulations and analyze experimental data"

  reviewer:
    name: "Reviewer"
    tagline: "Critical evaluation of claims"
    description: "Evaluate scientific claims, review methodologies, and contribute critical analysis."
    icon: "🔍"
    content_clusters:
      - critique
      - theory-core
    workflows:
      - companion-export
