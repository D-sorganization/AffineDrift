    primary_path: "research-reviews.html"
    first_page:
      title: "Research Reviews"
      path: "resources/research-reviews.html"
    route_30min:
      title: "Critiques & Responses"
      path: "critiques/index.html"
    route_deep:
      title: "Scientific Claim Audit"
      path: "reports/scientific-claim-audit.md"
    goal: "Evaluate scientific claims and contribute critical reviews"

  contributor:
    name: "Contributor"
    tagline: "Contributing to the project"
