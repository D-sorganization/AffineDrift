# Controlled category vocabulary for rendered content pages (issue #3898).
#
# Every rendered content page (articles/, pages/, resources/, models/,
# repositories/, books/) carries `categories:` from this vocabulary,
# written as a YAML block list. Unknown values fail the site link gate
# (`scripts/link-checker.py --site-gate`). Add new values here first,
# with a reader-facing description, before using them on pages.
theory-core: "Affine/variational theory of the golf swing: constraints, superposition, reference points, torque counterfactuals, and the affine decomposition corpus."
tangent-space: "Tangent hyperplanes, contraction metrics, residual-aware control, and the tangent-space textbook series."
reference: "Reference pages: notation, glossaries, Lagrangian, screw theory, and rotation-representation references."
proximal-distal: "The proximal-to-distal sequencing program: energy transfer, falsification atlas, and the companion book."
technology: "Measurement and equipment technology: launch monitors, motion capture, force measurement, and club fitting."
impact-ball-flight: "Impact mechanics, ball flight, aerodynamics, and ball-flight simulation."
putting: "Putting mechanics and roll models."
inverse-dynamics: "Inverse dynamics, induced acceleration, and counterfactual inference from measured motion."
motor-control: "Motor control, motor learning, degrees of freedom, and predictive-brain perspectives."
models: "Simulation models and their repositories: pendulum to full multibody engines."
tools: "Interactive tools and converters: rotation converter, model workbench, and UpstreamDrift integration."
critique: "Critiques, limitations, and methodological defense surfaces."
resources: "Learning paths, research reviews, bibliographies, and curated external resources."
books: "Book landing pages and reading roadmaps."
site-information: "Site meta pages: about, contact, collaboration, and roadmap pages."
