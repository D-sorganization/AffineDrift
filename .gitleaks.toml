# Gitleaks configuration: the default rules plus one narrow allowlist.
#
# The claim-audit and publication ledgers (data/trust/*.json and their generated
# reports) pin evidence files by SHA-256 as `"<repo path>": "<64 hex>"`. When the
# path contains a generic-api-key keyword (for example "access" in
# pages/accessibility.qmd) the default rule flags the public digest as a secret,
# and a line-keyed .gitleaksignore entry breaks every time the ledger shifts.
# Only that shape is allowed: a repository file path (the rule's match starts at
# the keyword inside it) mapped to a lowercase 64-hex digest. Everything else is scanned by the default rules.
title = "AffineDrift gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "SHA-256 evidence digests keyed by repository file path"
regexTarget = "match"
regexes = [
  '''[A-Za-z0-9_./-]+\.(qmd|md|json|py|bib|yml|yaml|tex|csv|js|css|html)"\s*:\s*"[0-9a-f]{64}''',
]
