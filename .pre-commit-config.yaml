# =============================================================================
# Fleet-Wide Pre-commit Configuration
# =============================================================================
# Fast checks on every commit (<15 seconds)
# Slower checks (mypy, bandit, tests) on pre-push only
#
# EXCEPTIONS:
# - Documentation-only changes (.md, .rst) skip Python checks
# - Workflow changes (.github/) skip Python checks
# - Config changes (.yml, .yaml, .json) only run prettier
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type pre-push
# =============================================================================

repos:
  # Gitleaks - Fast secrets scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  # -------------------------------------------------------------------------
  # Stage 1: Code Formatting (auto-fix) - PYTHON FILES ONLY
  # -------------------------------------------------------------------------

  # Ruff - Fast Python linter with auto-fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        name: "ruff (lint + fix)"
        args: ["--fix", "--exit-non-zero-on-fix"]
        types: [python]
        # Skip for docs-only or workflow-only changes
        exclude: ^(\.github/|docs/|.*\.md$)

  # Black - Python code formatter (CLAUDE.md policy: Black, NOT ruff format)
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        name: "black (format)"
        language_version: python
        types: [python]
        exclude: ^(\.github/|docs/|.*\.md$)

  # -------------------------------------------------------------------------
  # Stage 2: Quick Quality Checks - PYTHON FILES ONLY
  # -------------------------------------------------------------------------

  - repo: local
    hooks:
      # Prevent wildcard imports
      - id: no-wildcard-imports
        name: "no wildcard imports"
        entry: "from .* import \\*"
        language: pygrep
        types: [python]
        exclude: ^(archive/|legacy/|experimental/|tests/|\.github/)

      # Check for debug statements
      - id: no-debug-statements
        name: "no debug statements"
        entry: "(?:^|\\s)(breakpoint\\(|import pdb|pdb\\.set_trace)"
        language: pygrep
        types: [python]
        exclude: ^(tests/|archive/|legacy/|\.github/)

      # Check for print statements in src (should use logging)
      - id: no-print-in-src
        name: "no print() in src (use logging)"
        entry: "^\\s*print\\("
        language: pygrep
        files: ^src/
        exclude: ^(src/.*/__main__\.py|tests/|\.github/)

      # Check for unjustified noqa
      - id: check-noqa-justification
        name: "check for unjustified noqa"
        entry: "(?i)#\\s*noqa(?!.*(reason:|—|--|placeholder|covers))"
        language: pygrep
        types: [python]
        exclude: ^(env/|\.venv/|node_modules/|__pycache__/)

      # Style discipline — forbid inline style=, linear-gradient, and
      # hardcoded hex in top-level QMD pages. The CSS scope is excluded
      # until EPIC #3140 phases B1/B4 land.
      - id: style-discipline-qmd
        name: "style discipline (QMD: no inline style/gradient/hex)"
        entry: python3 -m scripts.check_style_discipline --qmd-only
        language: system
        pass_filenames: false
        always_run: true

      - id: website-title-case
        name: "website title capitalization"
        entry: python3 scripts/check_title_case.py
        language: system
        pass_filenames: false
        files: (^|/)_quarto\.yml$|\.(qmd|tex)$|^(src|content)/.*\.py$|^scripts/check_title_case\.py$

  # -------------------------------------------------------------------------
  # Stage 3: Config File Formatting - ALWAYS RUNS
  # -------------------------------------------------------------------------

  # Prettier - Format YAML, JSON, Markdown (lightweight, always runs)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: "prettier (yaml/json/md)"
        types_or: [yaml, markdown, json]
        # Generated search JSON is owned by the deterministic ledger generator;
        # formatting it independently would make `--check` report a stale surface.
        exclude: '(\.py|\.m|package-lock\.json|\.ipynb|data/trust/generated/claim_critique_search\.json)$'

  # -------------------------------------------------------------------------
  # Stage 4: Pre-push Hooks (Slower - PYTHON FILES ONLY)
  # -------------------------------------------------------------------------

  # MyPy - Type checking (pre-push only, Python only)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: "mypy (type check)"
        stages: [pre-push]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic
        # Suppress error codes with 454+ pre-existing violations across src/ (#1616-#1622).
        # Full strict mypy runs in CI; pre-push hook checks for critical new errors only.
        args:
          - --ignore-missing-imports
          - --disable-error-code=no-any-unimported
          - --disable-error-code=type-arg
          - --disable-error-code=no-any-return
          - --disable-error-code=unused-ignore
          - --disable-error-code=import-untyped
        types: [python]
        files: ^src/
        exclude: |
          (?x)^(
            src/matlab/|
            src/javascript/|
            src/archive/|
            src/legacy/|
            src/experimental/|
            __pycache__/|
            \.pytest_cache/|
            \.venv/|
            \.github/
          )

  # Bandit - Security scanning (pre-push only, Python only)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        name: "bandit (security scan)"
        stages: [pre-push]
        # bandit's --exclude takes ONE comma-separated list. Repeating -x does
        # not accumulate -- argparse keeps only the last occurrence -- so the
        # previous repeated-flag form silently excluded .github/ alone. Combined
        # with bandit walking the filesystem rather than the git index, that put
        # a local .venv in scope and blocked every push with hundreds of
        # third-party findings. Keep this as a single argument.
        args:
          [
            "-r",
            ".",
            "-ll",
            "-ii",
            "-x",
            "./tests,./archive,./legacy,./.github,./.venv,./venv,./node_modules",
          ]
        pass_filenames: false
        # Only run if Python files changed
        types: [python]

  # Pytest - Unit tests (pre-push only)
  - repo: local
    hooks:
      - id: pytest-unit
        name: "pytest (unit tests)"
        stages: [pre-push]
        entry: python -m pytest tests/unit -x -q --tb=short -m "not slow and not integration"
        language: system
        pass_filenames: false
        # Only run if Python files changed
        types: [python]

# =============================================================================
# Global Settings
# =============================================================================

default_language_version:
  python: python

# Files to always exclude from all hooks
exclude: |
  (?x)^(
    archive/|
    legacy/|
    experimental/|
    \.git/|
    __pycache__/|
    \.mypy_cache/|
    \.ruff_cache/|
    \.pytest_cache/|
    node_modules/|
    \.venv/|
    venv/|
    build/|
    dist/|
    .*\.egg-info/
  )

# Don't fail fast - run all hooks
fail_fast: false

# CI configuration (for pre-commit.ci if used)
ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: "main"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  skip: [pytest-unit, bandit, mypy] # Skip slow hooks in CI
