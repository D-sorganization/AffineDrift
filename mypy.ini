# mypy.ini
[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
no_implicit_optional = True
strict_optional = True
explicit_package_bases = True
exclude = ^(_site/|docs/|\.quarto/|content/|articles/|archive/|legacy-pages/|_templates/|logo/|pics/|static/|qmd/|tools/wrist-universal-joint/)

# Common science libs: treat as typed-enough to not explode
[mypy-numpy.*]
ignore_missing_imports = True
[mypy-scipy.*]
ignore_missing_imports = True
[mypy-matplotlib.*]
ignore_missing_imports = True
[mypy-pandas.*]
ignore_missing_imports = True
[mypy-streamlit.*]
ignore_missing_imports = True




