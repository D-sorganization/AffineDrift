<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img">
  <defs>
    <marker id="dim-arrow-left" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#475569"/>
    </marker>
    <marker id="dim-arrow-right" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="force-up" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="force-down" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">
    Figure 2.1: Reference Stations and Bilateral Hand Contact Geometry Along the Golf Club
  </text>
  <text x="30" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">
    Spatial coordinates s along shaft centerline, bilateral grip forces (F_L, F_T), and sign-reversal loci (s*)
  </text>

  <!-- Club Assembly Diagram -->
  <!-- Grip Section Background -->
  <rect x="50" y="115" width="220" height="34" rx="4" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
  <text x="60" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#475569">Grip Collar (Rubber)</text>

  <!-- Shaft Section -->
  <rect x="270" y="124" width="460" height="16" fill="#94a3b8" stroke="#64748b" stroke-width="1.2"/>

  <!-- Clubhead -->
  <path d="M 730 110 L 785 110 C 800 110 805 130 805 150 C 805 165 790 165 765 165 L 730 150 Z" fill="#0f172a" stroke="#020617" stroke-width="1.5"/>
  <text x="745" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Clubhead (C)</text>

  <!-- Reference Station Markers & Vertical Projection Lines -->
  <!-- Station B: Butt End (s = -0.050 m) -> x = 50 -->
  <line x1="50" y1="95" x2="50" y2="240" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="50" cy="132" r="4.5" fill="#0f172a"/>
  <text x="50" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">B</text>
  <text x="50" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">s_B = -0.050 m</text>
  <text x="50" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">Butt End</text>

  <!-- Station L: Lead Hand Center (s = -0.0381 m) -> x = 110 -->
  <line x1="110" y1="95" x2="110" y2="200" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="110" cy="132" r="5" fill="#2563eb"/>
  <text x="110" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">L</text>
  <!-- Lead hand force arrow pulling up/back -->
  <line x1="110" y1="165" x2="110" y2="140" stroke="#2563eb" stroke-width="2.5" marker-end="url(#force-up)"/>
  <text x="110" y="180" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">F_L</text>

  <!-- Station M: Mid-Hands Origin (s = 0.000 m) -> x = 160 -->
  <line x1="160" y1="75" x2="160" y2="280" stroke="#0f172a" stroke-width="2"/>
  <circle cx="160" cy="132" r="6" fill="#f8fafc" stroke="#0f172a" stroke-width="2.5"/>
  <text x="160" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">M (Origin)</text>
  <text x="160" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">s_M = 0.000 m</text>
  <text x="160" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#475569">Mid-Hands Ref</text>

  <!-- Station T: Trail Hand Center (s = +0.0381 m) -> x = 210 -->
  <line x1="210" y1="95" x2="210" y2="200" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="210" cy="132" r="5" fill="#dc2626"/>
  <text x="210" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">T</text>
  <!-- Trail hand force arrow pushing down/forward -->
  <line x1="210" y1="100" x2="210" y2="124" stroke="#dc2626" stroke-width="2.5" marker-end="url(#force-down)"/>
  <text x="210" y="93" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#dc2626">F_T</text>

  <!-- Inter-hand spacing dimension (L to T) -->
  <line x1="110" y1="215" x2="210" y2="215" stroke="#475569" stroke-width="1.5" marker-start="url(#dim-arrow-left)" marker-end="url(#dim-arrow-right)"/>
  <text x="160" y="230" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#334155">s = 0.0762 m (3.0 in)</text>

  <!-- Illustrative Sign Reversal Locus s* = +0.2133 m -> x = 300 -->
  <line x1="300" y1="95" x2="300" y2="240" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="300" cy="132" r="5" fill="#d97706"/>
  <text x="300" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#d97706">s* (illus)</text>
  <text x="300" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#d97706">+0.213 m</text>
  <text x="300" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#92400e">Illustrative Sign-Flip</text>

  <!-- Station G: Center of Mass (s = +0.720 m) -> x = 560 -->
  <line x1="560" y1="95" x2="560" y2="240" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="560" cy="132" r="6" fill="#0284c7"/>
  <text x="560" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#0284c7">G (COM)</text>
  <text x="560" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#0284c7">s_G = +0.720 m</text>
  <text x="560" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#0369a1">Club Center of Mass</text>

  <!-- Simulated Sign Reversal Locus s* = +0.7370 m -> x = 585 -->
  <line x1="585" y1="95" x2="585" y2="280" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="585" cy="132" r="5" fill="#b91c1c"/>
  <text x="585" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">s* (sim)</text>
  <text x="585" y="295" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#b91c1c">+0.737 m</text>
  <text x="585" y="308" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#991b1b">Simulated WSCG Sign-Flip</text>

  <!-- Station C: Clubhead (s = +1.020 m) -> x = 750 -->
  <line x1="750" y1="95" x2="750" y2="240" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="750" cy="132" r="5" fill="#0f172a"/>
  <text x="750" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">C</text>
  <text x="750" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">s_C ≈ +1.020 m</text>
  <text x="750" y="268" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#64748b">Clubhead Center</text>

  <!-- Bottom Explanatory Bar -->
  <rect x="50" y="325" width="720" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="410" y="343" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#1e293b">
    <tspan font-weight="bold">Transport Law:</tspan> M_alpha(s) = C_alpha - s · R_y. Proximal to s* (e.g. at hands M), M_alpha is <tspan fill="#b91c1c" font-weight="bold">NEGATIVE</tspan>.
  </text>
  <text x="410" y="358" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#475569">
    Distal to s* (toward clubhead C), the levered transverse pull (-s·R_y) turns the reported moment <tspan fill="#15803d" font-weight="bold">POSITIVE</tspan>.
  </text>
</svg>
