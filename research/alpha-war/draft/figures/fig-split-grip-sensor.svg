<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img">
  <defs>
    <marker id="force-blue" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,8 L4,0 L8,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="force-red" markerWidth="8" markerHeight="8" refX="4" refY="8" orient="auto">
      <path d="M0,0 L4,8 L8,0 Z" fill="#dc2626"/>
    </marker>
    <marker id="dim-arrow-l" markerWidth="6" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#475569"/>
    </marker>
    <marker id="dim-arrow-r" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <linearGradient id="sensor-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">
    Figure 5.1: Instrumented Split-Grip Sensor Architecture
  </text>
  <text x="30" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" fill="#475569">
    Physical multi-axis load cells isolating lead and trail hand wrenches (Koike et al., 2006–2019; Choi et al., 2020)
  </text>

  <!-- Main Cutaway Diagram -->
  <!-- Butt Cap -->
  <rect x="40" y="115" width="25" height="50" rx="3" fill="#1e293b"/>
  <text x="52" y="105" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#475569">Cap</text>

  <!-- Lead Hand Sensor Sleeve -->
  <rect x="70" y="110" width="160" height="60" rx="4" fill="url(#sensor-grad)" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#1e3a8a">Lead Hand Sensor</text>
  <text x="150" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#2563eb">6-DOF Transducer (F_L, tau_L)</text>

  <!-- Mechanical Decoupling Gap -->
  <rect x="235" y="125" width="40" height="30" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="255" y="143" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#64748b">Gap</text>

  <!-- Trail Hand Sensor Sleeve -->
  <rect x="280" y="110" width="160" height="60" rx="4" fill="url(#sensor-grad)" stroke="#dc2626" stroke-width="2"/>
  <text x="360" y="135" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#7f1d1d">Trail Hand Sensor</text>
  <text x="360" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#dc2626">6-DOF Transducer (F_T, tau_T)</text>

  <!-- Shaft Continuing Distally -->
  <rect x="445" y="127" width="330" height="26" fill="#475569" stroke="#1e293b"/>
  <text x="610" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Shaft to Clubhead →</text>

  <!-- Force Vectors & Midpoint Geometry -->
  <!-- Lead Hand Force Vector (Pulling backward / upward in late swing) -->
  <line x1="150" y1="210" x2="150" y2="175" stroke="#2563eb" stroke-width="3" marker-end="url(#force-blue)"/>
  <text x="150" y="228" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#2563eb">F_L,y &gt; 0 (Pull Back)</text>
  <text x="150" y="243" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#1e3a8a">+228.6 N (WSCG sim)</text>

  <!-- Trail Hand Force Vector (Pushing forward / downward) -->
  <line x1="360" y1="70" x2="360" y2="105" stroke="#dc2626" stroke-width="3" marker-end="url(#force-red)"/>
  <text x="360" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">F_T,y &lt; 0 (Push Forward)</text>
  <text x="360" y="75" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" fill="#7f1d1d">-259.5 N (WSCG sim)</text>

  <!-- Midpoint M indicator -->
  <line x1="255" y1="95" x2="255" y2="280" stroke="#0f172a" stroke-width="1.8" stroke-dasharray="4,3"/>
  <circle cx="255" cy="140" r="5" fill="#0f172a"/>
  <text x="255" y="85" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Midpoint M</text>

  <!-- Inter-hand spacing dimension (Center to Center) -->
  <line x1="150" y1="260" x2="360" y2="260" stroke="#475569" stroke-width="1.5" marker-start="url(#dim-arrow-l)" marker-end="url(#dim-arrow-r)"/>
  <text x="255" y="275" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#334155">Inter-Hand Separation s = 0.0762 m (3.0 in)</text>

  <!-- Telemetry Takeaways Box -->
  <rect x="45" y="300" width="730" height="65" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="55" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#0f172a">
    Empirical Findings from Physical Load Cells:
  </text>
  <text x="55" y="338" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">
    1. <tspan font-weight="bold">Opposed Force Couple:</tspan> The push-pull pair produces C_F,M = -s·F_d,y ≈ -18.6 N·m, directly confirmed by strain sensors.
  </text>
  <text x="55" y="353" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#334155">
    2. <tspan font-weight="bold">Immune to Inverse-Dynamics Artifacts:</tspan> Measures contact forces directly without optical marker noise, numerical differentiation, or coordinate assumptions.
  </text>
</svg>
