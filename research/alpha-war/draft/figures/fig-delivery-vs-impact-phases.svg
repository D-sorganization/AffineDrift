<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1f77b4" />
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2ca02c" />
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#d62728" />
    </marker>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#333333" />
    </marker>
  </defs>

  <!-- Title & Header -->
  <text x="30" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#111111">Figure 1.1: Two Phases of Late-Downswing Hand Kinetics</text>
  <text x="30" y="48" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#555555">Active positive hand couple during delivery vs momentum outrun and freewheeling in the impact zone</text>

  <!-- Panel 1: Delivery Phase -->
  <rect x="25" y="65" width="365" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="25" y="65" width="365" height="38" rx="8" fill="#e2e8f0"/>
  <text x="40" y="89" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Phase 1: Delivery (~t = -150 to -40 ms)</text>
  
  <text x="40" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#15803d">Active Positive Couple (C_alpha &gt;&gt; 0)</text>
  <text x="40" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Hands pull along curved trajectory</text>
  <text x="40" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Active forearm drive unhinges wrists (+35 to +60 N·m)</text>
  <text x="40" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Shaft maintains substantial lag angle (beta &gt; 45°)</text>

  <!-- Graphic Phase 1 -->
  <!-- Hand Path Arc -->
  <path d="M 60 210 Q 140 230 200 300" fill="none" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="2"/>
  <text x="65" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Grip path</text>

  <!-- Hand grip -->
  <circle cx="160" cy="255" r="7" fill="#1f77b4"/>
  <text x="110" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#1f77b4">Hands (M)</text>

  <!-- Force Vector R -->
  <line x1="160" y1="255" x2="110" y2="295" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="80" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#1f77b4">Inward Pull R</text>

  <!-- Club Shaft lagging -->
  <line x1="160" y1="255" x2="310" y2="215" stroke="#334155" stroke-width="4"/>
  <!-- Clubhead -->
  <rect x="306" y="205" width="22" height="18" rx="3" fill="#0f172a"/>
  <text x="335" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Clubhead</text>

  <!-- Positive uncocking torque arrow (curving forward CCW) -->
  <path d="M 180 235 A 25 25 0 0 1 185 275" fill="none" stroke="#15803d" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="195" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#15803d">+C_alpha (Torque)</text>

  <!-- Bottom Panel 1 note -->
  <rect x="35" y="345" width="345" height="48" rx="4" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="45" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#166534">State: Forearms accelerate the club</text>
  <text x="45" y="381" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#15803d">Positive work done directly by wrist torque couple</text>


  <!-- Panel 2: Impact Zone -->
  <rect x="410" y="65" width="365" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="410" y="65" width="365" height="38" rx="8" fill="#e2e8f0"/>
  <text x="425" y="89" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Phase 2: Impact Zone (~t = -40 to 0 ms)</text>

  <text x="425" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#b91c1c">Momentum Outrun (C_alpha &lt;= 0, M_G &gt; 0)</text>
  <text x="425" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Grip decelerates and curves upward around body</text>
  <text x="425" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Clubhead linear speed surges to &gt;110 mph</text>
  <text x="425" y="174" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">• Wrist couple reverses negative (-15 to -25 N·m)</text>

  <!-- Graphic Phase 2 -->
  <!-- Grip path curving upward -->
  <path d="M 480 320 Q 520 280 535 210" fill="none" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="2"/>
  <text x="460" y="335" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Upward hub path</text>

  <!-- Hand grip -->
  <circle cx="535" cy="220" r="7" fill="#1f77b4"/>
  <text x="475" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#1f77b4">Hands (M)</text>

  <!-- Upward centripetal pull vector -->
  <line x1="535" y1="220" x2="520" y2="160" stroke="#1f77b4" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="465" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#1f77b4">Centripetal Pull</text>

  <!-- Club Shaft uncocked / vertical into impact -->
  <line x1="535" y1="220" x2="555" y2="350" stroke="#334155" stroke-width="4"/>
  <!-- Club Center of Mass G -->
  <circle cx="549" cy="312" r="5" fill="#f59e0b"/>
  <text x="560" y="315" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#d97706">COM (G)</text>

  <!-- Clubhead -->
  <rect x="543" y="346" width="24" height="18" rx="3" fill="#0f172a"/>
  <text x="575" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Ball Strike</text>

  <!-- Negative hand couple arrow (curving clockwise - braking) -->
  <path d="M 555 240 A 22 22 0 0 1 520 245" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="560" y="248" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">-C_alpha (Braking / Lag)</text>

  <!-- Bottom Panel 2 note -->
  <rect x="420" y="345" width="345" height="48" rx="4" fill="#fef2f2" stroke="#fecaca"/>
  <text x="430" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="bold" fill="#991b1b">State: Clubhead outruns forearm muscles</text>
  <text x="430" y="381" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#b91c1c">Passive centrifugal whip &amp; hub pull sustain club speed</text>

  <!-- Bottom Takeaway -->
  <text x="400" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">
    Takeaway: A golfer feels strong exertion, but clubhead momentum outstrips wrist contraction speed, reversing the hand couple to negative.
  </text>
</svg>
