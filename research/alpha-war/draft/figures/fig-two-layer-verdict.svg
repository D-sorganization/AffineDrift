<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img">
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#333"/>
    </marker>
    <marker id="arrowGreenL" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2ca02c"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="40" y="26" font-size="13" font-weight="bold" fill="#111">Figure 8.1: The Two-Layer Resolution of the Alpha War</text>
  <text x="40" y="44" font-size="10.5" fill="#444">Reconciling Definitional Reference-Point Differences (Layer 1) with Physical &amp; Methodological Mechanisms (Layer 2)</text>

  <!-- ================= LAYER 1 ================= -->
  <rect x="40" y="58" width="740" height="175" fill="#f8fafc" stroke="#b0c4de" stroke-width="1.5" rx="6"/>
  <rect x="40" y="58" width="740" height="26" fill="#e2e8f0" rx="6"/>
  <text x="55" y="75" font-size="11.5" font-weight="bold" fill="#1e3a8a">LAYER 1: DEFINITIONAL RECONCILIATION — SETTLED &amp; MATHEMATICALLY COMPLETE</text>
  <text x="660" y="75" font-size="9.5" font-weight="bold" fill="#16a34a">✓ RESOLVED</text>

  <!-- Box 1: Camp B -->
  <rect x="55" y="94" width="200" height="85" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
  <text x="65" y="112" font-size="10" font-weight="bold" fill="#dc2626">Camp B (Kwon, MacKenzie, Tutelman)</text>
  <text x="65" y="128" font-size="10.5" font-weight="bold" fill="#111">Pure Hand Couple at Grip (C_alpha,M)</text>
  <text x="65" y="146" font-size="11" font-weight="bold" fill="#dc2626">C_alpha &lt; 0  (-15 to -25 N·m)</text>
  <text x="65" y="164" font-size="9" fill="#555">Retarding uncocking at wrist junction</text>

  <!-- Math Plus -->
  <circle cx="282" cy="136" r="14" fill="#e2e8f0"/>
  <text x="282" y="141" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">+</text>

  <!-- Box 2: Force Levering -->
  <rect x="310" y="94" width="200" height="85" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
  <text x="320" y="112" font-size="10" font-weight="bold" fill="#2563eb">Centripetal Hub Pull Levering</text>
  <text x="320" y="128" font-size="10.5" font-weight="bold" fill="#111">Moment of Net Force (-d_G/M * R_y)</text>
  <text x="320" y="146" font-size="11" font-weight="bold" fill="#2563eb">-d * R_y &gt; 0  (+30 to +60 N·m)</text>
  <text x="320" y="164" font-size="9" fill="#555">Inward hand acceleration (R_y &lt; 0)</text>

  <!-- Math Equals -->
  <circle cx="538" cy="136" r="14" fill="#e2e8f0"/>
  <text x="538" y="141" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">=</text>

  <!-- Box 3: Camp A -->
  <rect x="565" y="94" width="200" height="85" fill="#ffffff" stroke="#cbd5e1" rx="4"/>
  <text x="575" y="112" font-size="10" font-weight="bold" fill="#16a34a">Camp A (Jacobs 3D, Manzella)</text>
  <text x="575" y="128" font-size="10.5" font-weight="bold" fill="#111">Sum of Moments about COM (M_alpha,G)</text>
  <text x="575" y="146" font-size="11" font-weight="bold" fill="#16a34a">M_alpha,G &gt; 0  (+15 to +40 N·m)</text>
  <text x="575" y="164" font-size="9" fill="#555">Accelerating clubhead toward contact</text>

  <!-- Layer 1 Conclusion Banner -->
  <rect x="55" y="190" width="710" height="32" fill="#eff6ff" stroke="#bfdbfe" rx="3"/>
  <text x="410" y="206" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Layer 1 Verdict: Both quantities are physically valid! M_alpha,G = C_alpha,M - d_G/M * R_y = I_G * alpha_club.
  </text>
  <text x="410" y="218" font-size="8.5" text-anchor="middle" fill="#3b82f6">
    The primary Alpha War was a definitional dispute: Camp B plotted the grip couple; Camp A plotted COM moment or pivot torque.
  </text>

  <!-- ================= LAYER 2 ================= -->
  <rect x="40" y="244" width="740" height="210" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" rx="6"/>
  <rect x="40" y="244" width="740" height="26" fill="#fef3c7" rx="6"/>
  <text x="55" y="261" font-size="11.5" font-weight="bold" fill="#92400e">LAYER 2: PHYSICAL &amp; METHODOLOGICAL MECHANISMS — PROVISIONAL BOUNDARIES</text>
  <text x="610" y="261" font-size="9.5" font-weight="bold" fill="#b45309">⚠ NOT DECLARED SETTLED</text>

  <!-- Sub-mechanisms 4 columns -->
  <!-- Col 1: Muscle Mechanics -->
  <rect x="52" y="280" width="168" height="110" fill="#ffffff" stroke="#fcd34d" rx="4"/>
  <text x="60" y="296" font-size="9.5" font-weight="bold" fill="#b45309">1. Muscle Force-Velocity</text>
  <text x="60" y="312" font-size="8.5" fill="#444">• Joint velocity &gt; 2000°/s</text>
  <text x="60" y="326" font-size="8.5" fill="#444">• Rapid muscle shortening</text>
  <text x="60" y="340" font-size="8.5" fill="#444">• Hill force drops toward 0</text>
  <text x="60" y="356" font-size="8.5" font-weight="bold" fill="#dc2626">Cannot push &gt;+15 N·m</text>
  <text x="60" y="372" font-size="8" fill="#666">Cross-bridges outrun</text>

  <!-- Col 2: Shaft Rebound -->
  <rect x="232" y="280" width="168" height="110" fill="#ffffff" stroke="#fcd34d" rx="4"/>
  <text x="240" y="296" font-size="9.5" font-weight="bold" fill="#b45309">2. Shaft Elastic Rebound</text>
  <text x="240" y="312" font-size="8.5" fill="#444">• 11° forward lead bend</text>
  <text x="240" y="326" font-size="8.5" fill="#444">• 465 N opposing force</text>
  <text x="240" y="340" font-size="8.5" fill="#444">• -35.43 N·m elastic couple</text>
  <text x="240" y="356" font-size="8.5" font-weight="bold" fill="#dc2626">Overpowers +10 N·m hands</text>
  <text x="240" y="372" font-size="8" fill="#666">Net couple: -25.43 N·m</text>

  <!-- Col 3: Passive Linkage Dynamics -->
  <rect x="412" y="280" width="168" height="110" fill="#ffffff" stroke="#fcd34d" rx="4"/>
  <text x="420" y="296" font-size="9.5" font-weight="bold" fill="#b45309">3. Passive Drift / ZTCF</text>
  <text x="420" y="312" font-size="8.5" fill="#444">• Putnam interaction torque</text>
  <text x="420" y="326" font-size="8.5" fill="#444">• Hub path deceleration</text>
  <text x="420" y="340" font-size="8.5" fill="#444">• 86.04% passive share</text>
  <text x="420" y="356" font-size="8.5" font-weight="bold" fill="#2563eb">Unforced kinematic reaction</text>
  <text x="420" y="372" font-size="8" fill="#666">WSCG KKT drift model</text>

  <!-- Col 4: Filtering & Grasp -->
  <rect x="592" y="280" width="176" height="110" fill="#ffffff" stroke="#fcd34d" rx="4"/>
  <text x="600" y="296" font-size="9.5" font-weight="bold" fill="#b45309">4. Pipeline &amp; Indeterminacy</text>
  <text x="600" y="312" font-size="8.5" fill="#444">• fc &lt; 10 Hz: over-smooths</text>
  <text x="600" y="326" font-size="8.5" fill="#444">• Across-impact: collision bleed</text>
  <text x="600" y="340" font-size="8.5" fill="#444">• 12-DOF split-grip nullspace</text>
  <text x="600" y="356" font-size="8.5" font-weight="bold" fill="#9333ea">Pipeline-dependent sign</text>
  <text x="600" y="372" font-size="8" fill="#666">Requires Protocol 1 &amp; 5</text>

  <!-- Layer 2 Status Footer -->
  <rect x="52" y="400" width="716" height="42" fill="#fff" stroke="#fde68a" rx="3"/>
  <text x="410" y="416" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#92400e">
    Why Layer 2 is NOT DECLARED SETTLED: Polarity depends on filter cutoff, pre-impact truncation (&gt;=20 ms), and frame mapping.
  </text>
  <text x="410" y="432" font-size="8.5" text-anchor="middle" fill="#666">
    Open empirical adjudication requires Protocol 1 (Same-Swing Dual Pipeline) and Protocol 5 (12-Axis Split-Grip Telemetry).
  </text>
</svg>