<text x="58" y="20" font-size="13" font-weight="bold">Fig 4: Butterworth cutoff sweep (4-100 Hz): pre-impact truncation vs across-impact bleed</text>
<text x="58" y="37" font-size="10.8" fill="#333">Plain-language takeaway: Low cutoffs (&lt;10 Hz) erase the negative peak and flip sign; filtering across impact bleeds collision force backward.</text>
<text x="58" y="52" font-size="10.2" fill="#555">Filter: 2nd-order Butterworth per pass, bidirectional zero-lag filtfilt (effective 4th-order) | Retain kinematics through t = -20 ms only in Panel (a) | Frame: F_FSP (+CCW uncocking)</text>
<text x="58" y="72" font-size="11.5" font-weight="bold" fill="#1f77b4">Panel (a): Pre-impact truncation (&gt;=20 ms) — couple at retention boundary</text>
<text x="428" y="72" font-size="11.5" font-weight="bold" fill="#d62728">Panel (b): Filtering across impact (collision bleed)</text>
