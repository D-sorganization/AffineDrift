<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img">
<defs>
  <marker id="fsp-arrow-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#1f77b4"/>
  </marker>
  <marker id="fsp-arrow-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#d62728"/>
  </marker>
  <marker id="fsp-arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#15803d"/>
  </marker>
</defs>
<rect x="10" y="10" width="740" height="340" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="30" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Functional swing plane (schematic) — Kwon FSP &amp; Instantaneous Plane Geometry</text>
<text x="30" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#475569">Orthogonal triad (e_t, e_n, e_b): clubhead trajectory, inward grip hub arc, and out-of-plane normal axis e_alpha</text>
<polygon points="90,285 260,95 680,95 510,285" fill="#e0f2fe" fill-opacity="0.55" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="515" y="116" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">Functional Swing Plane (F_FSP)</text>
<ellipse cx="385" cy="195" rx="220" ry="68" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="230" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#334155">Instantaneous swing plane &amp; clubhead delivery arc</text>
<path d="M 250 185 Q 310 225 395 205" fill="none" stroke="#1f77b4" stroke-width="2.5"/>
<circle cx="315" cy="205" r="6.5" fill="#1f77b4"/>
<text x="225" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#1f77b4">Grip hub (M)</text>
<line x1="315" y1="205" x2="545" y2="145" stroke="#0f172a" stroke-width="3.5"/>
<circle cx="545" cy="145" r="7" fill="#0f172a"/>
<text x="558" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Club path &amp; head</text>
<line x1="315" y1="205" x2="315" y2="105" stroke="#d62728" stroke-width="2.5" marker-end="url(#fsp-arrow-red)"/>
<text x="325" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="bold" fill="#d62728">Out-of-plane normal e_b = e_alpha (+CCW uncocking)</text>
<line x1="315" y1="205" x2="365" y2="155" stroke="#15803d" stroke-width="2.2" marker-end="url(#fsp-arrow-green)"/>
<text x="372" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#15803d">Centripetal normal e_n</text>
<line x1="315" y1="205" x2="405" y2="225" stroke="#1f77b4" stroke-width="2.2" marker-end="url(#fsp-arrow-blue)"/>
<text x="412" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#1f77b4">Tangent e_t</text>
<rect x="25" y="302" width="710" height="34" rx="4" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="38" y="323" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#334155">Key insight: Alpha torque C_alpha is the moment component projected onto the plane normal e_alpha perpendicular to the FSP.</text>
</svg>