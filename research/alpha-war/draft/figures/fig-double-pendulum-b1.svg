<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img">
  <title>Planar double pendulum: absolute angles and hinge torques (Appendix B.1)</title>
  <desc>Schematic arm link with angle theta1 from horizontal, club link with angle theta2, wrist hinge torque tau2 and shoulder torque tau1, and cock angle phi equals theta2 minus theta1. Positive uncocking is counterclockwise.</desc>
  <line x1="80" y1="240" x2="560" y2="240" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="90" y="258" font-size="12" fill="#555">horizontal reference</text>
  <circle cx="120" cy="240" r="6" fill="#333"/>
  <text x="98" y="228" font-size="13">O (shoulder)</text>
  <line x1="120" y1="240" x2="260" y2="130" stroke="#1f77b4" stroke-width="5"/>
  <text x="200" y="175" font-size="14" fill="#1f77b4">arm L1</text>
  <line x1="260" y1="130" x2="420" y2="70" stroke="#d62728" stroke-width="5"/>
  <text x="340" y="88" font-size="14" fill="#d62728">club (COM at r_G2)</text>
  <path d="M 120 240 A 80 80 0 0 0 200 185" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="165" y="225" font-size="15">theta1</text>
  <path d="M 260 130 A 70 70 0 0 0 330 95" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="300" y="118" font-size="15">theta2</text>
  <path d="M 248 145 A 35 35 0 0 0 275 112" fill="none" stroke="#9467bd" stroke-width="2"/>
  <text x="268" y="142" font-size="14" fill="#9467bd">phi</text>
  <text x="400" y="52" font-size="12">+CCW uncocking (positive release)</text>
  <text x="430" y="150" font-size="13">tau2 at wrist hinge</text>
  <text x="90" y="200" font-size="13">tau1 at shoulder</text>
</svg>
