name: Anti-Phantom Merge Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write
  issues: read

concurrency:
  group: anti-phantom-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  guard:
    timeout-minutes: 60
    # Fork PRs are routed to a hosted runner, never skipped (RM#1989).
    runs-on: >-
      ${{ github.event.pull_request &&
      github.event.pull_request.head.repo.full_name != github.repository &&
      'ubuntu-latest' || vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      (github.event_name == 'pull_request' ||
       github.event.label.name == 'phantom-guard-override') || github.event.pull_request.base.ref == 'master'
    steps:
      # Never check out PR head code on pull_request_target: that event runs in
      # the base-repo security context. No step needs a checkout: every rule
      # reads the PR through the REST API, so both events behave identically
      # (RM#1989).
      - name: Anti-phantom guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -eo pipefail

          # Override label takes precedence — admins only
          LABELS=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name] | join(",")')
          if echo "$LABELS" | grep -qw "phantom-guard-override"; then
            ACTOR="${{ github.actor }}"
            PERM=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission 2>/dev/null || echo "none")
            if [ "$PERM" = "admin" ]; then
              echo "::notice::phantom-guard-override label applied by admin; skipping checks."
              exit 0
            else
              echo "::warning::phantom-guard-override label found but actor $ACTOR is not admin (perm=$PERM); ignoring label."
            fi
          fi

          # Fetch diff stats without relying on runner-provided jq.
          FILES=$(gh pr view "$PR" --repo "$REPO" --json changedFiles --jq .changedFiles)
          TITLE=$(gh pr view "$PR" --repo "$REPO" --json title --jq .title)
          BODY=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body)
          # REST pagination: the GraphQL file listing caps at 100 files.
          PR_FILES=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')

          FAIL=""
          fail() { FAIL="${FAIL}- $1\n"; }

          # Rule 1: empty diff
          if [ "$FILES" -eq 0 ] && [ "$TITLE" != "chore: empty PR" ]; then
            fail "Rule 1 (empty diff): PR has zero changed files. If intentional, set title to exactly 'chore: empty PR'."
          fi

          # Rule 2: feature claim without code
          if echo "$TITLE" | grep -qiE '^feat[(:]|Implement|System|Engine|Framework'; then
            CODE_FILES=$(echo "$PR_FILES" | grep -cE '^(src/|rust_core/|api/)' || true)
            if [ "${CODE_FILES:-0}" -lt 1 ]; then
              fail "Rule 2 (feature without code): title claims a feature but PR touches zero files under src/, rust_core/, or api/."
            fi
          fi

          # Rule 3: closes-issue path mismatch. The REST files API returns at most
          # 3000 files, so a larger PR cannot be checked: fail closed, never pass
          # on partial data.
          ISSUE_NUM=$(echo "$BODY" | grep -ioE '(Closes|Fixes|Resolves) #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -n "$ISSUE_NUM" ] && [ "$FILES" -gt 3000 ]; then
            fail "Rule 3 (file list truncated): PR changes $FILES files but the GitHub files API lists at most 3,000, so the paths referenced by #$ISSUE_NUM cannot be verified. Split the PR or apply the phantom-guard-override label (admin-only)."
          elif [ -n "$ISSUE_NUM" ]; then
            ISSUE_BODY=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json body --jq .body 2>/dev/null || echo "")
            REF_PATHS=$(echo "$ISSUE_BODY" | grep -oE '(src|tests|rust_core|api)/[A-Za-z0-9_./-]+' | sort -u || true)
            if [ -n "$REF_PATHS" ]; then
              MATCH=0
              while IFS= read -r path; do
                if echo "$PR_FILES" | grep -qF "$path"; then MATCH=1; break; fi
              done <<< "$REF_PATHS"
              if [ "$MATCH" -eq 0 ]; then
                fail "Rule 3 (issue path mismatch): PR closes #$ISSUE_NUM but touches none of the paths the issue body references."
              fi
            fi
          fi

          # Rule 4: bot-only commits, read from the PR's commits via the REST API
          # on every event (no checkout; same result on pull_request and
          # pull_request_target).
          COMMITS=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | [(.author.login // .commit.author.name), (.commit.message | split("\n")[0])] | @tsv')
          LAST_COMMITTER=$(printf '%s\n' "$COMMITS" | tail -n 1 | cut -f1)
          LAST_MSG=$(printf '%s\n' "$COMMITS" | tail -n 1 | cut -f2-)
          if [ "$LAST_COMMITTER" = "github-actions[bot]" ] && echo "$LAST_MSG" | grep -q "^Merge branch 'main'"; then
            HUMAN_COMMITS=$(printf '%s\n' "$COMMITS" | cut -f1 | grep -cv -E '\[bot\]$' || true)
            if [ "${HUMAN_COMMITS:-0}" -eq 0 ]; then
              fail "Rule 4 (bot-only commits): the only commits since branch point are 'Merge branch main' from github-actions[bot]; branch likely absorbed via sibling PR."
            fi
          fi

          if [ -n "$FAIL" ]; then
            printf "::error::Anti-phantom guard failed:\n%b" "$FAIL"
            COMMENT=$(printf "## Anti-Phantom Merge Guard failed\n\n%b\n### Override\nApply the \`phantom-guard-override\` label (admin-only) to bypass. Documented at .github/workflows/anti-phantom-merge.yml" "$FAIL")
            gh pr comment "$PR" --repo "$REPO" --body "$COMMENT" >/dev/null
            exit 1
          fi
          echo "::notice::Anti-phantom guard passed."
