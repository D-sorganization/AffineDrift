name: Compile LaTeX Textbooks

on:
  push:
    branches:
      - main
      - staging
      - geometry-of-motion-series
    paths:
      - "articles/The_Geometry_of_Motion/**"
  pull_request:
    branches:
      - main
    paths:
      - "articles/The_Geometry_of_Motion/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_textbooks:
    if: github.repository == 'D-sorganization/AffineDrift'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile Volume 0
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        continue-on-error: true
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_0
          pre_compile: "rm -f *.aux chapters/*.aux"
          args: "-pdf -file-line-error -interaction=nonstopmode -f"

      - name: Verify Volume 0 PDF exists
        run: |
          if [ -f articles/The_Geometry_of_Motion/Volume_0/main.pdf ]; then
            echo "Volume 0 PDF generated successfully"
            ls -lh articles/The_Geometry_of_Motion/Volume_0/main.pdf
          else
            echo "ERROR: Volume 0 PDF was not generated"
            exit 1
          fi

      - name: Compile Volume I
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_I

      - name: Compile Volume II
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_II

      - name: Compile Volume III
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_III

      - name: Compile Volume IV
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_IV

      - name: Compile Volume V
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_V

      - name: Count Pages
        run: |
          apt-get update && apt-get install -y poppler-utils || echo "poppler-utils not available via apt-get"
          sudo apt-get update && sudo apt-get install -y poppler-utils || echo "sudo not available"
          for vol in Volume_0 Volume_I Volume_II Volume_III Volume_IV Volume_V; do
            if [ -f articles/The_Geometry_of_Motion/$vol/main.pdf ]; then
              pages=$(pdfinfo articles/The_Geometry_of_Motion/$vol/main.pdf | grep Pages | awk '{print $2}')
              echo "Volume $vol pages: $pages"
            fi
          done

      - name: Upload Volume 0 Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Geometry_of_Motion_Volume_0
          path: articles/The_Geometry_of_Motion/Volume_0/main.pdf

      - name: Upload Volume I Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Geometry_of_Motion_Volume_1
          path: articles/The_Geometry_of_Motion/Volume_I/main.pdf

      - name: Upload Volume II Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Geometry_of_Motion_Volume_2
          path: articles/The_Geometry_of_Motion/Volume_II/main.pdf

      - name: Upload Volume III Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Geometry_of_Motion_Volume_3
          path: articles/The_Geometry_of_Motion/Volume_III/main.pdf

      - name: Upload Volume IV Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Geometry_of_Motion_Volume_4
          path: articles/The_Geometry_of_Motion/Volume_IV/main.pdf

      - name: Upload Volume V Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Geometry_of_Motion_Volume_5
          path: articles/The_Geometry_of_Motion/Volume_V/main.pdf

      - name: Install Python PDF tools
        run: pip install PyPDF2

      - name: Merge all volumes into complete textbook
        run: |
          python3 << 'PYEOF'
          from PyPDF2 import PdfReader, PdfWriter
          import os

          output = PdfWriter()
          volumes = [
              ("articles/The_Geometry_of_Motion/Volume_0/main.pdf", "Volume 0: Mathematical Primer"),
              ("articles/The_Geometry_of_Motion/Volume_I/main.pdf", "Volume I: Rigid Body Kinematics"),
              ("articles/The_Geometry_of_Motion/Volume_II/main.pdf", "Volume II: Rotations and Rotational Dynamics"),
              ("articles/The_Geometry_of_Motion/Volume_III/main.pdf", "Volume III: Differential Geometry"),
              ("articles/The_Geometry_of_Motion/Volume_IV/main.pdf", "Volume IV: Advanced Dynamics"),
              ("articles/The_Geometry_of_Motion/Volume_V/main.pdf", "Volume V: Control Theory"),
          ]

          total = 0
          for path, title in volumes:
              if not os.path.exists(path):
                  print(f"  SKIP {title}: {path} not found")
                  continue
              reader = PdfReader(path)
              pages = len(reader.pages)
              total += pages
              first = len(output.pages)
              for page in reader.pages:
                  output.add_page(page)
              output.add_outline_item(title, first)
              print(f"  {title}: {pages} pages")

          out_path = "articles/The_Geometry_of_Motion/The_Geometry_of_Motion_Complete.pdf"
          with open(out_path, "wb") as f:
              output.write(f)
          size_mb = os.path.getsize(out_path) / 1024 / 1024
          print(f"\nComplete textbook: {total} pages, {size_mb:.1f} MB")
          PYEOF

      - name: Upload Complete Textbook
        uses: actions/upload-artifact@v7
        with:
          name: Geometry_of_Motion_Complete_Textbook
          path: articles/The_Geometry_of_Motion/The_Geometry_of_Motion_Complete.pdf
