name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Validation job - runs on all pushes and PRs
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tools
        run: |
          npm install -g html-validate
          npm install -g stylelint stylelint-config-standard

      - name: Validate HTML
        run: |
          echo "Validating HTML files..."
          npx html-validate "*.html" || echo "HTML validation completed with warnings"

      - name: Check CSS
        run: |
          echo "Checking CSS..."
          # Basic CSS validation - won't fail build but logs issues
          npx stylelint "*.css" --config-basedir . || echo "CSS check completed"

      - name: Check for common issues
        run: |
          echo "Checking for common issues..."
          # Check for TODO comments
          grep -r "TODO" *.html *.css *.js || echo "No TODOs found"
          # Check for console.log in production (warning only)
          grep -r "console.log" *.js && echo "Warning: console.log found in JS" || echo "No console.log found"

  # Build and deploy job
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          echo "Verifying required files exist..."
          test -f index.html && echo "✓ index.html found" || (echo "✗ index.html missing" && exit 1)
          test -f styles.css && echo "✓ styles.css found" || (echo "✗ styles.css missing" && exit 1)
          test -f script.js && echo "✓ script.js found" || (echo "✗ script.js missing" && exit 1)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🚀 Deployment successful!"
          echo "📍 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "✅ All files uploaded and deployed"

  # Accessibility check job (informational only)
  accessibility:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install accessibility tools
        run: npm install -g pa11y-ci

      - name: Start local server
        run: |
          python3 -m http.server 8000 &
          sleep 3

      - name: Run accessibility tests
        run: |
          echo "Running accessibility checks..."
          # pa11y-ci checks (informational)
          npx pa11y-ci http://localhost:8000 || echo "Accessibility check completed with suggestions"

      - name: Accessibility report
        run: |
          echo "📊 Accessibility check completed"
          echo "Review any warnings above to improve site accessibility"
