name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Pre-deployment validation - runs on all pushes and PRs
  pre-deploy-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: prerelease

      - name: Install validation tools
        run: |
          npm install -g html-validate@latest
          npm install -g stylelint@latest stylelint-config-standard@latest

      - name: Validate HTML
        continue-on-error: true
        run: |
          echo "Validating HTML files..."
          for file in *.html; do
            if [ -f "$file" ]; then
              npx html-validate "$file" || echo "⚠️ HTML validation issues in $file"
            fi
          done

      - name: Check CSS
        continue-on-error: true
        run: |
          echo "Checking CSS..."
          if [ -f styles.css ]; then
            npx stylelint styles.css --config-basedir . || echo "⚠️ CSS check completed with warnings"
          fi

      - name: Check for common issues
        run: |
          echo "Checking for common issues..."
          grep -r "TODO" *.html *.css *.js 2>/dev/null && echo "⚠️ Warning: TODO comments found" || echo "✓ No TODO comments found"
          grep -r "console.log" *.js 2>/dev/null && echo "⚠️ Warning: console.log found in JS" || echo "✓ No console.log found"

      - name: Render Quarto documents (if project exists)
        continue-on-error: true
        run: |
          if [ -f _quarto.yml ] || [ -f quarto.yml ]; then
            echo "Rendering Quarto documents..."
            quarto render --to html || echo "⚠️ Quarto render completed with warnings"
          else
            echo "No Quarto project found, skipping render"
          fi

  # Build and deploy job
  deploy:
    runs-on: ubuntu-latest
    needs: pre-deploy-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: prerelease

      - name: Render Quarto site (if project exists)
        continue-on-error: true
        run: |
          if [ -f _quarto.yml ] || [ -f quarto.yml ]; then
            echo "Rendering Quarto site..."
            quarto render --to html
          else
            echo "No Quarto project found, using static files"
          fi

      - name: Verify required files
        run: |
          echo "Verifying required files exist..."
          test -f index.html && echo "✓ index.html found" || (echo "✗ index.html missing" && exit 1)
          test -f styles.css && echo "✓ styles.css found" || (echo "✗ styles.css missing" && exit 1)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🚀 Deployment successful!"
          echo "📍 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "✅ All files uploaded and deployed"

  # Accessibility check job (informational only)
  accessibility:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install accessibility tools
        run: npm install -g pa11y-ci@latest

      - name: Start local server
        run: |
          python3 -m http.server 8000 &
          sleep 3

      - name: Run accessibility tests
        continue-on-error: true
        run: |
          echo "Running accessibility checks..."
          npx pa11y-ci http://localhost:8000 || echo "⚠️ Accessibility check completed with suggestions"

      - name: Accessibility report
        run: |
          echo "📊 Accessibility check completed"
          echo "Review any warnings above to improve site accessibility"
