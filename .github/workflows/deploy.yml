name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Pre-deployment validation - runs on all pushes and PRs
  pre-deploy-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install validation tools
        run: |
          npm install -g html-validate@latest
          npm install -g stylelint@latest stylelint-config-standard@latest

      - name: Validate HTML
        continue-on-error: true
        run: |
          echo "Validating HTML files..."
          for file in *.html; do
            if [ -f "$file" ]; then
              npx html-validate "$file" || echo "⚠️ HTML validation issues in $file"
            fi
          done

      - name: Check CSS
        continue-on-error: true
        run: |
          echo "Checking CSS..."
          if [ -f styles.css ]; then
            npx stylelint styles.css --config-basedir . || echo "⚠️ CSS check completed with warnings"
          fi

      - name: Check for common issues
        run: |
          echo "Checking for common issues..."
          # Check for TODO comments in HTML, CSS, and JS files (excluding generated directories)
          files=$(find . -name "*.html" -o -name "*.css" -o -name "*.js" | grep -v "./_site/" | grep -v "./docs/" | grep -v "./.git/" | grep -v "./.quarto/" || true)
          if [ -n "$files" ] && echo "$files" | xargs grep -l "TODO" 2>/dev/null; then
            echo "⚠️ Warning: TODO comments found"
          else
            echo "✓ No TODO comments found"
          fi
          # Check for console.log in JS files (excluding generated directories)
          js_files=$(find . -name "*.js" | grep -v "./_site/" | grep -v "./docs/" | grep -v "./.git/" | grep -v "./.quarto/" | grep -v "./node_modules/" || true)
          if [ -n "$js_files" ] && echo "$js_files" | xargs grep -l "console.log" 2>/dev/null; then
            echo "⚠️ Warning: console.log found in JS"
          else
            echo "✓ No console.log found"
          fi

      - name: Render Quarto documents (if project exists)
        continue-on-error: true
        run: |
          if [ -f _quarto.yml ] || [ -f quarto.yml ]; then
            echo "Rendering Quarto documents..."
            quarto render --to html || echo "⚠️ Quarto render completed with warnings"
          else
            echo "No Quarto project found, skipping render"
          fi

  # Build and deploy job
  deploy:
    runs-on: ubuntu-latest
    needs: pre-deploy-validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install helpers
        run: sudo apt-get update && sudo apt-get install -y yq

      - name: Render Quarto site (if project exists)
        continue-on-error: true
        run: |
          if [ -f _quarto.yml ] || [ -f quarto.yml ]; then
            echo "Rendering Quarto site..."
            quarto render --to html
          else
            echo "No Quarto project found, using static files"
          fi

      - name: Restore committed site on render failure
        run: |
          if [ -f _quarto.yml ] || [ -f quarto.yml ]; then
            OUTPUT_DIR=$(yq '.project["output-dir"] // "_site"' _quarto.yml 2>/dev/null || echo "_site")
          else
            OUTPUT_DIR='.'
          fi

          if [ "$OUTPUT_DIR" != "." ]; then
            INDEX_PATH="${OUTPUT_DIR%/}/index.html"
            if [ ! -f "$INDEX_PATH" ] && git ls-tree -r HEAD --name-only | grep -q "^${INDEX_PATH}$"; then
              echo "Quarto render did not produce ${INDEX_PATH}; restoring committed ${OUTPUT_DIR} contents."
              git checkout -- "$OUTPUT_DIR"
            fi
          fi

      - name: Verify required files
        run: |
          echo "Verifying required files exist..."
          if [ -f _quarto.yml ] || [ -f quarto.yml ]; then
            OUTPUT_DIR=$(yq '.project["output-dir"] // "_site"' _quarto.yml 2>/dev/null || echo "_site")
            echo "Detected Quarto project; using output directory: ${OUTPUT_DIR}"
          else
            OUTPUT_DIR='.'
            echo "No Quarto project detected; using repository root"
          fi

          INDEX_PATH="${OUTPUT_DIR%/}/index.html"
          STYLES_PATH="${OUTPUT_DIR%/}/styles.css"

          test -f "$INDEX_PATH" && echo "✓ ${INDEX_PATH} found" || (echo "✗ ${INDEX_PATH} missing" && exit 1)
          test -f "$STYLES_PATH" && echo "✓ ${STYLES_PATH} found" || (echo "✗ ${STYLES_PATH} missing" && exit 1)

      - name: Determine publish directory
        id: publish-dir
        run: |
          if [ -f _quarto.yml ] || [ -f quarto.yml ]; then
            OUTPUT_DIR=$(yq '.project["output-dir"] // "_site"' _quarto.yml 2>/dev/null || echo "_site")
          else
            OUTPUT_DIR='.'
          fi
          echo "publish_dir=${OUTPUT_DIR%/}" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '${{ steps.publish-dir.outputs.publish_dir }}'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        run: |
          echo "🚀 Deployment successful!"
          echo "📍 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "✅ All files uploaded and deployed"

  # Accessibility check job (informational only)
  accessibility:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install accessibility tools
        run: npm install -g pa11y-ci@latest

      - name: Start local server
        run: |
          python3 -m http.server 8000 &
          sleep 3

      - name: Run accessibility tests
        continue-on-error: true
        run: |
          echo "Running accessibility checks..."
          npx pa11y-ci http://localhost:8000 || echo "⚠️ Accessibility check completed with suggestions"

      - name: Accessibility report
        run: |
          echo "📊 Accessibility check completed"
          echo "Review any warnings above to improve site accessibility"
