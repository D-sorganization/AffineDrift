name: Quarto PDF Render

on:
  push:
    branches: [main]
    paths:
      - "articles/The_Geometry_of_Motion/quarto/**"
      - "articles/theory-part1.qmd"
      - "_quarto.yml"
      - ".github/workflows/quarto-pdf-render.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "articles/The_Geometry_of_Motion/quarto/**"
      - "articles/theory-part1.qmd"
      - "_quarto.yml"
      - ".github/workflows/quarto-pdf-render.yml"
  workflow_dispatch:

concurrency:
  group: pdf-render-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  render-quarto-pdf:
    if: github.repository == 'D-sorganization/AffineDrift'
    runs-on: d-sorg-fleet
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - id: gom-volume-0
            label: "Geometry of Motion Volume 0"
            workdir: articles/The_Geometry_of_Motion/quarto
            input: volume0.qmd
            output: GoM_Volume_0_Primer.pdf
            render_timeout: 20m
          - id: gom-volume-1
            label: "Geometry of Motion Volume 1"
            workdir: articles/The_Geometry_of_Motion/quarto
            input: volume1.qmd
            output: GoM_Volume_1_Foundations.pdf
            render_timeout: 25m
          - id: gom-volume-2
            label: "Geometry of Motion Volume 2"
            workdir: articles/The_Geometry_of_Motion/quarto
            input: volume2.qmd
            output: GoM_Volume_2_Trajectories.pdf
            render_timeout: 25m
          - id: theory-part-1
            label: "Theory Part 1"
            workdir: .
            input: articles/theory-part1.qmd
            output: Theory_Part1.pdf
            render_timeout: 15m

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        timeout-minutes: 5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        timeout-minutes: 5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        timeout-minutes: 8
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install jupyter numpy matplotlib

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        timeout-minutes: 5
        with:
          version: "1.6.39"

      - name: Verify TinyTeX availability
        timeout-minutes: 12
        run: |
          if command -v xelatex >/dev/null 2>&1 || command -v pdflatex >/dev/null 2>&1; then
            echo "TeX engine already available"
          else
            timeout --kill-after=60s 10m quarto install tinytex --no-prompt --update-path
          fi
          quarto check

      - name: Render ${{ matrix.label }}
        timeout-minutes: 30
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_pdf_output"
          cd "${{ matrix.workdir }}"
          timeout --kill-after=90s "${{ matrix.render_timeout }}" \
            quarto render "${{ matrix.input }}" --to pdf \
              --output-dir "$GITHUB_WORKSPACE/_pdf_output" \
              --output "${{ matrix.output }}"

      - name: Upload ${{ matrix.id }} artifact
        if: always()
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: quarto-pdf-${{ matrix.id }}
          path: _pdf_output/*.pdf
          if-no-files-found: warn
          retention-days: 5

      - name: Cleanup possible render children
        if: always()
        timeout-minutes: 2
        run: |
          pkill -TERM -u "$USER" -f 'quarto|pandoc|xelatex|pdflatex|latexmk|tlmgr' || true
          sleep 5
          pkill -KILL -u "$USER" -f 'quarto|pandoc|xelatex|pdflatex|latexmk|tlmgr' || true

      - name: Publish Quarto PDFs to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          pdfs=(_pdf_output/*.pdf)
          if [ "${#pdfs[@]}" -eq 0 ]; then
            echo "No PDFs were rendered for this matrix entry; skipping release upload"
            exit 0
          fi

          TAG_NAME="textbook-pdfs-latest"
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --title "Textbook PDFs (Latest)" \
              --notes "Automated PDFs: LaTeX volumes and Quarto-rendered chapters."
          for pdf in "${pdfs[@]}"; do
            name=$(basename "$pdf")
            gh release upload "$TAG_NAME" "${pdf}#Quarto_${name}" --clobber
          done
