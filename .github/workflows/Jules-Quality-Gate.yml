name: Jules Quality Gate (Security + Code Review)

# Consolidates Jules-Sentinel and Jules-Code-Quality-Reviewer
# into a single quality-focused workflow with two jobs.

on:
  workflow_call:
    inputs:
      days_to_review:
        description: 'Number of days of git history to review'
        required: false
        default: '2'
        type: string
  workflow_dispatch:
    inputs:
      days_to_review:
        description: 'Number of days of git history to review'
        required: false
        default: '2'
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  security-events: write

concurrency:
  group: jules-quality-gate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Security Audit (formerly Jules-Sentinel) ─────────────
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          pip install safety bandit pip-audit semgrep || true
          npm install -g @google/jules

      - name: Run Security Scanners
        run: |
          mkdir -p reports

          echo "Running pip-audit..."
          pip-audit --format json -o reports/pip_audit.json 2>/dev/null || echo "[]" > reports/pip_audit.json

          echo "Running bandit..."
          bandit -r . -f json -o reports/bandit.json --exclude './.venv,./venv,./env,./.git' 2>/dev/null || echo "[]" > reports/bandit.json

          echo "Running semgrep..."
          semgrep --config=auto --json -o reports/semgrep.json . 2>/dev/null || echo "{}" > reports/semgrep.json

      - name: Jules Sentinel Analysis
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -e
          DATE=$(date +%Y-%m-%d)
          REPO="${{ github.repository }}"
          API_BASE="https://jules.googleapis.com/v1alpha"

          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::JULES_API_KEY not configured. Skipping Jules task."
            exit 0
          fi

          echo "Looking up repository source..."
          SOURCES=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/sources" || echo '{"sources":[]}')

          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)

          SOURCE_ID=$(echo "$SOURCES" | jq -r ".sources[] | select(.githubRepo.owner == \"$OWNER\" and .githubRepo.repo == \"$REPO_NAME\") | .name" | head -1)

          if [ -z "$SOURCE_ID" ] || [ "$SOURCE_ID" = "null" ]; then
            echo "::warning::Repository $REPO not found in Jules sources."
            exit 0
          fi

          echo "Found source: $SOURCE_ID"

          PROMPT=$(cat << 'PROMPT_EOF'
          '
          You are the SENTINEL security agent.

          Analyze the security audit reports in ./reports/ and document findings.

          ## DO NOT MODIFY CODE directly. Instead:

          ### For HIGH severity: Create GitHub Issue with labels: security, high-priority, jules:sentinel
          ### For MEDIUM severity: Add to .jules/sentinel.md and create Issue
          ### For LOW severity: Document in .jules/sentinel.md only

          Update .jules/sentinel.md with scan results summary.

          CRITICAL: This is a READ-ONLY audit. Do not fix code - only document and create issues.
          PROMPT_EOF
          )

          echo "Creating Jules session..."
          REQUEST_JSON=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "$SOURCE_ID" \
            '{
              prompt: $prompt,
              sourceContext: {
                source: $source,
                githubRepoContext: {
                  startingBranch: "main"
                }
              }
            }')

          HTTP_CODE=$(curl -s -o /tmp/session_response.json -w "%{http_code}" -X POST \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_JSON" \
            "$API_BASE/sessions")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Jules API returned HTTP $HTTP_CODE"
            exit 1
          fi

          SESSION_ID=$(cat /tmp/session_response.json | jq -r '.name')
          echo "Created session: $SESSION_ID"

          MAX_WAIT=1800
          POLL_INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            SESSION_STATUS=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/$SESSION_ID")
            STATE=$(echo "$SESSION_STATUS" | jq -r '.state')
            echo "Session state: $STATE (elapsed: ${ELAPSED}s)"

            case "$STATE" in
              "COMPLETED"|"SUBMITTED") echo "Session completed!"; break ;;
              "FAILED"|"CANCELLED") echo "::error::Session $STATE"; exit 1 ;;
            esac
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

      - name: Commit Journal
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs(sentinel): security audit"
          file_pattern: ".jules/sentinel.md"

  # ── Job 2: Code Quality Review (formerly Jules-Code-Quality-Reviewer) ───
  code-quality-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt || true
          npm install -g @google/jules

      - name: Gather Git History
        id: history
        env:
          DAYS: ${{ inputs.days_to_review || '2' }}
        run: |
          mkdir -p .jules/review_data
          SINCE_DATE=$(date -d "$DAYS days ago" +%Y-%m-%d)

          git log --since="$SINCE_DATE" --pretty=format:'%H|%an|%s|%ad' --date=short > .jules/review_data/commits.txt
          git log --since="$SINCE_DATE" -p --no-color > .jules/review_data/diffs.txt

          COMMIT_COUNT=$(git log --since="$SINCE_DATE" --oneline | wc -l)
          echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

      - name: Jules Code Quality Review
        if: steps.history.outputs.commit_count > 0
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          DAYS: ${{ inputs.days_to_review || '2' }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          API_BASE="https://jules.googleapis.com/v1alpha"

          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::JULES_API_KEY not configured. Skipping Jules task."
            exit 0
          fi

          SOURCES=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/sources" || echo '{"sources":[]}')
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          SOURCE_ID=$(echo "$SOURCES" | jq -r ".sources[] | select(.githubRepo.owner == \"$OWNER\" and .githubRepo.repo == \"$REPO_NAME\") | .name" | head -1)

          if [ -z "$SOURCE_ID" ] || [ "$SOURCE_ID" = "null" ]; then
            echo "::warning::Repository $REPO not found in Jules sources."
            exit 0
          fi

          PROMPT=$(cat << 'PROMPT_EOF'
          You are the CODE QUALITY REVIEWER agent.

          Review git history in .jules/review_data/ for the last few days.

          ## Review For:
          1. Coherent plan alignment with project guidelines
          2. Damaging or breaking changes
          3. Truncated/incomplete work
          4. Placeholders (TODO, FIXME, NotImplemented)
          5. Workarounds or hacks
          6. CI/CD gaming (modifying tests to pass, disabling checks)

          ## Output:
          1. Save report to: docs/assessments/changelog_reviews/
          2. Update docs/assessments/Code_Quality_Review_Latest.md
          3. For CRITICAL issues: Create GitHub Issue with label 'jules:code-quality,critical'

          DO NOT over-flag minor issues. Focus on real problems.
          PROMPT_EOF
          )

          REQUEST_JSON=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "$SOURCE_ID" \
            '{
              prompt: $prompt,
              sourceContext: {
                source: $source,
                githubRepoContext: { startingBranch: "main" }
              },
              automationMode: "AUTO_CREATE_PR"
            }')

          HTTP_CODE=$(curl -s -o /tmp/session_response.json -w "%{http_code}" -X POST \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_JSON" \
            "$API_BASE/sessions")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Jules API returned HTTP $HTTP_CODE"
            exit 1
          fi

          SESSION_ID=$(cat /tmp/session_response.json | jq -r '.name')
          echo "Created session: $SESSION_ID"

          MAX_WAIT=1800
          POLL_INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            SESSION_STATUS=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/$SESSION_ID")
            STATE=$(echo "$SESSION_STATUS" | jq -r '.state')
            echo "Session state: $STATE (elapsed: ${ELAPSED}s)"

            case "$STATE" in
              "COMPLETED"|"SUBMITTED") echo "Session completed!"; break ;;
              "FAILED"|"CANCELLED") echo "::error::Session $STATE"; exit 1 ;;
            esac
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

      - name: Commit Results
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs(review): code quality review"
          file_pattern: "docs/assessments/**/*.md"
