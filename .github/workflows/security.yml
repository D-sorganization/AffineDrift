name: Security Gates

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit-sast:
    name: Bandit SAST
    runs-on: d-sorg-fleet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit==1.7.7

      - name: Run Bandit SAST (medium+ severity, blocking)
        # -ll = medium and high severity only; -r = recursive; non-zero exit on findings
        run: bandit -r src/ -ll

  detect-secrets:
    name: detect-secrets Scan
    runs-on: d-sorg-fleet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.4.0

      - name: Scan for new secrets against baseline
        # Fails if any secrets are found that are not already in the baseline.
        # Use a fresh scan and compare only the hashed results — not the full
        # JSON (scan rewrites metadata like timestamps, causing git diff to fire
        # even when no new secrets exist).
        run: |
          detect-secrets scan > /tmp/current-scan.json
          python3 - <<'EOF'
          import json, sys
          with open("/tmp/current-scan.json") as f:
              found = json.load(f).get("results", {})
          with open(".secrets.baseline") as f:
              baseline = json.load(f).get("results", {})
          new_secrets = []
          for path, secrets in found.items():
              known = {s["hashed_secret"] for s in baseline.get(path, [])}
              for s in secrets:
                  if s["hashed_secret"] not in known:
                      new_secrets.append(f"{path}: {s['type']}")
          if new_secrets:
              print("::error::New secrets detected not in .secrets.baseline:")
              for ns in new_secrets:
                  print(f"  {ns}")
              sys.exit(1)
          print("No new secrets detected.")
          EOF
