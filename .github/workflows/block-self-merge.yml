name: Reject Redundant Self-Approval

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  block-self-approval:
    timeout-minutes: 30
    name: Prevent author from approving own PR
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    steps:
      - name: Check for self-approval
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          # For pull_request_review events (when a review is submitted)
          if [ -n "$REVIEWER" ]; then
            if [ "$REVIEWER" = "$PR_AUTHOR" ] && [ "$REVIEW_STATE" = "APPROVED" ]; then
              echo "Error: PR author '$PR_AUTHOR' cannot approve their own pull request"
              echo "Self-approval is unnecessary; required checks govern merge readiness."
              exit 1
            fi
          fi
          echo "Review check passed"

      - name: Report merge-review policy
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Reviews are optional; live branch protection requires zero approvals.
          echo "Required status checks, not a named maintainer review, govern merge readiness."
          echo "Optional reviews remain available for risk, expertise, or unresolved feedback."
          echo ""
          echo "For review guidelines, see: CONTRIBUTING.md#code-review-guidelines"

      - name: Report status
        if: always()
        run: |
          echo "Self-approval guard status: OK"
          echo "No named maintainer approval is required by repository policy."
