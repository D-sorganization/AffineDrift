name: Block Self-Merges

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  block-self-approval:
    timeout-minutes: 30
    name: Prevent author from approving own PR
    runs-on: ubuntu-latest
    steps:
      - name: Check for self-approval
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REVIEWER: ${{ github.event.review.user.login }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          # For pull_request_review events (when a review is submitted)
          if [ -n "$REVIEWER" ]; then
            if [ "$REVIEWER" = "$PR_AUTHOR" ] && [ "$REVIEW_STATE" = "APPROVED" ]; then
              echo "Error: PR author '$PR_AUTHOR' cannot approve their own pull request"
              echo "Please request a review from a different team member."
              exit 1
            fi
          fi
          echo "Review check passed"

      - name: Enforce review requirement
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # This is a non-blocking informational check for now.
          # Branch protection rules will enforce the actual requirement.
          echo "This PR requires approval from a reviewer other than the author."
          echo "Approvals from @${{ github.event.pull_request.user.login }} will be rejected."
          echo ""
          echo "For review guidelines, see: CONTRIBUTING.md#code-review-guidelines"

      - name: Report status
        if: always()
        run: |
          echo "Self-merge block status: OK"
          echo "Self-approval will be rejected by branch protection rules."
