name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Dispatcher: try self-hosted first, fall back to cloud ──────────────────
  pick-runner:
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online - routing locally"
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No self-hosted runner - using GitHub-hosted"
          fi

  build:
    if: github.repository == 'D-sorganization/AffineDrift'
    runs-on: self-hosted
    needs: pick-runner
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify Quarto Render Coverage
        run: python3 scripts/check_quarto_render_coverage.py

      - name: Verify CSS Budget
        run: python3 scripts/check_styles_budget.py

      - name: Verify UI/UX Anti-Pattern Budget
        run: python3 scripts/check_ui_ux_budget.py

      - name: Verify Python Dependency Boundaries
        run: python3 scripts/check_dependency_boundaries.py

      - name: Verify JavaScript Dependency Boundaries
        run: python3 scripts/check_js_dependency_boundaries.py

      - name: Verify CSS Architecture Boundaries
        run: python3 scripts/check_css_architecture.py

      - name: Verify Contract Coverage
        run: python3 scripts/check_contract_coverage.py

      - name: Verify Module Size Budget
        run: python3 scripts/check_module_size_budget.py

      - name: Verify Technical Debt Budget
        run: python3 scripts/check_tech_debt_budget.py

      - name: Pre-build Link Check
        run: python3 -m src.tools.check_links

      - name: Update Service Worker Cache Version
        run: python3 scripts/update_sw_cache_version.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.6.39"

      - name: Remove .env.example
        run: rm -f .env.example
        # Quarto's dotenv validation requires all variables in .env.example to be
        # non-empty. Since we don't need this file during build, just remove it.

      - name: Render Website
        uses: quarto-dev/quarto-actions/render@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          to: html

      - name: Verify frontend asset sync
        # docs/css/ and docs/js/ are populated by Quarto render above.
        # Running --check here validates that canonical sources match their
        # generated mirrors — any genuine drift will correctly fail the build.
        run: python3 scripts/sync_frontend_assets.py --check

      - name: Post-build Health Check
        run: python3 -m src.tools.check_site_health --fail-on broken

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.repository == 'D-sorganization/AffineDrift'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: self-hosted
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify Deployment
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 15
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $URL"
          for i in {1..5}; do
            if curl -f -I -s "$URL"; then
              echo "Deployment verified!"
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 10s..."
            sleep 10
          done
          echo "Deployment verification failed."
          exit 1
