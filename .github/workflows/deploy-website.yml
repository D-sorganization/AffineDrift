name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify frontend asset sync
        run: python3 scripts/sync_frontend_assets.py --check

      - name: Verify Quarto Render Coverage
        run: python3 scripts/check_quarto_render_coverage.py

      - name: Verify CSS Budget
        run: python3 scripts/check_styles_budget.py

      - name: Verify UI/UX Anti-Pattern Budget
        run: python3 scripts/check_ui_ux_budget.py

      - name: Verify Python Dependency Boundaries
        run: python3 scripts/check_dependency_boundaries.py

      - name: Verify JavaScript Dependency Boundaries
        run: python3 scripts/check_js_dependency_boundaries.py

      - name: Verify Module Size Budget
        run: python3 scripts/check_module_size_budget.py

      - name: Verify Technical Debt Budget
        run: python3 scripts/check_tech_debt_budget.py

      - name: Pre-build Link Check
        run: python src/tools/check_links.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.39"

      - name: Remove .env.example
        run: rm -f .env.example
        # Quarto's dotenv validation requires all variables in .env.example to be
        # non-empty. Since we don't need this file during build, just remove it.

      - name: Render Website
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Post-build Health Check
        run: python src/tools/check_site_health.py --fail-on broken

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Deployment
        run: |
          echo "Waiting for deployment to propagate..."
          sleep 15
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $URL"
          for i in {1..5}; do
            if curl -f -I -s "$URL"; then
              echo "Deployment verified!"
              exit 0
            fi
            echo "Attempt $i failed. Retrying in 10s..."
            sleep 10
          done
          echo "Deployment verification failed."
          exit 1
