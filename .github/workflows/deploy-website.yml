name: Deploy Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PUBLIC_SITE_URL: "https://affinedrift.com"

jobs:
  # ── Dispatcher: enforce local-only routing (NO GitHub-hosted runners) ──────
  pick-runner:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Enforce local-only runner routing
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          echo "Enforcing local-only runner routing (d-sorg-fleet)"

  build:
    timeout-minutes: 60
    if: github.repository == 'D-sorganization/AffineDrift'
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    needs: pick-runner
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/deploy-venv"
          source "$RUNNER_TEMP/deploy-venv/bin/activate"
          python -m pip install --upgrade pip setuptools
          python -m pip install -r requirements.txt
          echo "$RUNNER_TEMP/deploy-venv/bin" >> "$GITHUB_PATH"

      - name: Install browser verification dependencies
        run: |
          npm ci
          if sudo -n true 2>/dev/null; then
            npx playwright install --with-deps chromium || npx playwright install chromium
          else
            npx playwright install chromium
          fi

      - name: Verify Quarto Render Coverage
        run: python3 scripts/check_quarto_render_coverage.py

      - name: Verify Website Title Capitalization
        run: python3 scripts/check_title_case.py

      - name: Verify CSS Budget
        run: python3 scripts/check_styles_budget.py

      - name: Verify Optimized Image Derivatives
        run: |
          python3 scripts/optimize_images.py --check

      - name: Verify Image Budget
        run: python3 scripts/check_image_budget.py

      - name: Verify UI/UX Anti-Pattern Budget
        run: python3 scripts/check_ui_ux_budget.py

      - name: Verify Python Dependency Boundaries
        run: python3 scripts/check_dependency_boundaries.py

      - name: Verify JavaScript Dependency Boundaries
        run: python3 scripts/check_js_dependency_boundaries.py

      - name: Verify CSS Architecture Boundaries
        run: python3 scripts/check_css_architecture.py

      - name: Verify Contract Coverage
        run: python3 scripts/check_contract_coverage.py

      - name: Verify Module Size Budget
        run: python3 scripts/check_module_size_budget.py

      - name: Verify Technical Debt Budget
        run: python3 scripts/check_tech_debt_budget.py

      - name: Pre-build Link Check
        run: python3 -m src.tools.check_links

      - name: Update Service Worker Cache Version
        run: python3 scripts/update_sw_cache_version.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.8.26"

      - name: Remove .env.example
        run: rm -f .env.example
        # Quarto's dotenv validation requires all variables in .env.example to be
        # non-empty. Since we don't need this file during build, just remove it.

      - name: Render Website
        uses: quarto-dev/quarto-actions/render@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          to: html

      - name: Generate sitemap.xml
        run: python3 scripts/generate_sitemap.py --output docs/sitemap.xml

      - name: Generate RSS feed.xml
        run: python3 scripts/generate_feed.py --output docs/feed.xml

      - name: Bundle CSS (flatten @import waterfall)
        # Flattens the canonical css/ @import graph into a single render-blocking
        # docs/styles.css bundle, then validates docs/css/ mirrors match css/.
        run: python3 scripts/bundle_css.py

      - name: Verify frontend asset sync
        # docs/css/ and docs/js/ are populated by Quarto render above.
        # Running --check here validates that canonical sources match their
        # generated mirrors — any genuine drift will correctly fail the build.
        run: python3 scripts/sync_frontend_assets.py --check

      - name: Minify deploy frontend assets
        # Keep canonical css/ and js/ files readable; shrink only the rendered
        # docs/ artifact uploaded to GitHub Pages.
        run: python3 scripts/minify_deploy_assets.py

      - name: Post-build Health Check
        run: python3 -m src.tools.check_site_health --fail-on broken

      - name: Prune internal markdown files from deploy artifact
        run: python3 scripts/prune_internal_docs_from_deploy.py --docs-dir docs

      - name: Generate revision-bound public site manifest
        run: |
          python3 scripts/public_site_manifest.py \
            --docs-dir docs \
            --source-root . \
            --source-revision "$GITHUB_SHA" \
            --output docs/public-site-manifest.json

      - name: Verify every rendered public page
        run: |
          python3 -m http.server 8000 --directory docs > "$RUNNER_TEMP/affinedrift-site.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node scripts/verify-public-site.js \
            --base-url http://127.0.0.1:8000 \
            --manifest docs/public-site-manifest.json \
            --output artifacts/public-site-verification/local-every-page.json
          node scripts/verify-public-site.js \
            --base-url http://127.0.0.1:8000 \
            --manifest docs/public-site-manifest.json \
            --output artifacts/public-site-verification/local-representative.json \
            --screenshot-dir artifacts/public-site-verification/screenshots \
            --screenshots \
            --viewports tablet,desktop-small,desktop-medium,desktop-wide \
            --themes light,dark \
            --routes /,/articles/affine-nature-golf-swing.html,/articles/proximal_distal_energy_transfer/index.html,/articles/The_Physics_of_Golf/quarto/index.html,/books/index.html,/resources/resources.html,/models/models.html,/offline.html

      - name: Upload pre-deployment public site evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-site-verification-${{ github.sha }}
          path: artifacts/public-site-verification/
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

  deploy:
    timeout-minutes: 30
    if: github.repository == 'D-sorganization/AffineDrift'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    needs: build
    steps:
      - name: Checkout verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install live verification dependencies
        run: |
          npm ci
          if sudo -n true 2>/dev/null; then
            npx playwright install --with-deps chromium || npx playwright install chromium
          else
            npx playwright install chromium
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Verify Deployment Manifest and Every Public Page
        run: |
          mkdir -p artifacts/public-site-verification
          LIVE_MANIFEST="$RUNNER_TEMP/public-site-manifest.json"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              "$PUBLIC_SITE_URL/public-site-manifest.json?revision=$GITHUB_SHA" \
              --output "$LIVE_MANIFEST"; then
              if SOURCE_REVISION=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_revision"])' "$LIVE_MANIFEST" 2>/dev/null); then
                if [ "$SOURCE_REVISION" = "$GITHUB_SHA" ]; then
                  echo "Live manifest matches deployment revision $GITHUB_SHA."
                  break
                fi
              fi
            fi
            if [ "$attempt" = "12" ]; then
              echo "Live manifest did not reach deployment revision $GITHUB_SHA."
              exit 1
            fi
            echo "Deployment revision is not live yet; retrying in 10 seconds."
            sleep 10
          done
          node scripts/verify-public-site.js \
            --base-url "$PUBLIC_SITE_URL" \
            --manifest "$LIVE_MANIFEST" \
            --output artifacts/public-site-verification/live-every-page.json

      - name: Upload live public site evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-public-site-verification-${{ github.sha }}
          path: artifacts/public-site-verification/
          retention-days: 30
