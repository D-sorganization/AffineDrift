name: Performance Benchmarks

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comparison with main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Run benchmarks and compare with baseline
        id: benchmark
        run: |
          # Run benchmarks and compare against the initial baseline
          # Warn on >5% regression, fail on >15% regression
          python -m pytest benchmarks/ \
            --benchmark-only \
            --benchmark-compare=initial \
            --benchmark-compare-fail=mean:15% \
            -v \
            --tb=short 2>&1 | tee benchmark_output.txt

      - name: Check for regressions (warn on >5%)
        if: always()
        run: |
          # Count regressions >5% (but <15%)
          WARN_THRESHOLD=1.05
          FAIL_THRESHOLD=1.15

          REGRESSIONS=$(grep -c "^SLOWER" benchmark_output.txt || echo "0")

          if [ "$REGRESSIONS" -gt 0 ]; then
            echo "⚠️  Found $REGRESSIONS performance regressions (>5%)"
            grep "^SLOWER" benchmark_output.txt || true
          fi

      - name: Parse benchmark results for PR comment
        if: github.event_name == 'pull_request'
        id: parse_results
        run: |
          # Extract key metrics from benchmark output
          if grep -q "passed" benchmark_output.txt; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "summary=✅ All benchmarks passed" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "summary=❌ Benchmark run failed" >> $GITHUB_OUTPUT
          fi

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('benchmark_output.txt', 'utf8');

            // Extract summary lines
            const lines = output.split('\n');
            const summaryStart = lines.findIndex(l => l.includes('benchmark'));
            const summaryLines = lines.slice(Math.max(0, summaryStart - 5)).slice(0, 30);

            const comment = `## Performance Benchmarks

            **Status:** ${{ steps.parse_results.outputs.summary }}

            ### Results Summary
            \`\`\`
            ${summaryLines.join('\n')}
            \`\`\`

            ### Guidelines
            - ✅ **Pass**: < 5% regression
            - ⚠️ **Warn**: 5-15% regression
            - ❌ **Fail**: > 15% regression

            For detailed results, see the workflow run.

            [View Benchmarks Guide](../../docs/benchmarking.md)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-results
          path: |
            benchmark_output.txt
            .benchmarks/

      - name: Fail if regressions exceed 15%
        if: failure()
        run: |
          echo "❌ Performance regressions exceeded 15% threshold"
          exit 1

  summary:
    name: Benchmark Summary
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.benchmark.result }}" = "success" ]; then
            echo "✅ Benchmarks passed all thresholds"
            exit 0
          else
            echo "⚠️ Benchmarks completed with warnings or failures"
            exit 0
          fi
