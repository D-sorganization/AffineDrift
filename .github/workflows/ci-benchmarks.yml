name: Performance Benchmarks

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-benchmarks-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  benchmark:
    name: Run Performance Benchmarks
    runs-on: d-sorg-fleet
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # Full history for comparison with main

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        timeout-minutes: 20
        env:
          PIP_DEFAULT_TIMEOUT: "60"
        run: |
          python -m venv "$RUNNER_TEMP/benchmark-venv"
          source "$RUNNER_TEMP/benchmark-venv/bin/activate"
          python -m pip install --upgrade pip setuptools
          python -m pip install --no-cache-dir -r requirements-benchmarks.txt
          echo "$RUNNER_TEMP/benchmark-venv/bin" >> "$GITHUB_PATH"

      - name: Run benchmarks and compare with baseline
        id: benchmark
        run: |
          # Run benchmarks and compare against the initial baseline
          # Warn on >5% regression, fail on >15% regression
          python -m pytest benchmarks/ \
            --benchmark-only \
            --benchmark-compare=initial \
            --benchmark-compare-fail=mean:15% \
            -v \
            --tb=short 2>&1 | tee benchmark_output.txt

      - name: Check for regressions (warn on >5%)
        if: always()
        run: |
          # Count regressions >5% (but <15%)
          WARN_THRESHOLD=1.05
          FAIL_THRESHOLD=1.15

          if [ ! -f benchmark_output.txt ]; then
            echo "benchmark_output.txt was not created; benchmark command did not run."
            exit 0
          fi

          REGRESSIONS=$(grep -c "^SLOWER" benchmark_output.txt || echo "0")

          if [ "$REGRESSIONS" -gt 0 ]; then
            echo "⚠️  Found $REGRESSIONS performance regressions (>5%)"
            grep "^SLOWER" benchmark_output.txt || true
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            benchmark_output.txt
            .benchmarks/
          if-no-files-found: warn

      - name: Fail if regressions exceed 15%
        if: steps.benchmark.outcome == 'failure'
        run: |
          echo "Performance benchmark command failed or exceeded the configured threshold."
          exit 1

  comment:
    name: Comment on PR with results
    needs: benchmark
    # Only this job — which never checks out or executes PR-controlled code —
    # is granted pull-requests:write, so the token that runs the benchmark
    # suite cannot post forged CI comments or mutate PR labels/state.
    if: ${{ github.event_name == 'pull_request' && always() }}
    runs-on: d-sorg-fleet
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: benchmark-results
          path: benchmark-results
        continue-on-error: true

      - name: Comment on PR with results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = 'benchmark-results/benchmark_output.txt';
            const output = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'benchmark_output.txt was not created; inspect install and benchmark steps.';

            const status = output.includes('passed')
              ? 'All benchmarks passed'
              : 'Benchmark run failed or did not complete';

            // Extract summary lines
            const lines = output.split('\n');
            const summaryStart = lines.findIndex(l => l.includes('benchmark'));
            const summaryLines = lines.slice(Math.max(0, summaryStart - 5)).slice(0, 30);

            const comment = `## Performance Benchmarks

            **Status:** ${status}

            ### Results Summary
            \`\`\`
            ${summaryLines.join('\n')}
            \`\`\`

            ### Guidelines
            - ✅ **Pass**: < 5% regression
            - ⚠️ **Warn**: 5-15% regression
            - ❌ **Fail**: > 15% regression

            For detailed results, see the workflow run.

            [View Benchmarks Guide](../../docs/benchmarking.md)
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  summary:
    timeout-minutes: 90
    name: Benchmark Summary
    needs: benchmark
    if: always()
    runs-on: d-sorg-fleet
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.benchmark.result }}" = "success" ]; then
            echo "✅ Benchmarks passed all thresholds"
            exit 0
          else
            echo "⚠️ Benchmarks completed with warnings or failures"
            exit 0
          fi
