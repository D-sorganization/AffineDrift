name: LaTeX Release Volumes

on:
  push:
    branches: [main]
    paths:
      - "articles/The_Geometry_of_Motion/Volume_*/**"
      - ".github/workflows/latex-release-volumes.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "articles/The_Geometry_of_Motion/Volume_*/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile-and-release:
    if: github.repository == 'D-sorganization/AffineDrift'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compile Volume 0
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_0
          pre_compile: "rm -f *.aux chapters/*.aux"

      - name: Compile Volume I
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_I
          pre_compile: "rm -f *.aux chapters/*.aux"

      - name: Compile Volume II
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_II
          pre_compile: "rm -f *.aux chapters/*.aux"

      - name: Compile Volume III
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_III
          pre_compile: "rm -f *.aux chapters/*.aux"

      - name: Compile Volume IV
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_IV
          pre_compile: "rm -f *.aux chapters/*.aux"

      - name: Compile Volume V
        uses: xu-cheng/latex-action@6549dc21effb2730855a1281407ecfcececc6c1b # v4
        with:
          root_file: main.tex
          working_directory: articles/The_Geometry_of_Motion/Volume_V
          pre_compile: "rm -f *.aux chapters/*.aux"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: geometry-of-motion-pdfs
          path: |
            articles/The_Geometry_of_Motion/Volume_0/main.pdf
            articles/The_Geometry_of_Motion/Volume_I/main.pdf
            articles/The_Geometry_of_Motion/Volume_II/main.pdf
            articles/The_Geometry_of_Motion/Volume_III/main.pdf
            articles/The_Geometry_of_Motion/Volume_IV/main.pdf
            articles/The_Geometry_of_Motion/Volume_V/main.pdf

      - name: Publish release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG_NAME="textbook-pdfs-latest"
          gh release view "$TAG_NAME" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" \
              --title "Textbook PDFs (Latest)" \
              --notes "Automated latest PDFs for The Geometry of Motion — all volumes."
          for vol in Volume_0 Volume_I Volume_II Volume_III Volume_IV Volume_V; do
            pdf="articles/The_Geometry_of_Motion/${vol}/main.pdf"
            if [ -f "$pdf" ]; then
              gh release upload "$TAG_NAME" "${pdf}#${vol}_main.pdf" --clobber
            fi
          done
