name: CI Standard
# Refreshed to verify path resolution
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # NOTE: **.md intentionally NOT excluded so quality-gate runs on docs-only
    # PRs and satisfies branch protection required status checks.
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: enforce local-only routing (NO GitHub-hosted runners) ──────
  pick-runner:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Select runner
        id: check
        env:
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
          RUNNER_TARGET: ${{ vars.RUNNER_TARGET }}
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          if [ "$REPO_VISIBILITY" != "public" ]; then
            # Hosted runners are billed on a non-public repo, so routing is not a
            # preference here and RUNNER_TARGET deliberately does not apply.
            RUNNER=d-sorg-fleet
            WHY="repository is '${REPO_VISIBILITY:-unknown}'; hosted runners are metered"
          elif [ "$RUNNER_TARGET" = "local" ]; then
            RUNNER=d-sorg-fleet
            WHY="repository is public but RUNNER_TARGET=local"
          else
            RUNNER=ubuntu-latest
            WHY="repository is public; hosted runners are free and keep fork PRs off the fleet"
          fi
          echo "runner=$RUNNER" >> "$GITHUB_OUTPUT"
          echo "Routing to $RUNNER ($WHY)."
  quality-gate:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Bootstrap Python venv
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          source "$RUNNER_TEMP/ci-venv/bin/activate"
          python -m pip install PyYAML==6.0.3 beautifulsoup4==4.14.3 requests==2.33.1 Markdown==3.10.2 pydantic==2.13.3 simpleeval==1.0.7 numpy==2.4.4 matplotlib==3.10.9 defusedxml==0.7.1
          echo "$RUNNER_TEMP/ci-venv/bin" >> $GITHUB_PATH

      - name: Reject Raw Merge Conflict Markers
        run: |
          MARKER="<<<<<<< HEAD"
          if grep -rne "$MARKER" . --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::Raw git merge conflict markers found!"
            exit 1
          fi

      - name: Install System Dependencies
        run: |
          if sudo -n true 2>/dev/null; then
            APT_READY=false
            for attempt in 1 2 3; do
              if sudo apt-get -o DPkg::Lock::Timeout=300 update; then
                APT_READY=true
                break
              fi
              sleep 20
            done
            if [ "$APT_READY" = "true" ]; then
              # libasound2t64 is the Ubuntu 24.04 name; Ubuntu 22.04 uses libasound2
              apt-cache show libasound2t64 >/dev/null 2>&1 && LIBASOUND=libasound2t64 || LIBASOUND=libasound2
              sudo apt-get -o DPkg::Lock::Timeout=300 install -y libgl1 libegl1 libxrandr2 libxss1 libxcursor1 libxcomposite1 "$LIBASOUND" libxi6 libxtst6
            else
              echo "::warning::apt-get update could not acquire the package lock; continuing with existing system dependencies"
            fi
          else
            echo "No passwordless sudo — assuming system deps are pre-installed (self-hosted runner)"
          fi

      - run: pip install ruff==0.15.6 black==26.3.1 mypy==1.19.1 bandit==1.7.7 pydocstyle==6.3.0

      # Validate that environment is sane
      - name: Environment Health Check
        run: |
          python3 --version
          pip --version
          ruff --version
          black --version
          mypy --version

      # FIX: Less aggressive Ruff (Errors, Warnings, Imports only)
      - name: Lint
        run: ruff check .

      # FIX: Enforce Black formatting (100 chars — matches pyproject.toml [tool.black] line-length)
      - name: Check Formatting
        run: black --check --line-length 100 .

      - run: pip install mypy types-PyYAML types-requests
      - name: Verify frontend asset sync
        # docs/ HTML is no longer committed (issue #1419); sync mirrors inside docs/
        # are rebuilt by Quarto at deploy time. Skip here if docs/ is absent.
        run: |
          if [ -d "docs" ] && [ -f "docs/index.html" ]; then
            python3 scripts/sync_frontend_assets.py --check
          else
            echo "docs/ not present (expected: built by deploy workflow). Skipping frontend asset sync."
          fi
      - name: Verify Quarto Render Coverage
        run: python3 scripts/check_quarto_render_coverage.py
      - name: Verify Quarto Math Syntax
        # scan_quarto_syntax.py existed but was wired into nothing, so none of its
        # checks had ever run in CI. The corpus was brought to zero findings before
        # this step was added, which is what makes running it viable. It catches the
        # class of defect that renders wrong rather than failing: math that Pandoc
        # silently declines to parse, which the site then prints as literal dollars.
        run: python3 scripts/scan_quarto_syntax.py
      - name: Verify Quarto Cross-References Resolve
        # An unresolved @sec- reference does not fail the render. Quarto exits 0
        # and the page ships with the raw key printed where the link should be:
        # "In the worked example (?sec-ch11:worked), suppose...". The book had
        # 132 of these. Same shape as the math check above -- valid input,
        # silently wrong output, exit 0 -- so reading the source is the only way
        # to catch it before the site does.
        run: python3 scripts/check_quarto_xrefs.py
      - name: Verify Each Page Renders One Title
        # Two failures that look like nothing in the source. A YAML 'title:'
        # beside a body H1 renders the title twice, separately numbered, which
        # inflates every chapter number after it -- shipped in #3700 and again
        # in #3705. A blank line after the opening '---' stops Pandoc reading
        # the block as frontmatter at all, so the keys print as page content;
        # ch01 shipped its 'description:' line as a chapter heading that way.
        # Neither is caught by the frontmatter validator, the cross-reference
        # checker, the maths scanner, or 'quarto render', which exits 0.
        run: python3 scripts/check_single_title.py
      - name: Verify Website Title Capitalization
        # Titles are presentation-critical content: navigation labels, page and
        # section headings, figure captions, and chart titles must use the same
        # APA-style capitalization before a change can merge.
        run: python3 scripts/check_title_case.py
      - name: Verify Display Maths Is Delimited
        # An equation with no '$$' is read as a paragraph: Pandoc consumes each
        # \command as unknown markup and keeps the punctuation, so ch08 shipped
        # "The equations of motion ... are: () + (, ) + () =" with the equation
        # replaced by punctuation, and zero MathJax blocks on the page. The
        # maths scanner cannot see it -- it checks that $...$ spans parse, and
        # there is nothing here to parse -- and an equation with no delimiters
        # cannot carry an {#eq-} label, so the cross-reference gate sees nothing
        # unresolved either.
        run: python3 scripts/check_display_math.py
      - name: Verify No LaTeX Quotation Marks In Prose
        # LaTeX quotes as ``opening'' and TeX curls it; markdown does not, so
        # the .tex -> .qmd conversions shipped the raw marks: the Geometry of
        # Motion mirror rendered ``best linear approximation'' as two literal
        # backticks and two right-quotes. Only pairs are reported -- a lone ''
        # is a double prime, and \phi_i'''' is a fourth derivative.
        run: python3 scripts/check_latex_quotes.py
      - name: Verify No Unrenderable LaTeX Environments
        # Pandoc renders maths environments in a .qmd and drops everything else,
        # silently and exit 0, so the content inside never reaches the page. This
        # was found twice, both times as real content: 79 boxes carrying the
        # Geometry of Motion book's axioms and scope warnings (#3720), and 24
        # tables carrying its numerical evidence (#3722). The allow-list is
        # maths-only on purpose -- an earlier probe assumed `table` and `itemize`
        # were safe because they are ordinary LaTeX, and 24 tables stayed missing
        # for another round.
        run: python3 scripts/check_latex_environments.py
      - name: Verify Acronym Terminology Is Consistent
        # NOTATION.md is the single source of truth for DCR and ZTCF. Fails on any
        # reintroduced variant expansion or the dangling cross-reference that made
        # the acronyms mean five different things each (#3526).
        run: |
          python3 scripts/check_terminology.py \
            --baseline config/terminology-baseline.json
      - name: Verify Generated Worked Examples Are Fresh
        # Textbook worked examples that carry numbers are solved by code and
        # written as LaTeX fragments the chapters \input. Fails if a committed
        # fragment no longer matches the generator, so a number cannot be edited
        # into the book by hand without the code agreeing (#3518).
        run: python3 scripts/generate_worked_examples.py --check
      - name: Verify LaTeX/Quarto Tree Parity
        # Both textbooks exist twice and are maintained by hand. Fails only on
        # divergences absent from the baseline, so the trees cannot drift further
        # apart while the known ones are reconciled under #3499.
        run: |
          python3 scripts/check_tree_parity.py \
            --baseline config/tree-parity-baseline.json
      - name: Verify LaTeX Structural Integrity
        # Fails only on findings absent from the baseline, so the textbook corpus
        # cannot get worse while the known defects under epic #3491 are worked off.
        # Shrink config/latex-structure-baseline.json as those issues close.
        run: |
          python3 scripts/check_latex_structure.py \
            --root articles \
            --baseline config/latex-structure-baseline.json
      - name: Validate Article Frontmatter
        run: python3 scripts/validate_frontmatter.py
      - name: Verify CSS Budget
        run: python3 scripts/check_styles_budget.py
      - name: Verify UI/UX Anti-Pattern Budget
        run: python3 scripts/check_ui_ux_budget.py
      - name: Verify Python Dependency Boundaries
        run: python3 scripts/check_dependency_boundaries.py
      - name: Verify JavaScript Dependency Boundaries
        run: python3 scripts/check_js_dependency_boundaries.py
      - name: Verify CSS Architecture Boundaries
        run: python3 scripts/check_css_architecture.py
      - name: Verify Contract Coverage
        run: python3 scripts/check_contract_coverage.py
      - name: Verify Module Size Budget
        run: python3 scripts/check_module_size_budget.py
      - name: Verify Changed-File Module Size Budget
        run: python3 scripts/check_changed_file_size_budget.py
      - name: Verify Technical Debt Budget
        run: python3 scripts/check_tech_debt_budget.py
      - name: Verify generated agent automation artifacts
        run: python3 scripts/check_agent_automation_artifacts.py
      - name: Verify GitHub Actions pinning
        run: python3 scripts/check_workflow_action_pins.py
      - name: Security Input Sanitization Audit (SEC-001)
        run: python3 scripts/check_security_audit.py
      - name: Verify DRY Shared-Helper Adoption
        run: python3 scripts/check_dry_adoption.py
      - name: Verify Bibliography Quality
        run: python3 scripts/check_bibliography_quality.py
      - name: Verify A Citation Key Means One Paper
        # The site renders against several .bib files at once, so a key defined
        # differently in two of them resolves to whichever is listed first --
        # the citation silently depends on render order rather than on anything
        # an author wrote. Four keys were in that state (#3686, #3690, #3691),
        # two of them multi-part series flattened into a single entry and two
        # entries for papers that do not exist as recorded. Offline and instant;
        # correctness against CrossRef is check_bibliography_metadata.py's job.
        run: python3 scripts/check_bibliography_cross_file.py
      - name: Verify Citation Resolution
        run: python3 scripts/check_citation_resolution.py
      - name: Verify Quarto Citation Integrity
        run: python3 scripts/check_qmd_citation_keys.py
      - name: Install Tool Requirements
        run: |
          if [ -d "tools" ]; then
            find tools -name "requirements.txt" -exec python -m pip install -r {} \;
          fi
      - run: mypy src/tools/ scripts/check_agent_automation_artifacts.py scripts/check_workflow_action_pins.py --ignore-missing-imports --allow-untyped-decorators --disable-error-code no-any-unimported --disable-error-code misc --disable-error-code unused-ignore --disable-error-code no-any-return
      - name: Verify Code Quality
        run: python3 -m src.tools.code_quality_check

      - name: Verify Site Health (Broken Links Blocking)
        # docs/ HTML is no longer committed (issue #1419); site health runs in
        # deploy-website.yml after Quarto renders the site. This step will always
        # skip in ci-standard.yml because docs/index.html is never present here —
        # that is intentional and expected. The check runs post-deploy instead.
        run: |
          if [ -f "docs/index.html" ]; then
            python3 -m src.tools.check_site_health --fail-on broken
          else
            echo "docs/ HTML not present (expected: built by deploy workflow). Skipping site health check."
          fi

      # FIX: Run Python-based MATLAB Quality Check (Works without License)
      # Non-blocking: Script not present in all repos
      - name: MATLAB Quality Check
        continue-on-error: true
        run: |
          if [ -f "src/tools/matlab_utilities/scripts/matlab_quality_check.py" ]; then
            python3 src/tools/matlab_utilities/scripts/matlab_quality_check.py --output-format text > matlab_quality_report.txt
            cat matlab_quality_report.txt
          else
            echo "MATLAB quality check script not found, skipping..."
          fi

      - name: Upload MATLAB Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: matlab-quality-report
          path: matlab_quality_report.txt

  tests:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 45
    env:
      BASELINE_TEST_COUNT: 2282
      # The Qt tests import PyQt6, which needs a platform plugin. There is no
      # display on a CI runner, so render to memory instead of failing.
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt system libraries
        # pip installs PyQt6's Python bindings but not the shared objects Qt
        # links against. The self-hosted fleet machines are desktops and already
        # carry them; the GitHub-hosted image does not, so importing PyQt6 fails
        # with "libEGL.so.1: cannot open shared object file" and collection
        # aborts before any test runs.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Bootstrap Python venv
        timeout-minutes: 40
        env:
          PIP_DEFAULT_TIMEOUT: "60"
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          source "$RUNNER_TEMP/ci-venv/bin/activate"
          python --version
          pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt pytest-timeout pytest-cov PyQt6
          echo "$RUNNER_TEMP/ci-venv/bin" >> $GITHUB_PATH
      - name: Install Tool Requirements
        run: |
          if [ -d "tools" ]; then
            find tools -name "requirements.txt" -exec python -m pip install -r {} \;
          fi
      - name: Test count regression guard
        env:
          PYTHONPATH: src
        run: |
          COUNT=$(python -m pytest tests/ --collect-only -q --override-ini="addopts=" 2>&1 | tail -3 | grep -oE "[0-9]+ tests collected" | grep -oE "^[0-9]+" | head -1)
          echo "Collected $COUNT tests; baseline is ${{ env.BASELINE_TEST_COUNT }}"
          [ "$COUNT" -ge "${{ env.BASELINE_TEST_COUNT }}" ] || (echo "::error::Test count $COUNT < baseline ${{ env.BASELINE_TEST_COUNT }}"; exit 1)
      - name: Run Tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ --cov=src --cov-report=xml --cov-fail-under=65 --timeout=120
      - name: Run Content Lint Tests
        env:
          PYTHONPATH: src
        run: python -m pytest --override-ini addopts= tests/ -m content_lint --timeout=120
      - name: Audit Python Dependencies
        timeout-minutes: 5
        run: pip install pip-audit && pip-audit -r requirements.txt --progress-spinner=off
      - name: Critical Module Coverage Gate
        run: python3 scripts/check_critical_module_coverage.py
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: false # Non-blocking: CODECOV_TOKEN may not be configured in all forks
          token: ${{ secrets.CODECOV_TOKEN }}

  js-tests:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Dependencies
        run: npm ci
      - name: Run JS Tests
        run: npm test -- --coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect E2E-relevant changes
        id: e2e_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          if changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD"); then
            :
          else
            echo "No merge base found for origin/${{ github.base_ref }}...HEAD; falling back to HEAD^..HEAD."
            changed_files=$(git diff --name-only "HEAD^..HEAD")
          fi
          relevant_files=$(printf "%s\n" "$changed_files" | grep -E '(^_quarto\.yml$|^package(-lock)?\.json$|^playwright\.config\.|^tests/e2e/|^scripts/sync_frontend_assets\.py$|^scripts/update_sw_cache_version\.py$|^styles\.css$|^js/|^src/js/|^pages/|^posts/|^resources/|^books/|^docs/.*\.(html|css|js|qmd)$|\.qmd$)' || true)

          if [ -z "$relevant_files" ]; then
            echo "No site-facing files changed; skipping E2E site render."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "E2E-relevant files changed:"
            printf "%s\n" "$relevant_files"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.e2e_changes.outputs.run == 'true'
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.e2e_changes.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Bootstrap Python venv
        if: steps.e2e_changes.outputs.run == 'true'
        timeout-minutes: 40
        env:
          PIP_DEFAULT_TIMEOUT: "60"
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          source "$RUNNER_TEMP/ci-venv/bin/activate"
          pip install --upgrade pip setuptools wheel
          pip install --no-cache-dir -r requirements.txt
          echo "$RUNNER_TEMP/ci-venv/bin" >> $GITHUB_PATH

      - name: Reject Raw Merge Conflict Markers
        run: |
          MARKER="<<<<<<< HEAD"
          if grep -rne "$MARKER" . --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::Raw git merge conflict markers found!"
            exit 1
          fi

      - name: Install System Dependencies
        if: steps.e2e_changes.outputs.run == 'true'
        run: |
          if sudo -n true 2>/dev/null; then
            APT_READY=false
            for attempt in 1 2 3; do
              if sudo apt-get -o DPkg::Lock::Timeout=300 update; then
                APT_READY=true
                break
              fi
              sleep 20
            done
            if [ "$APT_READY" = "true" ]; then
              # libasound2t64 is the Ubuntu 24.04 name; Ubuntu 22.04 uses libasound2
              apt-cache show libasound2t64 >/dev/null 2>&1 && LIBASOUND=libasound2t64 || LIBASOUND=libasound2
              sudo apt-get -o DPkg::Lock::Timeout=300 install -y libgl1 libegl1 libxrandr2 libxss1 libxcursor1 libxcomposite1 "$LIBASOUND" libxi6 libxtst6
            else
              echo "::warning::apt-get update could not acquire the package lock; continuing with existing system dependencies"
            fi
          else
            echo "No passwordless sudo — assuming system deps are pre-installed (self-hosted runner)"
          fi

      - name: Install Dependencies
        if: steps.e2e_changes.outputs.run == 'true'
        run: npm ci
      - name: Install Playwright Browsers
        if: steps.e2e_changes.outputs.run == 'true'
        run: |
          if sudo -n true 2>/dev/null; then
            npx playwright install --with-deps chromium || {
              echo "::warning::Playwright system dependency install failed; retrying browser-only install"
              npx playwright install chromium
            }
          else
            echo "No passwordless sudo — installing browser binaries only."
            npx playwright install chromium
          fi

      - name: Set up Quarto
        if: steps.e2e_changes.outputs.run == 'true'
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.8.26"
      - name: Remove .env.example
        if: steps.e2e_changes.outputs.run == 'true'
        run: rm -f .env.example
        # Quarto's dotenv validation requires non-empty example values, but CI
        # doesn't need the example file during the E2E render.
      - name: Build site for E2E
        if: steps.e2e_changes.outputs.run == 'true'
        run: |
          quarto render index.qmd --to html
          quarto render resources/articles.qmd --to html
          quarto render resources/bibliography.qmd --to html
          quarto render pages/overview.qmd --to html
          quarto render pages/about.qmd --to html
          quarto render resources/resources-books.qmd --to html
          quarto render models/models.qmd --to html
      - name: Sync Frontend Assets
        if: steps.e2e_changes.outputs.run == 'true'
        run: python3 scripts/sync_frontend_assets.py

      - name: Run E2E Smoke Tests (Critical Flows)
        if: steps.e2e_changes.outputs.run == 'true'
        run: |
          npx playwright test \
            --project=chromium \
            --retries=0 \
            tests/e2e/smoke.spec.js
      - name: Run Visual Layout Invariants (no-overflow / column collapse)
        # Runs the deterministic layout assertions from visual.spec.js (issue
        # #3328) — these need no committed image baselines and fail the build on
        # horizontal overflow or a broken responsive layout. The pixel-snapshot
        # tests in the same file are excluded here (they require platform
        # baselines generated via `playwright test --update-snapshots`).
        if: steps.e2e_changes.outputs.run == 'true'
        run: |
          npx playwright test \
            --project=chromium \
            --retries=0 \
            --grep "no horizontal overflow|single column" \
            tests/e2e/visual.spec.js
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.e2e_changes.outputs.run == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  website-lint:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install & Lint
        run: |
          npm ci
          npm run lint:css
          npm run lint:html

