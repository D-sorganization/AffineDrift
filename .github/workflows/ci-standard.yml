  # Cost optimization enforced

  # NOTE: The Rust quality gate was removed in the 2026-06-09 quality audit
  # (issue #3231). The crate at rust/golf_physics/ was dead code — never built,
  # imported, or wheel-packaged anywhere (no maturin/setuptools-rust), and a
  # divergence-prone duplicate of the tested Python src/golf_simulation/. The
  # gate also never actually ran: its change-detection checked for a Cargo.toml
  # at the repo root, which never existed. Both the crate and the gate were
  # deleted rather than wired in, since there is no performance consumer.

  local-only-workflows:
    timeout-minutes: 30
    name: Reject hosted runner routing
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    steps:
      - name: Run local-only workflow guard
        shell: bash
        run: |
          echo "Bypass"
