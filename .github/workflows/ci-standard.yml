name: CI Standard
# Refreshed to verify path resolution
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$AVAILABLE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner available — routing locally"
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No available self-hosted runner — using GitHub-hosted"
          fi
  quality-gate:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install System Dependencies
        run: |
          if sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y libgl1 libegl1 libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2t64 libxi6 libxtst6
          else
            echo "No passwordless sudo — assuming system deps are pre-installed (self-hosted runner)"
          fi

      - run: python -m pip install ruff==0.15.6 black==26.3.1 mypy==1.19.1 bandit==1.7.7 pydocstyle==6.3.0

      # Validate that environment is sane
      - name: Environment Health Check
        run: |
          python3 --version
          python -m pip --version
          ruff --version
          black --version
          mypy --version

      # FIX: Less aggressive Ruff (Errors, Warnings, Imports only)
      - name: Lint
        run: ruff check .

      # FIX: Enforce Black formatting (100 chars — matches pyproject.toml [tool.black] line-length)
      - name: Check Formatting
        run: black --check --line-length 100 .

      - run: python -m pip install mypy types-PyYAML types-requests
      - name: Verify frontend asset sync
        # docs/ HTML is no longer committed (issue #1419); sync mirrors inside docs/
        # are rebuilt by Quarto at deploy time. Skip here if docs/ is absent.
        run: |
          if [ -d "docs" ] && [ -f "docs/index.html" ]; then
            python3 scripts/sync_frontend_assets.py --check
          else
            echo "docs/ not present (expected: built by deploy workflow). Skipping frontend asset sync."
          fi
      - name: Verify Quarto Render Coverage
        run: python3 scripts/check_quarto_render_coverage.py
      - name: Validate Article Frontmatter
        run: python3 scripts/validate_frontmatter.py
      - name: Verify CSS Budget
        run: python3 scripts/check_styles_budget.py
      - name: Verify UI/UX Anti-Pattern Budget
        run: python3 scripts/check_ui_ux_budget.py
      - name: Verify Python Dependency Boundaries
        run: python3 scripts/check_dependency_boundaries.py
      - name: Verify JavaScript Dependency Boundaries
        run: python3 scripts/check_js_dependency_boundaries.py
      - name: Verify CSS Architecture Boundaries
        run: python3 scripts/check_css_architecture.py
      - name: Verify Contract Coverage
        run: python3 scripts/check_contract_coverage.py
      - name: Verify Module Size Budget
        run: python3 scripts/check_module_size_budget.py
      - name: Verify Changed-File Module Size Budget
        run: python3 scripts/check_changed_file_size_budget.py
      - name: Verify Technical Debt Budget
        run: python3 scripts/check_tech_debt_budget.py
      - name: Verify DRY Shared-Helper Adoption
        run: python3 scripts/check_dry_adoption.py
      - name: Verify Bibliography Quality
        run: python3 scripts/check_bibliography_quality.py
      - name: Verify Citation Resolution
        run: python3 scripts/check_citation_resolution.py
      - name: Verify Quarto Citation Integrity
        run: python3 scripts/check_qmd_citation_keys.py
      - name: Install Tool Requirements
        run: |
          if [ -d "tools" ]; then
            find tools -name "requirements.txt" -exec python -m pip install -r {} \;
          fi
      - run: mypy src/tools/ scripts/ --ignore-missing-imports || echo "::warning::Type checking has issues - fix type annotations"
      - name: Verify Code Quality
        run: python3 -m src.tools.code_quality_check

      - name: Verify Site Health (Broken Links Blocking)
        # docs/ HTML is no longer committed (issue #1419); site health runs in
        # deploy-website.yml after Quarto renders the site. This step will always
        # skip in ci-standard.yml because docs/index.html is never present here —
        # that is intentional and expected. The check runs post-deploy instead.
        run: |
          if [ -f "docs/index.html" ]; then
            python3 -m src.tools.check_site_health --fail-on broken
          else
            echo "docs/ HTML not present (expected: built by deploy workflow). Skipping site health check."
          fi

      # FIX: Run Python-based MATLAB Quality Check (Works without License)
      # Non-blocking: Script not present in all repos
      - name: MATLAB Quality Check
        continue-on-error: true
        run: |
          if [ -f "tools/matlab_utilities/scripts/matlab_quality_check.py" ]; then
            python3 tools/matlab_utilities/scripts/matlab_quality_check.py --output-format text > matlab_quality_report.txt
            cat matlab_quality_report.txt
          else
            echo "MATLAB quality check script not found, skipping..."
          fi

      - name: Upload MATLAB Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: matlab-quality-report
          path: matlab_quality_report.txt

  tests:
    needs: [pick-runner, quality-gate]
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt pytest-timeout pytest-cov
      - name: Install Tool Requirements
        run: |
          if [ -d "tools" ]; then
            find tools -name "requirements.txt" -exec python -m pip install -r {} \;
          fi
      - name: Run Tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ --cov=src --cov-report=xml --cov-fail-under=50 --timeout=120
      - name: Run Content Lint Tests
        env:
          PYTHONPATH: src
        run: python -m pytest --override-ini addopts= tests/ -m content_lint --timeout=120
      - name: Audit Python Dependencies
        run: python -m pip install pip-audit && pip-audit -r requirements.txt
      - name: Critical Module Coverage Gate
        run: python3 scripts/check_critical_module_coverage.py
      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: false # Non-blocking: CODECOV_TOKEN may not be configured in all forks
          token: ${{ secrets.CODECOV_TOKEN }}

  js-tests:
    needs: [pick-runner, quality-gate]
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "20" }
      - name: Install Dependencies
        run: npm ci
      - name: Run JS Tests
        run: npm test -- --coverage
      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    needs: [pick-runner, quality-gate]
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect E2E-relevant changes
        id: e2e_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          if changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD"); then
            :
          else
            echo "No merge base found for origin/${{ github.base_ref }}...HEAD; falling back to HEAD^..HEAD."
            changed_files=$(git diff --name-only "HEAD^..HEAD")
          fi
          relevant_files=$(printf "%s\n" "$changed_files" | grep -Ev '^$|^\.github/workflows/ci-standard\.yml$' || true)

          if [ -z "$relevant_files" ]; then
            echo "Only CI workflow plumbing changed; skipping E2E site render."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "E2E-relevant files changed:"
            printf "%s\n" "$relevant_files"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v6
        if: steps.e2e_changes.outputs.run == 'true'
        with: { node-version: "20" }
      - uses: actions/setup-python@v6
        if: steps.e2e_changes.outputs.run == 'true'
        with: { python-version: "3.12" }
      - name: Install Python dependencies
        if: steps.e2e_changes.outputs.run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Install System Dependencies
        if: steps.e2e_changes.outputs.run == 'true'
        run: |
          if sudo -n true 2>/dev/null; then
            sudo apt-get update
            sudo apt-get install -y libgl1 libegl1 libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2t64 libxi6 libxtst6
          else
            echo "No passwordless sudo — assuming system deps are pre-installed (self-hosted runner)"
          fi

      - name: Install Dependencies
        if: steps.e2e_changes.outputs.run == 'true'
        run: npm ci
      - name: Install Playwright Browsers
        if: steps.e2e_changes.outputs.run == 'true'
        run: |
          if sudo -n true 2>/dev/null; then
            npx playwright install --with-deps chromium
          else
            echo "No passwordless sudo — installing browser binaries only."
            npx playwright install chromium
          fi

      - name: Set up Quarto
        if: steps.e2e_changes.outputs.run == 'true'
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: "1.6.39"
      - name: Remove .env.example
        if: steps.e2e_changes.outputs.run == 'true'
        run: rm -f .env.example
        # Quarto's dotenv validation requires non-empty example values, but CI
        # doesn't need the example file during the E2E render.
      - name: Build site for E2E
        if: steps.e2e_changes.outputs.run == 'true'
        uses: quarto-dev/quarto-actions/render@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          to: html
          path: .
      - name: Sync Frontend Assets
        if: steps.e2e_changes.outputs.run == 'true'
        run: python3 scripts/sync_frontend_assets.py

      - name: Run E2E Smoke Tests (Critical Flows)
        if: steps.e2e_changes.outputs.run == 'true'
        run: |
          npx playwright test \
            --project=chromium \
            --retries=0 \
            tests/e2e/smoke.spec.js
      - uses: actions/upload-artifact@v7
        if: failure() && steps.e2e_changes.outputs.run == 'true'
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  website-lint:
    needs: [pick-runner, quality-gate]
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    continue-on-error: true # Non-blocking: HTML validation errors need separate fix
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "20" }
      - name: Install & Lint
        run: |
          npm ci
          npm run lint:css
          npm run lint:html || echo "::warning::HTML validation has issues - fix separately"

  # =============================================================================
  # MATLAB TESTS - COMMENTED OUT BY DEFAULT
  # =============================================================================
  # This job requires a MATLAB license which is NOT available in GitHub CI.
  # DO NOT uncomment unless you have configured MATLAB licensing for your CI.
  # To enable: remove the comment markers below and configure matlab-actions.
  # Users with local MATLAB can run: matlab/run_all.m for equivalent tests.
  # =============================================================================
  # matlab-tests:
  #   needs: [pick-runner, quality-gate]
  #   runs-on: ${{ needs.pick-runner.outputs.runner }}
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: matlab-actions/setup-matlab@v2
  #     - uses: matlab-actions/run-command@v2
  #       with:
  #         command: |
  #           addpath('matlab');
  #           run_all

  # Cost optimization enforced

  # =============================================================================
  # RUST QUALITY GATE
  # =============================================================================
  # Only runs when Rust source files or Cargo manifests change.
  # Includes WASM build check since AffineDrift serves the web frontend.
  # =============================================================================
  rust-quality-gate:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for Rust changes
        id: rust-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            RUST_FILES=$(git diff --name-only "$BASE_SHA" HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || true)
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RUST_FILES=$(git diff --name-only "${{ github.event.before }}" HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || true)
          else
            RUST_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || echo "")
          fi

          if [ -n "$RUST_FILES" ]; then
            if [ -f "Cargo.toml" ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "Changed Rust files:"
              echo "$RUST_FILES"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "Rust files changed but no Cargo.toml found — skipping quality gate."
            fi
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Rust changes detected — skipping Rust quality gate."
          fi

      - name: Install Rust toolchain
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format Check (rustfmt)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo fmt --all -- --check

      - name: Lint (Clippy)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust Tests
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo test --all-features

      - name: WASM Build Check
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo build --target wasm32-unknown-unknown --features wasm -p tools-core 2>/dev/null || echo "No WASM crate yet — skipping"

      - name: Rust Quality Gate Summary
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          echo "## Rust Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ rustfmt: formatted" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ clippy: no warnings" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ cargo test: all tests pass" >> $GITHUB_STEP_SUMMARY
