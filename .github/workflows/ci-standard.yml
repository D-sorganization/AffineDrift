name: CI Standard
# Refreshed to verify path resolution
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install ruff==0.14.10 black==26.1.0 mypy==1.13.0 bandit==1.7.7 pydocstyle==6.3.0

      # Validate that CI tool versions match pre-commit config
      - name: Check Tool Version Consistency
        run: |
          echo "Validating tool versions match .pre-commit-config.yaml..."

          # Check Black version
          if ! grep -q "rev: 26.1.0" .pre-commit-config.yaml; then
            echo "::error::Black version mismatch between CI and pre-commit config"
            exit 1
          fi

          # Check Ruff version
          if ! grep -q "rev: v0.14.10" .pre-commit-config.yaml; then
            echo "::error::Ruff version mismatch between CI and pre-commit config"
            exit 1
          fi

          # Check MyPy version
          if ! grep -q "rev: v1.13.0" .pre-commit-config.yaml; then
            echo "::error::MyPy version mismatch between CI and pre-commit config"
            exit 1
          fi

          echo "✓ All tool versions are consistent"

      # FIX: Less aggressive Ruff (Errors, Warnings, Imports only)
      - name: Lint
        run: ruff check .

      # FIX: Enforce Black formatting (88 chars)
      - name: Check Formatting
        run: black --check .

      - run: pip install mypy types-PyYAML types-requests
      - run: pip install -r requirements.txt
      - name: Verify frontend asset sync
        run: python3 scripts/sync_frontend_assets.py --check
      - name: Verify Quarto Render Coverage
        run: python3 scripts/check_quarto_render_coverage.py
      - name: Verify CSS Budget
        run: python3 scripts/check_styles_budget.py
      - name: Install Tool Requirements
        run: |
          if [ -d "tools" ]; then
            find tools -name "requirements.txt" -exec pip install -r {} \;
          fi
      - run: mypy src/tools/ scripts/ --ignore-missing-imports || echo "::warning::Type checking has issues - fix type annotations"
      - name: Verify Code Quality
        run: python src/tools/code_quality_check.py

      - name: Verify Site Health (Broken Links Blocking)
        run: python src/tools/check_site_health.py --fail-on broken

      # FIX: Run Python-based MATLAB Quality Check (Works without License)
      # Non-blocking: Script not present in all repos
      - name: MATLAB Quality Check
        continue-on-error: true
        run: |
          if [ -f "tools/matlab_utilities/scripts/matlab_quality_check.py" ]; then
            python tools/matlab_utilities/scripts/matlab_quality_check.py --output-format text > matlab_quality_report.txt
            cat matlab_quality_report.txt
          else
            echo "MATLAB quality check script not found, skipping..."
          fi

      - name: Upload MATLAB Report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: matlab-quality-report
          path: matlab_quality_report.txt

  tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - name: Install Tool Requirements
        run: |
          if [ -d "tools" ]; then
            find tools -name "requirements.txt" -exec pip install -r {} \;
          fi
      - name: Run Tests
        env:
          PYTHONPATH: src
        run: pytest tests/ --cov=src/tools --cov-report=xml
      - name: Critical Tooling Coverage Gate
        run: |
          pytest \
            tests/test_check_site_health.py \
            tests/test_generate_sitemap.py \
            tests/test_update_navigation.py \
            tests/test_latex_to_qmd.py \
            --cov=src.tools.check_site_health \
            --cov=src.tools.update_navigation \
            --cov=src.tools.latex_to_qmd \
            --cov=scripts.generate_sitemap \
            --cov-report=term \
            --cov-fail-under=60
      - uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: true # BLOCKING: Requires CODECOV_TOKEN secret to be configured
          token: ${{ secrets.CODECOV_TOKEN }}

  js-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "20" }
      - name: Install Dependencies
        run: npm ci
      - name: Run JS Tests
        run: npm test -- --coverage
      - uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install Dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run E2E Tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  website-lint:
    needs: quality-gate
    runs-on: ubuntu-latest
    continue-on-error: true # Non-blocking: HTML validation errors need separate fix
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: "20" }
      - name: Install & Lint
        run: |
          npm ci
          npm run lint:css
          npm run lint:html || echo "::warning::HTML validation has issues - fix separately"

  # =============================================================================
  # MATLAB TESTS - COMMENTED OUT BY DEFAULT
  # =============================================================================
  # This job requires a MATLAB license which is NOT available in GitHub CI.
  # DO NOT uncomment unless you have configured MATLAB licensing for your CI.
  # To enable: remove the comment markers below and configure matlab-actions.
  # Users with local MATLAB can run: matlab/run_all.m for equivalent tests.
