name: Function Size Gate

on:
  pull_request:
    paths: ['src/**/*.py']

jobs:
  function-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check function sizes
        run: python scripts/check_function_size.py --threshold 66 --warn 40
