name: Quarto Syntax Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 8 * * 0,4" # Run every night at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-syntax:
    if: github.repository == 'D-sorganization/AffineDrift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Quarto Syntax Scanner
        run: |
          export PYTHONPATH=$PYTHONPATH:.
          python3 scripts/scan_quarto_syntax.py

      # Assessment E: Security scanning for dependency vulnerabilities
      - name: Audit Python Dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner=off || true
