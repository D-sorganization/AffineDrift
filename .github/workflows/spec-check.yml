# spec-check.yml — Specification Freshness Enforcement
#
# PURPOSE: Ensures SPEC.md is updated when source files change.
# DEPLOYMENT: Copy this file to .github/workflows/spec-check.yml in each repo.
#
# HOW IT WORKS:
# 1. On pull requests, detects which files changed
# 2. If source files changed but SPEC.md did not, posts a warning
# 3. Blocks merge unless spec-exempt label is applied or SPEC.md is updated
#
# CONFIGURATION: Edit the 'source_patterns' in the Check step to match
# your repo's source directories.

name: Spec Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: spec-check-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  spec-freshness:
    name: Verify SPEC.md freshness
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    # Skip if spec-exempt label is applied or if actor is dependabot
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'spec-exempt') && github.actor != 'dependabot[bot]' }}
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check if source files changed without SPEC.md update
        id: check
        shell: bash
        run: |
          # Fetch the base ref if not present so git diff works reliably
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          python3 scripts/ci/check_spec_freshness.py --base "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Post warning comment
        if: steps.check.outputs.needs_update == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = `## ⚠️ SPEC.md Update Required

            Source files were modified in this PR but \`SPEC.md\` was not updated, and no valid change fragment was found in \`changes/\`.

            **Per the [Specification-Driven Development Policy](https://github.com/D-sorganization/Repository_Management/blob/main/docs/SPECIFICATION_DRIVEN_DEVELOPMENT_POLICY.md):**
            - Any PR that adds, removes, or changes functionality must update SPEC.md or provide a change fragment
            - Update the relevant sections (features, architecture, tests, dependencies, etc.)
            - Add a change fragment via \`python shared_scripts/changes_fragment.py new --issue <issue> --summary "<summary>"\` (RM-5, Repository_Management#1976), OR add one change-log row:
              \`| YYYY-MM-DD | #<pr> | summary |\`. Do **not** bump the
              \`Spec Version\` field — it is release-derived
              ([RM #1520](https://github.com/D-sorganization/Repository_Management/issues/1520))

            **To resolve:**
            1. Add a change fragment in \`changes/<issue>-<slug>.md\` (recommended), OR
            2. Update \`SPEC.md\` to reflect your changes, OR
            3. Add the \`spec-exempt\` label if this PR genuinely doesn't affect the spec (e.g., pure refactor with no behavior change)

            *This check is enforced by the spec-check CI workflow.*`;

            // Check if we already posted a comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(c =>
              c.body.includes('SPEC.md Update Required') &&
              c.user.type === 'Bot'
            );

            if (!existingComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail if spec is stale
        if: steps.check.outputs.needs_update == 'true'
        shell: bash
        run: |
          echo "::error::Source files changed but neither SPEC.md was updated nor a valid change fragment was provided in changes/."
          echo "Add a change fragment, update SPEC.md, or add the 'spec-exempt' label to bypass."
          exit 1

      - name: Spec check passed
        if: steps.check.outputs.needs_update == 'false'
        shell: bash
        run: |
          echo "✅ Spec check passed."
          if [[ "${{ steps.check.outputs.spec_changed }}" == "true" ]]; then
            echo "   SPEC.md was updated alongside source changes. Good."
          elif [[ "${{ steps.check.outputs.fragment_valid }}" == "true" ]]; then
            echo "   Valid change fragment provided in changes/. Good."
          elif [[ "${{ steps.check.outputs.source_changed }}" == "false" ]]; then
            echo "   No source files changed — spec update not required."
          fi
