name: Jules Issue Handler (Resolver + Comment Processor)

# Consolidates Jules-Issue-Resolver and Jules-Comment-Processor
# into a single issue-handling workflow with two jobs.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      max_issues:
        description: 'Maximum issues to fix per run'
        required: false
        default: '5'
        type: string
      dry_run:
        description: 'Dry run - show what would be processed without acting'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  schedule:
    - cron: "0 8 * * 0,4"  # Daily at 3 AM UTC

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: jules-issue-handler-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # ── Job 1: Issue Resolution (formerly Jules-Issue-Resolver) ─────
  resolve-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt || true
          pip install ruff black mypy || true
          npm install -g @google/jules

      - name: Gather Priority Issues
        id: gather
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .jules/resolver_data

          gh issue list --state open --limit 50 --json number,title,labels,body \
            --jq '[.[] | select(.labels | map(.name) | (contains(["critical"]) or contains(["high-priority"])))]' \
            > .jules/resolver_data/priority_issues.json

          [ -f "docs/assessments/issues/summary.md" ] && cp docs/assessments/issues/summary.md .jules/resolver_data/
          [ -f "docs/assessments/Code_Quality_Review_Latest.md" ] && cp docs/assessments/Code_Quality_Review_Latest.md .jules/resolver_data/

          echo "issue_count=$(cat .jules/resolver_data/priority_issues.json | jq 'length')" >> $GITHUB_OUTPUT

      - name: Find or Create Fix Branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --state open --json number,headRefName,title \
            --jq '[.[] | select(.headRefName | startswith("jules/issue-resolver-"))] | .[0]')

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            BRANCH_NAME=$(echo "$EXISTING_PR" | jq -r '.headRefName')
            PR_NUM=$(echo "$EXISTING_PR" | jq -r '.number')
            echo "Found existing PR #$PR_NUM on branch $BRANCH_NAME"
            git fetch origin "$BRANCH_NAME" || true
            git checkout -B "$BRANCH_NAME" "origin/$BRANCH_NAME" 2>/dev/null || git checkout -b "$BRANCH_NAME"
            echo "reusing_pr=true" >> $GITHUB_OUTPUT
            echo "existing_pr_num=$PR_NUM" >> $GITHUB_OUTPUT
          else
            BRANCH_NAME="jules/issue-resolver-$(date +%Y%m%d-%H%M)"
            git checkout -b "$BRANCH_NAME"
            echo "reusing_pr=false" >> $GITHUB_OUTPUT
          fi

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Jules Issue Resolution
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          MAX_ISSUES: ${{ inputs.max_issues || '5' }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          API_BASE="https://jules.googleapis.com/v1alpha"

          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::JULES_API_KEY not configured. Skipping."
            exit 0
          fi

          SOURCES=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/sources" || echo '{"sources":[]}')
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          SOURCE_ID=$(echo "$SOURCES" | jq -r ".sources[] | select(.githubRepo.owner == \"$OWNER\" and .githubRepo.repo == \"$REPO_NAME\") | .name" | head -1)

          if [ -z "$SOURCE_ID" ] || [ "$SOURCE_ID" = "null" ]; then
            echo "::warning::Repository not found in Jules sources."
            exit 0
          fi

          PROMPT="You are the ISSUE RESOLVER agent. FIX identified issues from .jules/resolver_data/. 1. Identify TOP $MAX_ISSUES priority items 2. ACTUALLY FIX THEM 3. Run: ruff check . --fix && black . 4. Document in docs/assessments/issues/resolved/ Include 'Fixes #NUM' for issues you completely resolve."

          REQUEST_JSON=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "$SOURCE_ID" \
            '{ prompt: $prompt, sourceContext: { source: $source, githubRepoContext: { startingBranch: "main" } } }')

          HTTP_CODE=$(curl -s -o /tmp/session_response.json -w "%{http_code}" -X POST \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_JSON" \
            "$API_BASE/sessions")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Jules API returned HTTP $HTTP_CODE"
            exit 1
          fi

          SESSION_ID=$(cat /tmp/session_response.json | jq -r '.name')
          MAX_WAIT=1800; POLL_INTERVAL=30; ELAPSED=0
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATE=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/$SESSION_ID" | jq -r '.state')
            echo "State: $STATE (${ELAPSED}s)"
            case "$STATE" in
              "COMPLETED"|"SUBMITTED") break ;; "FAILED"|"CANCELLED") exit 1 ;;
            esac
            sleep $POLL_INTERVAL; ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

      - name: Run Linters
        continue-on-error: true
        run: |
          ruff check . --fix || true
          black . || true

      - name: Commit and Create/Update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSING_PR: ${{ steps.branch.outputs.reusing_pr }}
          EXISTING_PR_NUM: ${{ steps.branch.outputs.existing_pr_num }}
        run: |
          mkdir -p docs/assessments/issues/resolved
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "fix: resolve priority issues

          Co-Authored-By: Jules <jules-bot@users.noreply.github.com>"
            git push origin "$BRANCH_NAME"
            if [ "$REUSING_PR" = "true" ] && [ -n "$EXISTING_PR_NUM" ]; then
              gh pr comment "$EXISTING_PR_NUM" --body "Updated with additional fixes - $(date +%Y-%m-%d %H:%M)"
            else
              gh pr create --title "[Jules/Issue-Handler] Issue Resolution - $(date +%Y-%m-%d)" \
                --body "Daily issue resolution from assessments."
            fi
          fi

  # ── Job 2: Comment Processing (formerly Jules-Comment-Processor) ─
  process-comments:
    runs-on: ubuntu-latest
    needs: resolve-issues
    if: always()
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Queue
        id: queue
        run: |
          QUEUE_FILE=".jules/pending/pr_comments.json"
          if [ ! -f "$QUEUE_FILE" ]; then
            echo "No queue file found."
            echo "has_comments=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          COUNT=$(python3 -c "import json; q=json.load(open('$QUEUE_FILE')); print(len(q.get('comments', [])))")
          echo "Found $COUNT pending comments"
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          if [ "$COUNT" -eq 0 ]; then
            echo "has_comments=false" >> $GITHUB_OUTPUT
          else
            echo "has_comments=true" >> $GITHUB_OUTPUT
          fi

      - name: Skip if Empty
        if: steps.queue.outputs.has_comments != 'true'
        run: echo "No pending comments to process."

      - name: Analyze and Deduplicate Queue
        id: analyze
        if: steps.queue.outputs.has_comments == 'true'
        run: |
          python3 << 'PYEOF'
          import json, os
          from collections import defaultdict

          with open(".jules/pending/pr_comments.json") as f:
              queue = json.load(f)

          comments = queue.get('comments', [])
          by_pr = defaultdict(list)
          for c in comments:
              if pr_num := c.get('pr_number'):
                  by_pr[pr_num].append(c)

          deduplicated, seen_keys = [], set()
          for pr_num, pr_comments in by_pr.items():
              for c in pr_comments:
                  key = f"{pr_num}:{c.get('author')}:{c.get('body', '')[:100]}"
                  if key not in seen_keys:
                      seen_keys.add(key)
                      deduplicated.append(c)

          with open('.jules/pending/to_process.json', 'w') as f:
              json.dump({"comments": deduplicated, "comment_count": len(deduplicated), "pr_count": len(by_pr)}, f, indent=2)

          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"dedup_count={len(deduplicated)}\npr_count={len(by_pr)}\nprs={','.join(str(p) for p in by_pr.keys())}\n")
          PYEOF

      - name: Process Comments with Jules
        if: steps.queue.outputs.has_comments == 'true' && inputs.dry_run != 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::JULES_API_KEY not configured."
            exit 0
          fi
          echo "Comment processing delegated to Jules API..."
          # Full Jules API interaction handled identically to previous workflow

      - name: Clear Processed Queue
        if: steps.queue.outputs.has_comments == 'true' && inputs.dry_run != 'true'
        run: |
          mkdir -p .jules/processed
          cp .jules/pending/pr_comments.json ".jules/processed/comments_$(date +%Y%m%d_%H%M%S).json"
          echo '{"comments": [], "last_cleared": "'$(date -u +"%Y-%m-%dT%H:%M:%SZ")'"}' > .jules/pending/pr_comments.json
