name: Alpha War Calcs Integration

on:
  pull_request:
    paths:
      - "research/alpha-war/calcs/**"
      - ".github/workflows/alpha-war-calcs-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alpha-war-calcs-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub-hosted: clones sibling UpstreamDrift at the calcs lock pin.
  pinned-upstream-regeneration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt pytest-timeout

      - name: Clone pinned UpstreamDrift
        env:
          PIN: b700e58941205af6f673f13ebbffcd30f8cca9d8
        run: |
          git clone --depth 1 https://github.com/D-sorganization/UpstreamDrift.git /tmp/UpstreamDrift
          cd /tmp/UpstreamDrift
          git fetch --depth 1 origin "${PIN}"
          git checkout "${PIN}"

      - name: Regenerate and compare
        env:
          ALPHA_WAR_UPSTREAM_DRIFT_ROOT: /tmp/UpstreamDrift
          MPLBACKEND: Agg
          QT_QPA_PLATFORM: offscreen
        run: bash research/alpha-war/calcs/regenerate_calculations.sh

      - name: Repository integration gate test
        run: python3 -m unittest tests.test_alpha_war_integration_gate -v
