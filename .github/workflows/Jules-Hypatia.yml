name: Jules Hypatia (Librarian)

on:
  schedule:
    - cron: "0 8 * * 0,4" # Weekly on Friday at 5 AM PST (13:00 UTC)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          FLEET_MODE: ${{ vars.FLEET_RUNNER_MODE }}
        run: |
          MODE="${FLEET_MODE:-hybrid}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            cloud)
              echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
              echo "Routing to GitHub-hosted (mode=cloud)"
              ;;
            hybrid|*)
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "No idle fleet runners - falling back to GitHub-hosted"
              fi
              ;;
          esac

  archive-stale-docs:
    runs-on: self-hosted
    needs: pick-runner
    steps:
      - uses: actions/checkout@v4

      - name: Identify Stale Documentation
        id: find_stale
        run: |
          # Create archive directory if it doesn't exist
          mkdir -p archive/docs/jules_logs

          # Find .md files in .jules/ that haven't been touched in 30 days
          # We exclude 'sentinel.md' or specific journals if they are permanent records
          find .jules -name "*.md" -mtime +30 -not -name "sentinel.md" -print0 > files_to_move.txt

          if [ -s files_to_move.txt ]; then
            cat files_to_move.txt | xargs -0 -r -I {} mv {} archive/docs/jules_logs/
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Moved stale files to archive/docs/jules_logs/"
          else
            echo "No stale files found."
          fi
          # Clean up temp file
          rm files_to_move.txt

      - name: Commit Archived Files
        if: steps.find_stale.outputs.has_changes == 'true'
        run: |
          git config --global user.name "Jules-Hypatia"
          git config --global user.email "hypatia@jules.bot"
          git add archive/docs
          git add .jules
          git commit -m "chore(docs): archive stale agent logs > 30 days old"
          git push
