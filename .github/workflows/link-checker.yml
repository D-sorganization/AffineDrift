name: Link Checker

on:
  pull_request:
    paths:
      - "**.md"
      - "**.qmd"
      - "scripts/link-checker.py"
      - ".github/workflows/link-checker.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1" # Weekly, Monday at 2 AM UTC

permissions:
  contents: read
  issues: write

concurrency:
  group: link-checker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-links:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    name: Validate Quarto references and URLs
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Check internal references
        run: |
          python3 scripts/link-checker.py --root . --internal-only --verbose
        continue-on-error: true
        id: internal-refs

      - name: Site gate (cross-page links, related coverage, orphans, categories)
        run: |
          python3 -m pip install pyyaml pydantic
          PYTHONPATH=. python3 scripts/link-checker.py --site-gate --root .

      - name: Check external URLs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: |
          python3 scripts/link-checker.py --root . --external-only --verbose \
            --json-report link-checker-external-report.json
        continue-on-error: true
        id: external-urls

      - name: Report broken external links as a tracking issue
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            const marker = '<!-- link-checker:external-report -->';
            const reportPath = 'link-checker-external-report.json';
            const warnings = fs.existsSync(reportPath)
              ? JSON.parse(fs.readFileSync(reportPath, 'utf8'))
              : [];

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci,report,automation',
            });
            const trackingIssue = openIssues.find((issue) => issue.body?.includes(marker));

            if (warnings.length === 0) {
              if (trackingIssue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: trackingIssue.number,
                  body: 'All previously reported external links now resolve. Closing.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: trackingIssue.number,
                  state: 'closed',
                });
              }
              return;
            }

            // A URL or reason containing `|` would otherwise split its table cell.
            const cell = (value) => String(value).replace(/\|/g, '\\|');
            const rows = warnings
              .map((w) => `| ${cell(w.file)} | ${cell(w.url)} | ${cell(w.reason)} | [archive.org](${cell(w.archive_suggestion)}) |`)
              .join('\n');
            const body = [
              marker,
              `${warnings.length} broken external link(s) found by the scheduled link checker.`,
              '',
              '| File | URL | Reason | Archive.org fallback |',
              '| --- | --- | --- | --- |',
              rows,
              '',
              `_Last updated: ${new Date().toISOString()}_`,
            ].join('\n');

            if (trackingIssue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: trackingIssue.number,
                body,
                state: 'open',
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Weekly external link report',
                body,
                labels: ['ci', 'report', 'automation'],
              });
            }

      - name: Report results
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const internalStatus = '${{ steps.internal-refs.outcome }}';
            const externalStatus = '${{ steps.external-urls.outcome }}';

            let summary = '## Link Checker Results\n\n';

            if (internalStatus === 'success') {
              summary += '✅ Internal references: All valid\n';
            } else {
              summary += '❌ Internal references: Some broken (see job logs)\n';
            }

            if (externalStatus === 'success' || externalStatus === 'skipped') {
              summary += '✅ External URLs: All valid\n';
            } else {
              summary += '⚠️ External URLs: Some timeouts/errors (see job logs)\n';
            }

            summary += '\n**Note:** Internal reference failures block this check. External URL warnings are non-blocking.';

            console.log(summary);

            // Fail if internal refs are broken
            if (internalStatus === 'failure') {
              core.setFailed('Internal reference validation failed');
            }

      - name: Enforce check
        if: steps.internal-refs.outcome == 'failure'
        run: |
          echo '::error::Link checker found broken Quarto references'
          exit 1
