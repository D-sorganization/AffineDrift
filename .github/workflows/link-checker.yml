name: Issue 3976 Bounded Contract Validation

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact AffineDrift commit SHA to validate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: issue-3976-bounded-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  bounded-markerless-contract:
    name: Bounded markerless contract (-n 0)
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Validate exact target SHA
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          if ! [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_sha must be an exact lowercase 40-hex commit SHA"
            exit 1
          fi
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Checkout exact target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install bounded test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --no-cache-dir
          pytest==9.1.1 pytest-asyncio==1.4.0 pytest-timeout==2.4.0 pytest-xdist==3.8.0

      - name: Run bounded ZED synchronization contract
        run: >-
          python -m pytest -q -n 0 tests/test_mocap_camera_registry_contract.py
          -k zed_x_one_sync_evidence