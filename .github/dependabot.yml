version: 2

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 10
    reviewers:
      - D-sorganization
    labels:
      - dependencies
      - python
    commit-message:
      prefix: chore(deps)
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 5
    reviewers:
      - D-sorganization
    labels:
      - dependencies
      - ci/cd
    commit-message:
      prefix: chore(deps)
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 5
    reviewers:
      - D-sorganization
    labels:
      - dependencies
      - tooling
    commit-message:
      prefix: chore(deps)
      include: scope
