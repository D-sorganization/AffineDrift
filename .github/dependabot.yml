version: 2

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: chore(deps)
      include: scope
    open-pull-requests-limit: 10

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    reviewers:
      - D-sorganization
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    reviewers:
      - D-sorganization
    labels:
      - dependencies
      - ci/cd

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    reviewers:
      - D-sorganization
    labels:
      - dependencies
      - tooling
