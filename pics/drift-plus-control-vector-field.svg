<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="dpc-title dpc-desc" class="drift-plus-control-graphic">
  <defs>
    <style>
      .dpc-background { fill: var(--ad-bg-light, #f8fafc); }
      .dpc-grid-line { stroke: var(--ad-border-light, #e2e8f0); stroke-width: 1; }
      .dpc-axis { stroke: var(--ad-fg, #1e293b); stroke-width: 2; }
      .dpc-axis-label { fill: var(--ad-fg, #1e293b); font-family: system-ui, sans-serif; font-size: 14px; }
      .dpc-trajectory { stroke: var(--ad-fg, #1e293b); stroke-width: 2.5; fill: none; }
      .dpc-state-point { fill: var(--ad-fg, #1e293b); }
      .dpc-drift-vector { stroke: var(--ad-drift, #0284c7); stroke-width: 2.5; fill: none; marker-end: url(#dpc-drift-arrow); }
      .dpc-drift-label { fill: var(--ad-drift, #0284c7); font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .dpc-ztcf-trajectory { stroke: var(--ad-drift, #0284c7); stroke-width: 1.5; stroke-dasharray: 4,3; fill: none; opacity: 0.7; }
      .dpc-control-vector { stroke: var(--ad-control, #d97706); stroke-width: 2.5; fill: none; marker-end: url(#dpc-control-arrow); }
      .dpc-control-label { fill: var(--ad-control, #d97706); font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .dpc-total-vector { stroke: var(--ad-total, #16a34a); stroke-width: 2.5; fill: none; marker-end: url(#dpc-total-arrow); }
      .dpc-total-label { fill: var(--ad-total, #16a34a); font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; }
      .dpc-equation { fill: var(--ad-fg, #1e293b); font-family: 'Courier New', monospace; font-size: 12px; }
      .dpc-annotation { fill: var(--ad-fg, #1e293b); font-family: system-ui, sans-serif; font-size: 12px; }

      @media (prefers-color-scheme: dark) {
        .dpc-background { fill: var(--ad-bg-dark, #0f172a); }
        .dpc-grid-line { stroke: var(--ad-border-dark, #334155); }
        .dpc-axis { stroke: var(--ad-fg-dark, #f1f5f9); }
        .dpc-axis-label { fill: var(--ad-fg-dark, #f1f5f9); }
        .dpc-trajectory { stroke: var(--ad-fg-dark, #f1f5f9); }
        .dpc-state-point { fill: var(--ad-fg-dark, #f1f5f9); }
        .dpc-equation { fill: var(--ad-fg-dark, #f1f5f9); }
        .dpc-annotation { fill: var(--ad-fg-dark, #f1f5f9); }
      }

      [data-bs-theme="dark"] .dpc-background { fill: var(--ad-bg-dark, #0f172a); }
      [data-bs-theme="dark"] .dpc-grid-line { stroke: var(--ad-border-dark, #334155); }
      [data-bs-theme="dark"] .dpc-axis { stroke: var(--ad-fg-dark, #f1f5f9); }
      [data-bs-theme="dark"] .dpc-axis-label { fill: var(--ad-fg-dark, #f1f5f9); }
      [data-bs-theme="dark"] .dpc-trajectory { stroke: var(--ad-fg-dark, #f1f5f9); }
      [data-bs-theme="dark"] .dpc-state-point { fill: var(--ad-fg-dark, #f1f5f9); }
      [data-bs-theme="dark"] .dpc-equation { fill: var(--ad-fg-dark, #f1f5f9); }
      [data-bs-theme="dark"] .dpc-annotation { fill: var(--ad-fg-dark, #f1f5f9); }

      @media (max-width: 500px) {
        .dpc-axis-label { font-size: 11px; }
        .dpc-drift-label { font-size: 11px; }
        .dpc-control-label { font-size: 11px; }
        .dpc-total-label { font-size: 11px; }
        .dpc-equation { font-size: 10px; }
        .dpc-annotation { font-size: 10px; }
      }
    </style>

    <marker id="dpc-drift-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--ad-drift, #0284c7)" />
    </marker>
    <marker id="dpc-control-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--ad-control, #d97706)" />
    </marker>
    <marker id="dpc-total-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--ad-total, #16a34a)" />
    </marker>
  </defs>

  <title id="dpc-title">Drift Plus Control Vector Field Decomposition</title>
  <desc id="dpc-desc">State-space diagram showing how the passive mechanical drift vector f(x) and the active golfer control push vector G(x)u combine by vector addition into the total swing trajectory tangent dx/dt = f(x) + G(x)u, alongside the dashed pointwise Zero-Torque Counterfactual (ZTCF) rollout trajectory when u = 0.</desc>

  <!-- Background -->
  <rect width="800" height="420" class="dpc-background" />

  <!-- Grid lines (light guidance) -->
  <line x1="50" y1="20" x2="50" y2="380" class="dpc-grid-line" />
  <line x1="50" y1="380" x2="780" y2="380" class="dpc-grid-line" />

  <!-- Axes -->
  <line x1="50" y1="380" x2="780" y2="380" class="dpc-axis" />
  <line x1="50" y1="20" x2="50" y2="380" class="dpc-axis" />
  <polygon points="780,380 770,375 770,385" class="dpc-axis" />
  <polygon points="50,20 45,30 55,30" class="dpc-axis" />

  <!-- Axis labels -->
  <text x="760" y="405" class="dpc-axis-label" text-anchor="end">state</text>
  <text x="20" y="35" class="dpc-axis-label" text-anchor="start">phase</text>

  <!-- Reference marks on x-axis -->
  <line x1="120" y1="375" x2="120" y2="385" class="dpc-axis" />
  <line x1="250" y1="375" x2="250" y2="385" class="dpc-axis" />
  <line x1="480" y1="375" x2="480" y2="385" class="dpc-axis" />

  <!-- Axis tick labels -->
  <text x="120" y="402" class="dpc-axis-label" text-anchor="middle" font-size="12">start</text>
  <text x="250" y="402" class="dpc-axis-label" text-anchor="middle" font-size="12">early down</text>
  <text x="480" y="402" class="dpc-axis-label" text-anchor="middle" font-size="12">t₀</text>
  <text x="650" y="402" class="dpc-axis-label" text-anchor="middle" font-size="12">impact</text>

  <!-- Nominal trajectory x(t) from top of backswing to impact -->
  <path d="M 120,340 Q 180,280 250,240 Q 350,160 480,120 Q 600,100 680,95" class="dpc-trajectory" />

  <!-- State point x(t₀) in late downswing -->
  <circle cx="480" cy="120" r="3.5" class="dpc-state-point" />
  <text x="485" y="108" class="dpc-annotation">x(t₀)</text>

  <!-- Drift vector f(x) from state point (passive flow with u=0) -->
  <line x1="480" y1="120" x2="520" y2="145" class="dpc-drift-vector" />
  <text x="525" y="140" class="dpc-drift-label">f(x)</text>

  <!-- ZTCF rollout trajectory (dashed continuation of drift alone) -->
  <path d="M 480,120 Q 510,142 540,165 Q 570,190 600,215" class="dpc-ztcf-trajectory" />
  <text x="610" y="215" class="dpc-annotation" font-size="11" opacity="0.75">ZTCF (u=0)</text>

  <!-- Control vector G(x)u from same state point (golfer's active push) -->
  <line x1="480" y1="120" x2="520" y2="95" class="dpc-control-vector" />
  <text x="525" y="85" class="dpc-control-label">G(x)u</text>

  <!-- Total velocity vector dx/dt = f(x) + G(x)u (vector sum) -->
  <line x1="480" y1="120" x2="540" y2="140" class="dpc-total-vector" stroke-width="3" />
  <text x="545" y="135" class="dpc-total-label" font-weight="700">dx/dt</text>

  <!-- Parallelogram showing vector addition (light construction) -->
  <line x1="520" y1="145" x2="540" y2="140" class="dpc-annotation" stroke="var(--ad-border-light, #e2e8f0)" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />
  <line x1="520" y1="95" x2="540" y2="140" class="dpc-annotation" stroke="var(--ad-border-light, #e2e8f0)" stroke-width="1" stroke-dasharray="2,2" opacity="0.5" />

  <!-- Canonical control equation -->
  <text x="60" y="320" class="dpc-equation">dx/dt = f(x) + G(x)u</text>

  <!-- Legend -->
  <g>
    <rect x="60" y="50" width="250" height="110" fill="none" stroke="var(--ad-border-light, #e2e8f0)" stroke-width="1" opacity="0.5" />

    <line x1="75" y1="65" x2="95" y2="65" class="dpc-drift-vector" />
    <text x="105" y="70" class="dpc-annotation" font-size="12">Drift f(x): inertia, Coriolis,</text>
    <text x="105" y="85" class="dpc-annotation" font-size="12">centripetal, gravity (u=0)</text>

    <line x1="75" y1="100" x2="95" y2="100" class="dpc-control-vector" />
    <text x="105" y="105" class="dpc-annotation" font-size="12">Control G(x)u: golfer actuation</text>

    <line x1="75" y1="135" x2="95" y2="135" class="dpc-total-vector" stroke-width="3" />
    <text x="105" y="140" class="dpc-annotation" font-size="12" font-weight="600">Resultant: tangent to swing</text>
  </g>
</svg>
